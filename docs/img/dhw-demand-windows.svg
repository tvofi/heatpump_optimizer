<svg viewBox="0 0 980 496" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A 24-hour timeline of the hot-water tank temperature under the shipped optimizer's own plan. Two shaded demand frames, 06:00 to 08:30 and 17:00 to 22:00. The tank is heated before each frame opens and stays above the 45 degree minimum inside it, and drifts below between frames where there is no availability requirement. Underneath, the planned hot-water power, and a strip showing that the single frame 22:00-02:00 is parsed into two.">
