<svg viewBox="0 0 760 418" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A decay curve: the degrees per kWh still present in the hot-water tank against how long ago the kWh was delivered, measured from the shipped tank simulation over 24 hours.">
<style>text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }</style>
<rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<text x="22" y="28" font-size="16" font-weight="700" fill="#1c1c1c">Heat bought early is still there later, minus what leaked</text>
<text x="22" y="46" font-size="12" fill="#5a5a5a">Measured by perturbing ThermalModel.simulate_dhw_step, not by plotting the formula.</text>
<rect x="84" y="92" width="636" height="214" fill="#ffffff" stroke="#cfcfcf"/>
