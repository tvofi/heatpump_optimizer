# Draft quality_scale.yaml -- audit round 9, D10 seat s1 (Bronze + Silver cells only).
# Baseline 1936d5ca72a06556eeed4e8e5bf3dea520e517e1. Gold and Platinum rows are
# seat D10-s2's cells and are deliberately absent here. Evidence for every row:
# tools/audit/round9/D10/s1/REPORT.md tier table, and the harnesses beside this file.
# Differences from the in-tree custom_components/heatpump_optimizer/quality_scale.yaml:
# unique-config-entry, test-before-setup and action-exceptions are todo here
# (done in-tree); config-flow-test-coverage and test-coverage are left to the
# M3 measurement (seat D10-s2) and carried as the in-tree status, unverified.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: done
    comment: brand/icon.png 256x256 and brand/logo.png shipped in-repo
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: not re-measured by s1; the per-module coverage is D10.M3 (seat D10-s2)
  dependency-transparency: done
  docs-actions: done
  docs-triggers:
    status: exempt
    comment: the integration provides 0 triggers (no device_trigger.py)
  docs-conditions:
    status: exempt
    comment: the integration provides 0 conditions (no device_condition.py)
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: todo
    comment: >-
      a Tibber 401/403 during setup is delivered as ConfigEntryNotReady (and as
      UpdateFailed on a steady cycle), never ConfigEntryAuthFailed, so Home
      Assistant retries a revoked token forever (D10-s1-03, auth_failed.py)
  unique-config-entry:
    status: todo
    comment: >-
      the unique id is a digest of the Tibber token plus entity slots and is not
      re-stamped by reauth or the options entities page, so after either a
      fresh setup of the same plant is accepted as new (D10-s1-01,
      unique_id_drift.py)

  # Silver
  action-exceptions:
    status: todo
    comment: >-
      the Optimize-now button (a platform action) returns normally when the
      solve did not run, where the run_optimization action raises
      HomeAssistantError on the same state (D10-s1-02, press_vs_service.py)
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: not re-measured by s1; the per-module coverage is D10.M3 (seat D10-s2)
