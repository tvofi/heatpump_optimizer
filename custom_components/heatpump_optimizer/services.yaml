# Structure only. Every name and description lives in the translation
# catalogues (strings.json / translations/*.json) under "services", which
# is what async_get_all_descriptions prefers over the value here (#558 D5).
# hassfest allows a custom integration to keep them in either place, so
# nothing upstream would catch the two copies drifting apart.
run_optimization: null
set_away:
  fields:
    active:
      example: true
      selector:
        boolean: null
    return_time:
      example: '2026-09-06T18:00:00'
      selector:
        text: null
set_mode:
  fields:
    mode:
      required: true
      example: auto
      selector:
        select:
          options:
          - auto
          - comfort
          - economy
          - boost
          - 'off'
set_thermal_parameters:
  fields:
    house_thermal_mass:
      required: false
      example: 10.0
      selector:
        number:
          min: 0.5
          max: 80
          step: 0.5
          unit_of_measurement: kWh/°C
    house_heat_loss_coefficient:
      required: false
      example: 0.15
      selector:
        number:
          min: 0.01
          max: 1.0
          step: 0.01
          unit_of_measurement: kW/°C
    slab_thermal_mass:
      required: false
      example: 5.0
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.5
          unit_of_measurement: kWh/°C
    slab_heat_transfer:
      required: false
      example: 0.8
      selector:
        number:
          min: 0.02
          max: 5.0
          step: 0.1
          unit_of_measurement: kW/°C
    heat_pump_cop_nominal:
      required: false
      example: 3.5
      selector:
        number:
          min: 1.5
          max: 6.0
          step: 0.1
    upper_floor_thermal_mass:
      required: false
      example: 3.0
      selector:
        number:
          min: 0.25
          max: 60
          step: 0.5
          unit_of_measurement: kWh/°C
    lower_floor_thermal_mass:
      required: false
      example: 8.0
      selector:
        number:
          min: 0.25
          max: 60
          step: 0.5
          unit_of_measurement: kWh/°C
    inter_zone_heat_transfer:
      required: false
      example: 0.5
      selector:
        number:
          min: 0.01
          max: 3.0
          step: 0.1
          unit_of_measurement: kW/°C
    radiator_power_fraction:
      required: false
      example: 0.4
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
    window_area:
      required: false
      example: 10.0
      selector:
        number:
          min: 0.01
          max: 50
          step: 0.5
          unit_of_measurement: m²
    solar_heat_gain_coefficient:
      required: false
      example: 0.7
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.05
    dhw_tank_volume:
      required: false
      example: 200
      selector:
        number:
          min: 50
          max: 1500
          step: 10
          unit_of_measurement: L
    dhw_setpoint:
      required: false
      example: 55
      selector:
        number:
          min: 40
          max: 65
          step: 1
          unit_of_measurement: °C
    dhw_min_temperature:
      required: false
      example: 45
      selector:
        number:
          min: 35
          max: 55
          step: 1
          unit_of_measurement: °C
    dhw_daily_consumption:
      required: false
      example: 150
      selector:
        number:
          min: 50
          max: 1500
          step: 10
          unit_of_measurement: L/day
    dhw_cooling_rate:
      required: false
      example: 0.3
      selector:
        number:
          min: 0.05
          max: 3.0
          step: 0.05
          unit_of_measurement: °C/h
    buffer_cooling_rate:
      required: false
      example: 6.0
      selector:
        number:
          min: 0.5
          max: 30.0
          step: 0.5
          unit_of_measurement: °C/h
    dhw_schedule_enabled:
      required: false
      example: true
      selector:
        boolean: null
    dhw_windows:
      required: false
      example: 06:00-08:30, 17:00-22:00
      selector:
        text: null
    dhw_idle_min_temperature:
      required: false
      example: 20
      selector:
        number:
          min: 10
          max: 55
          step: 1
          unit_of_measurement: °C
    dhw_legionella_enabled:
      required: false
      example: true
      selector:
        boolean: null
    dhw_legionella_temperature:
      required: false
      example: 60
      selector:
        number:
          min: 55
          max: 70
          step: 1
          unit_of_measurement: °C
    dhw_legionella_interval_days:
      required: false
      example: 7
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: days
    wind_sensitivity_factor:
      required: false
      example: 0.03
      selector:
        number:
          min: 0.0
          max: 0.5
          step: 0.01
    rain_heat_loss_multiplier:
      required: false
      example: 1.15
      selector:
        number:
          min: 1.0
          max: 1.5
          step: 0.01
    ecl110_pid_time_constant_hours:
      required: false
      example: 1.5
      selector:
        number:
          min: 0.25
          max: 6.0
          step: 0.25
          unit_of_measurement: h
    ecl110_displace_min:
      required: false
      example: -20
      selector:
        number:
          min: -30
          max: 0
          step: 1
          unit_of_measurement: °C
    ecl110_displace_max:
      required: false
      example: 20
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: °C
simulate_plan:
  fields:
    target_temp:
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: °C
    min_temp:
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: °C
    max_temp:
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: °C
    comfort_weight:
      selector:
        number:
          min: 1
          max: 40
          step: 0.5
    comfort_temp_day:
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: °C
    comfort_temp_night:
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: °C
    dhw_setpoint:
      selector:
        number:
          min: 30
          max: 75
          step: 1
          unit_of_measurement: °C
    dhw_min_temperature:
      selector:
        number:
          min: 20
          max: 70
          step: 1
          unit_of_measurement: °C
    day_start_hour:
      selector:
        number:
          min: 0
          max: 23
          step: 1
    day_end_hour:
      selector:
        number:
          min: 0
          max: 24
          step: 1
    dhw_windows:
      selector:
        text: null
    wood_slots:
      selector:
        object: null
    wood_type:
      selector:
        text: null
    wood_packing:
      selector:
        text: null
    wood_price_sek_m3:
      selector:
        number:
          min: 0
          max: 10000
          step: 1
          unit_of_measurement: SEK/m³
    wood_furnace_efficiency:
      selector:
        number:
          min: 10
          max: 95
          step: 1
          unit_of_measurement: '%'
assign_entity:
  fields:
    key:
      required: true
      example: buffer_tank_temp_entity
      selector:
        text: null
    entity_id:
      required: true
      example: sensor.buffer_tank
      selector:
        text: null
    entry_id:
      selector:
        text: null
apply_topology:
  fields:
    layout:
      required: true
      example: two_tank_4way
      selector:
        text: null
    positions:
      selector:
        object: null
    entry_id:
      selector:
        text: null
    dhw:
      selector:
        boolean: null
    wood:
      selector:
        boolean: null
apply_schedule:
  fields:
    day_start_hour:
      selector:
        number:
          min: 0
          max: 23
          step: 1
    day_end_hour:
      selector:
        number:
          min: 0
          max: 24
          step: 1
    dhw_windows:
      selector:
        text: null
    comfort_temp_day:
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: °C
    dhw_min_temperature:
      selector:
        number:
          min: 35
          max: 55
          step: 1
          unit_of_measurement: °C
    entry_id:
      selector:
        text: null
apply_manual_plan:
  fields:
    space_slots:
      example:
      - start: '2024-01-01T06:00:00+01:00'
        end: '2024-01-01T08:00:00+01:00'
      selector:
        object: null
    dhw_slots:
      example:
      - start: '2024-01-01T17:00:00+01:00'
        end: '2024-01-01T18:30:00+01:00'
      selector:
        object: null
    expires_at:
      example: '2024-01-02T00:00:00+01:00'
      selector:
        text: null
    entry_id:
      selector:
        text: null
clear_manual_plan:
  fields:
    entry_id:
      selector:
        text: null
restore_learned_snapshot:
  fields:
    entry_id:
      selector:
        text: null
diagnose_interval:
  fields:
    entry_id:
      selector:
        text: null
