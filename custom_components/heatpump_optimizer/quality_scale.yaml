# Home Assistant integration quality scale — rule-by-rule register.
# Source: audit round 2, dimension D10 (baseline b39fc6f, 2026-09-02; verified
# by three refutation verifiers and a judge; register: docs/audit-2026-09.md,
# harnesses: tools/audit/round2/D10/ at 757e164). Updated as fixes land;
# re-truthed against execution by round 4 (harnesses under
# tools/audit/round4/D10/, issue #951).
#
# hassfest skips this file for custom integrations (validate_iqs_file returns
# early for non-core repos), but it is not true that nothing machine-enforces
# it: this repository's own gate does — tests/harness_headers.py executes the
# round-4 harness on every pull request and alarms on any row its executed
# check contradicts, and tests/entities.py pins the two coverage-bearing rows
# (the ones a toolchain-free check cannot decide) to the standing records in
# tests/coverage_budgets.json. It stays the truthful rule-by-rule record in
# the exact schema home-assistant/core uses, ready if this integration ever
# migrates to core.
#
# The manifest declares the tier this register supports cumulatively.
# config-flow-test-coverage is done again — re-measured at full coverage
# under the register's own instrument — so no Bronze blocker exists:
# every Bronze rule reads done, and every Silver rule with it. Gold is short
# of docs-examples alone, and because the scale is cumulative, Platinum's own
# three done rows do not raise the declaration above Silver. The tier is not
# transcribed from here by hand: tests/entities.py derives it from the rows
# below — walking the tiers in order and stopping at the first incomplete
# one — and refuses a manifest.json that disagrees in either direction, so
# the row that flips docs-examples is the same pull request that moves the
# manifest. hassfest cannot do that job: validate_iqs_file returns before it
# reads this file for a custom integration, and the manifest key is checked
# against the list of legal tier names and nothing else.
#
# Totals: 49 done (2 vacuous) · 4 exempt · 1 todo (#218 examples). Counted
# from this file, not carried:
#   python3 -c "import yaml,collections;r=yaml.safe_load(open(__import__('sys').argv[1]))['rules'];\
#   print(collections.Counter(v if isinstance(v,str) else v['status'] for v in r.values()))" <this file>
# The 45/5 this line carried before #542 was already two out in each direction.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: done
    comment: adapted check for a custom integration — brand assets shipped in-repo (brand/ 256×256), HACS validate green
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: >-
      measured at full statement coverage by tools/audit/w5-partition/
      coverage_tree.sh over the default-gate scripts — the instrument
      tests/coverage_ratchet.py consumes. The residual branches that
      instrument still found missed at the merge base of this flip
      (#951, R4-D10-01, re-derived rather than carried: the tree had
      grown under that finding) are covered by the residual section of
      tests/config_flow_steps.py; the one branch no input can reach,
      _page_schema's empty-group guard, was removed as dead code with
      the reason recorded in that pull request (#542 precedent) rather
      than pragma'd. The claim is keyed, not quoted:
      tests/coverage_budgets.json holds the module's recorded percentage
      as config_flow_percent_floor, the per-pull-request coverage job
      ratchets it through tests/coverage_ratchet.py, and tests/entities.py
      refuses this row disagreeing with that record in either direction
      — so the done cannot rot the way the previous one did. History:
      #542 removed the last unreachable statements, #543 covered the
      reachable ones (#304), the tree then grew new branches under the
      claim, and this row re-took the measurement with the instrument
      named above.
  dependency-transparency: done
  docs-actions: done
  docs-triggers:
    status: done
    comment: vacuous — the integration provides 0 triggers
  docs-conditions:
    status: done
    comment: vacuous — the integration provides 0 conditions
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      #216 (round 2, D10-16) landed: every raise site carries
      translation_domain + translation_key. Logging latches rather than
      repeating an ERROR per failed poll (comment re-truthed by #951: this
      comment described the spam the rule forbids): the first failed fetch
      logs ERROR, later failures DEBUG, recovery INFO with the outage's
      length — _tibber_fetch_failed / _tibber_fetch_recovered and the
      weather pair beside them.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: >-
      re-truthed by #951 (R4-D10-01): the todo this row carried tracked
      issue #195, whose coverage tranches landed and the issue closed. The
      Silver rule asks that every module clear its bar; the standing
      record is tests/coverage_budgets.json — the floor the
      per-pull-request coverage job ratchets, over the same instrument
      the residual tranche measured with — and tests/entities.py pins this
      row to that floor, so the row cannot again disagree with the
      measurement in either direction.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: cloud API (Tibber) + user-picked HA entities; 0 discovery-mechanism imports
  discovery-update-info:
    status: exempt
    comment: no network addresses to update; same basis as discovery
  docs-data-update: done
  docs-examples:
    status: todo
    comment: >-
      issue #218 (round 2, D10-18) — the rule asks for blueprints in the
      home-assistant.io blueprint exchange, linked from the docs, and says
      a documentation page is not a substitute. Importable blueprints now
      exist in-tree — 3 files under blueprints/automation/, linked from
      README.md and docs/automations.md — but the row stays todo: the
      exchange listing itself is an owner-side forum action that does not
      exist yet, and it is the flip's precondition.
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: 0 device-registry create sites; single static DeviceInfo
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations:
    status: done
    comment: >-
      #217 (round 2, D10-17) landed: exceptions section present in
      strings.json / en / sv with an entry for every raise site.
  icon-translations:
    status: done
    comment: >-
      issue #189 (round 1, D10-13) — every entity's icon in icons.json keyed
      by translation key, the 4 that duplicated a device-class default
      removed, zero _attr_icon pins left (tests/entities.py "Entity icons",
      harness tools/audit/round2/D10/icons_harness.py at 757e164). #558 D4 added state
      sections for the three sensors #571 bounded with ENUM; the two it
      refused stay bare, because a state icon is looked up by the state
      string and theirs are unbounded. Counts are derived by that section,
      not recorded here.
  reconfiguration-flow:
    status: done
    comment: >-
      #196 (round 1, D10-14) landed: async_step_reconfigure writes the
      entry and aborts with a reason strings.json declares.
  repair-issues: done
  stale-devices:
    status: exempt
    comment: device lifetime equals config-entry lifetime; 0 removal sites

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: done
    comment: >-
      #303 paid the pinned-ruler census to 0. py.typed is not owed — the
      Platinum rule's marker-file half does not apply to a custom
      integration. #829.
