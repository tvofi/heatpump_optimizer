# Home Assistant integration quality scale — rule-by-rule register.
# Source: audit round 2, dimension D10 (baseline b39fc6f, 2026-09-02; verified
# by three refutation verifiers and a judge; register: docs/audit-2026-09.md,
# harnesses: tools/audit/round2/D10/). Updated as fixes land.
#
# hassfest skips this file for custom integrations (validate_iqs_file returns
# early for non-core repos), so nothing here is machine-enforced today — it is
# the truthful rule-by-rule record in the exact schema home-assistant/core
# uses, ready if this integration ever migrates to core.
#
# The manifest deliberately declares no `quality_scale` tier: one Bronze rule
# is still todo, so no tier can honestly be declared yet.
#
# Totals: 45 done (2 vacuous) · 4 exempt · 5 todo (3 verified findings #216–#218,
# 4 tracked round-1 issues among them).
