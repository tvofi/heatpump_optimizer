# The inert CI umbrella stub (R10-CI-LAYOUT PR 0; DESIGN-P1 step 5b).
#
# `workflow_dispatch` dispatches only a file that exists on the default
# branch, so without this file on main no `probe/ci-layout-<unit>` ref can
# dispatch the umbrella and the fan-out's live work cannot run. It does
# nothing: one job that runs `true`, no grant, no other trigger, no `uses:`.
# It writes no check at any pull-request head, because nothing dispatches it
# there; the umbrella pull request replaces it. `tests/entities.py` pins it
# inert, and `tests/closure.py` lists it in GATE_FILES, because the umbrella
# that replaces it defines the gate.

name: CI

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number (unused by the stub)"
        required: false
        type: string
      base:
        description: "Base SHA (unused by the stub)"
        required: false
        type: string
      recheck:
        description: "Re-judge only (unused by the stub)"
        required: false
        type: string
      no-skip:
        description: "Disable lane skipping (unused by the stub)"
        required: false
        type: string

permissions: {}

jobs:
  stub:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 1
    steps:
      - run: "true"
