name: Feature request
description: Something you would like the integration or its card to do.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the need, not only a solution: that is what lets us find the best way to meet it.
        Thought it through in detail and have a design in mind? Use **Feature request with design notes** instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem or need
      description: In your own words — what you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Heat pump or controller (brand and model), how the integration controls it (none, on/off switch, ECL110, heat-curve offset or stored parameter, compressor frequency), and your price source or tariff type if it matters (Tibber, Nord Pool, fixed, time-of-use).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Optional. An automation, a manual step, or not at all.
