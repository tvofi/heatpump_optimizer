name: Nightly

# The lanes no pull request runs, split out of tests.yml (R10-CI-LAYOUT PR 1,
# DESIGN-P1 section 2(a) at archive/probe/design-ci-rev4): their failures no
# longer share a workflow, and so a verdict, with the pull-request gate, and
# their rows leave every pull request's check list.
#
# * mutation-nightly, mutation-ledger, mutation-ledger-push -- the mutation
#   instrument over the whole package, and the stock drain with its push.
# * slow -- what a push to main's `fast` does not already run.
# * nightly-ha -- real Home Assistant; tests.yml keeps its pull-request arm.
# (card C5, tvofi 2026-11-05: record-autofix and the push trigger it alone
# needed are deleted; the PR list and #201 at merge time are the record.)
#
# `tests/nightly_status.py` reads this workflow's last concluded schedule or
# main dispatch, on every pull request; every job is in its
# REQUIRED_LANES, which tests/entities.py derives from the `if:`s below. After
# a red, verify with `gh workflow run nightly.yml --ref main`.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 0 * * *"

# Every job inherits this read-only floor; the ledger push writes through an
# App installation token from its own environment.
permissions:
  contents: read

# By run id, never cancelled: a nightly or a record beat stopped half way is
# worse than two side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # The same instrument over the whole package, which only the nightly can
  # afford. A pull request cannot see this lane at all, so it is registered in
  # `tests/nightly_status.py`'s REQUIRED_LANES and `tests/entities.py` derives
  # that coupling from this job's own `if:` -- an unregistered schedule-only
  # lane fails there rather than going dark the way #533's did.
  #
  # Deliberately one job and not split across several: the cap is a fraction
  # of one pool, so two half-runs would each judge their own half against a
  # cap measured over the whole.
  mutation-nightly:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Its driver set includes tests/entities.py, whose handover checks ask
          # git whether `updated-for:` is an ancestor -- unanswerable at depth 1.
          # The driver then fails at the BASELINE, mutation_table.py refuses with
          # "the baseline is already red", and the nightly is red having run no
          # mutant at all. Its sibling `mutation` above already carries this for
          # the same reason; this job was the one that never got it.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned test dependencies
        run: >-
          pip install --require-hashes
          --build-constraint tests/requirements-build.txt
          -r tests/requirements-ci.txt

      # The prior nightly's pool measurement (RCA-1565). The lane bounds each
      # driver's first run by `driver_timeout`, which scales a solo recording the
      # 3-worker pool can cost several times over -- measured 0.47x-3.27x across
      # the 51 driver rows of the three 2026-10-07/08 nightly runs, by the rule
      # in dev/audit/rca/R9-NIGHTLY-MUTATION-BOUND.md §2, so the top of that range
      # is above the scale's own 3x and a band-stale recording leaves ~1.5x of
      # headroom. `--pool-seconds` seeds the bound from the cost the lane measured
      # last run, so it covers the pool cost instead of 3x a number
      # `SECONDS_BAND` keeps up to 2x stale. The cache needs no write grant and no
      # secret, so this job keeps both (decision 0011: "the measuring job holds no
      # secret and no write grant"). A miss (first run, eviction) seeds nothing and
      # the bound falls back to the solo recording -- today's behaviour, never a
      # smaller bound.
      - name: Restore the prior pool measurement
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pool-seed
          key: pool-seconds-${{ github.run_id }}
          restore-keys: pool-seconds-

      # --budget-minutes (R9-F10.12): the run starts no mutant that would end
      # past 270 of the job's 330 minutes, so the drivers' growth shrinks the
      # night's sample, named as partial, instead of timing the job out. The
      # 60 minutes left cover the runs in flight, each under its scaled
      # timeout. mutation-ledger below is sized the same way.
      # The seed rotates by date, as mutation-ledger's does (R9-F10.13): the
      # constant default drew the same sample every night, so the tail the
      # budget cuts would stay unevaluated for good. The draw is the same
      # size; a killed_by pin it happens to draw is re-driven with its own
      # killer first, and the report below names each one that was not
      # reproduced, for a human to re-pin, triage or cover with a test. The
      # job never edits a pin, and stays green on one (ci-autofix.md).
      - name: Drive the table over the whole package
        shell: bash
        run: |
          set -o pipefail
          python3 tests/mutation_table.py \
            --scope full --max 40 --jobs 3 --budget-minutes 270 \
            --seed "$(date -u +%Y%m%d)" \
            --pool-seconds "$RUNNER_TEMP/pool-seed/pool_seconds.json" \
            | tee "$RUNNER_TEMP/mutation-table-full.txt"

      - name: Report the pins the draw did not reproduce
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/mutation-table-full.txt"
          test -s "$f" || exit 0
          {
            echo "### mutation-nightly: pin re-verification"
            echo '```'
            grep -E 'PIN NOT REPRODUCED|pin not re-verified|PIN RE-VERIFICATION' "$f" || echo "no pinned site drawn"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E 'PIN NOT REPRODUCED' "$f" | while IFS= read -r line; do
            echo "::warning title=pin not reproduced::${line}"
          done || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-table-full
          path: ${{ runner.temp }}/mutation-table-full.txt
          if-no-files-found: ignore

  # The pre-ratchet stock's path to a disposition (R9 RCA I1, residual (a)).
  # `mutation-nightly` samples the whole package and records nothing, and
  # `--pin-killed` reaches only the sites a diff adds, so the unpinned sites
  # that predate the ratchet had no way out. This job drives a slice of that
  # stock -- whole anchors, walked by the run's seed -- with the same kill rule,
  # baseline and null control, and hands what it killed to the next job. It
  # holds no write grant; the job that pushes runs no driver (D11-s1-03).
  # Main only (#1848): a dispatch on any other ref would drive that ref's
  # tree and kill rule, and its kills would be pushed to main.
  #
  # SHARDED four ways (triage s6-batch16 P85): one runner drove 40 sites a
  # night, about 24 kills, against ~3400 killable. `--shard K/4` deals the
  # night's slice -- drawn at four times --max under the one run seed -- by
  # whole anchor (`drain_pool`), so the shards are disjoint and together the
  # slice one runner would not have had the hours for. Each shard uploads its
  # own artifact; the one push merges them (`merge_pin_shards`).
  #
  # The seed is the RUN id, not the date (R10-HOTFIX-NIGHTLY-PIN-THROUGHPUT):
  # every run draws from the unpinned stock as it stood at its checkout, so
  # two runs one UTC date apart by less than a drive -- a dispatch beside the
  # schedule -- drew one slice twice. Run 42139479636 killed 90 sites and
  # landed 20 pins, the other 70 pushed first by dispatch 42135552492 under
  # the same date seed (dev/audit/harnesses/nightly_drain_breakdown.py
  # --prior). The four shards of a run still share one seed, so they stay
  # disjoint; the seed is printed in each DRAIN SHARD header, so a night's
  # draw replays as before.
  #
  # --budget-minutes 270, mutation-nightly's sizing under the same 330-minute
  # timeout (R10-HOTFIX-NIGHTLY-PIN-THROUGHPUT): at 240, 185 of the 320 sites
  # run 42139479636 drew were never started, while its longest shard ended
  # 225 minutes into its 330 (nightly_drain_breakdown.py; the jobs API's
  # started_at and completed_at). The 60 minutes left cover the runs in
  # flight, each under its scaled timeout.
  mutation-ledger:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      # A shard that clips or fails must not cancel the others mid-drive: each
      # uploads (`if: always()`) what it measured.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned test dependencies
        run: >-
          pip install --require-hashes
          --build-constraint tests/requirements-build.txt
          -r tests/requirements-ci.txt

      # The prior nightly's pool measurement (RCA-1565); see mutation-nightly's
      # restore step. This job is the one that persists the fresh measurement
      # back (the save step below), because it is the lane with a `--drain`
      # directory the measurement is written into.
      - name: Restore the prior pool measurement
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pool-seed
          key: pool-seconds-${{ github.run_id }}
          restore-keys: pool-seconds-

      # Survivors are listed for a human verdict, never triaged here
      # (ci-autofix.md); the step is green on them, and red only when the
      # run itself refused or crashed, which leaves no status behind.
      - name: Drive a slice of the unpinned stock
        shell: bash
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/mutation-ledger"
          python3 tests/mutation_table.py \
            --scope full --drain "$out" --shard ${{ matrix.shard }}/4 \
            --max 80 --jobs 4 \
            --seed "${{ github.run_id }}" --budget-minutes 270 \
            --pool-seconds "$RUNNER_TEMP/pool-seed/pool_seconds.json" \
            | tee "$RUNNER_TEMP/mutation-ledger.txt"
          test -s "$out/status"
          {
            echo "### mutation-ledger shard ${{ matrix.shard }}/4: $(cat "$out/status")"
            echo
            echo "Sites left for a human verdict (killing check or survivor_triage):"
            echo '```'
            cat "$out/survivors.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/mutation-ledger.txt" "$out/"

      # Persist the pool cost this lane measured, for the next nightly's bound
      # (RCA-1565). `if: always()`: mutation_table writes pool_seconds.json from
      # its own `finally`, so the measurement exists even on the night the lane
      # refused on its bound -- exactly the night the next run needs it. This is
      # the trap the RCA names: the natural carrier (mutation-ledger-push) is
      # gated on this job's SUCCESS, so it does not run then; the cache save
      # rides this job instead, which runs on the schedule whatever the drive
      # concluded, and needs no write grant and no secret. The file carries the
      # prior seed merged with this run's measurements, so a refusal night with
      # no new measurement still forwards the seed it read rather than clobbering
      # it with an empty one. One shard saves (the key is per run id, so a
      # second saver would collide): shard 1's file is its own measurement
      # merged over the prior seed, which every shard restored alike.
      - name: Save the pool measurement for the next nightly
        if: always() && matrix.shard == 1
        run: |
          mkdir -p "$RUNNER_TEMP/pool-seed"
          cp "$RUNNER_TEMP/mutation-ledger/pool_seconds.json" \
             "$RUNNER_TEMP/pool-seed/pool_seconds.json" 2>/dev/null \
            && echo "staged the pool measurement for the cache" \
            || echo "no pool_seconds.json measured this run; the prior seed stays"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && matrix.shard == 1
        # Fail-soft: a cache key is immutable, so a RE-RUN of this job (same
        # run_id) would collide on the key. The seed is a bound cover, not a
        # verdict -- a missed save only means the next nightly restores an older
        # measurement, never a wrong one -- so a save that cannot happen must not
        # redden the lane.
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/pool-seed
          key: pool-seconds-${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-ledger-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutation-ledger
          if-no-files-found: ignore

  # Commits what `mutation-ledger` killed to main, as the ledger-writer App
  # through its own installation token -- so this job keeps the workflow's
  # read-only floor; GITHUB_TOKEN writes nothing here
  # (decision 0011's amendment): only NEW rows under
  # tests/mutation_ledger/killed_by/, under the subject `ci: record nightly
  # kills`. No driver runs here. A main that moved since the measurement
  # keeps only the pins whose killing script's closure still holds the
  # mutated module (`stale_pins`), and every pin is re-checked against main's
  # own inventory (`apply_drained`): a changed line is dropped, and a second
  # apply of one slice writes nothing. The
  # credential lives in the `ledger` environment, whose deployment branches
  # are main alone, so no other ref's job can mint it; absent, the job is red.
  # The commits sent are checked before the push (`drain_push_problems`).
  mutation-ledger-push:
    needs: [mutation-ledger]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && needs.mutation-ledger.result == 'success'
    environment: ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # One artifact per shard (mutation-ledger-1..4), each in its own
      # subdirectory; `merge_pin_shards` folds them into the one directory
      # `apply_drained` reads: the pins, the status and the survivors' union.
      - name: Download the slices the mutation-ledger shards measured
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: mutation-ledger-*
          path: ${{ runner.temp }}/mutation-ledger-shards

      - name: Merge the shards into one slice
        run: |
          python3 -I -c 'import sys; sys.path.append("tests"); import mutation_table as m; print("shards merged:", m.merge_pin_shards(sys.argv[1], sys.argv[2]))' \
            "$RUNNER_TEMP/mutation-ledger-shards" "$RUNNER_TEMP/mutation-ledger"

      - name: Mint the ledger-writer App token
        id: mint
        env:
          REPO: ${{ github.repository }}
          LEDGER_PEM: ${{ secrets.HPO_LEDGER_PEM }}
          LEDGER_APPID: ${{ secrets.HPO_LEDGER_APPID }}
        run: |
          { set +x; } 2>/dev/null  # the PEM, JWT and token are never traced
          if [ -z "$LEDGER_PEM" ] || [ -z "$LEDGER_APPID" ]; then
            echo "::error::HPO_LEDGER_PEM or HPO_LEDGER_APPID is not set in the ledger environment; the slice is not recorded (fail-closed: the report step reddens skip-no-writer)"
            exit 0
          fi
          umask 077
          API=https://api.github.com
          ACCEPT='Accept: application/vnd.github+json'
          key="$RUNNER_TEMP/hpo-ledger.pem"
          jwt_h="$RUNNER_TEMP/hpo-ledger-jwt.h"
          trap 'rm -f "$key" "$jwt_h"' EXIT
          trap 'exit 130' INT TERM HUP
          printf '%s\n' "$LEDGER_PEM" > "$key"
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          h=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          p=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$LEDGER_APPID" | b64)
          s=$(printf '%s.%s' "$h" "$p" | openssl dgst -sha256 -sign "$key" -binary | b64) && [ -n "$s" ] || {
            echo "::warning::signing the ledger-writer App JWT failed"
            exit 1
          }
          printf 'Authorization: Bearer %s.%s.%s\n' "$h" "$p" "$s" > "$jwt_h"
          inst=$(curl -fsS -H @"$jwt_h" -H "$ACCEPT" "$API/repos/$REPO/installation" \
            | python3 -I -c 'import sys,json; print(int(json.load(sys.stdin)["id"]))') || {
            echo "::warning::the ledger-writer App has no installation on $REPO, or its JWT was refused"
            exit 1
          }
          tok=$(curl -fsS -X POST -H @"$jwt_h" -H "$ACCEPT" \
            -d '{"permissions":{"contents":"write"}}' \
            "$API/app/installations/$inst/access_tokens" \
            | python3 -I -c 'import sys,json; print(json.load(sys.stdin)["token"])') && [ -n "$tok" ] || {
            echo "::warning::minting the ledger-writer App installation token failed"
            exit 1
          }
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"

      # Apply, check the write set, commit and push, re-applied onto a main
      # that moved under the push (three tries; never a force). Every status
      # reaches the report below, which reddens one a slice was owed.
      - name: Record the killed sites on main
        id: record
        env:
          PINS: ${{ runner.temp }}/mutation-ledger
          TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -uo pipefail
          status=""
          if [ -z "$TOKEN" ]; then
            status="skip-no-writer"
          else
            AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
            echo "::add-mask::$AUTH"
            git config user.name "hpo-ledger[bot]"
            git config user.email "hpo-ledger[bot]@users.noreply.github.com"
            for try in 1 2 3; do
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
                fetch -q origin main && git reset -q --hard origin/main || { status="skip-fetch-failed"; break; }
              status=$(python3 -I - <<'PY'
          import os, subprocess, sys
          sys.path.append("tests")
          import mutation_table as m
          pins = os.environ["PINS"]
          head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True,
                                text=True).stdout.strip()
          try:
              at = open(os.path.join(pins, "head")).read().strip()
          except OSError:
              at = ""
          changed = m.drain_changed(at, head)
          status = m.apply_drained(pins, head, changed)
          if status == "changed":
              st = subprocess.run(["git", "status", "--porcelain",
                                   "--untracked-files=all"],
                                  capture_output=True, text=True).stdout
              bad = m.drain_write_set_problems(st)
              for b in bad:
                  print(f"outside the writer's grant: {b}", file=sys.stderr)
              status = "skip-write-set" if bad else status
          print(status)
          PY
              ) || status="skip-apply-crashed"
              [ "$status" = "changed" ] || break
              git add tests/mutation_ledger/killed_by/
              git commit -q -m "ci: record nightly kills"
              if ! python3 -I -c 'import sys; sys.path.append("tests"); import mutation_table as m; bad = m.drain_push_problems(); print("\n".join(bad), file=sys.stderr); sys.exit(1 if bad else 0)'; then
                status="skip-commit-set"
                break
              fi
              if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
                   push origin HEAD:refs/heads/main; then
                break
              fi
              status="skip-push-refused"
            done
          fi
          echo "MUTATION LEDGER: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Report whether the slice reached main
        if: always()
        run: |
          python3 -I -c 'import sys; sys.path.append("tests"); import mutation_table as m; sys.exit(m.drain_report(sys.argv[1]))' \
            "${{ steps.record.outputs.status }}"

  slow:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned test dependencies
        run: >-
          pip install --require-hashes
          --build-constraint tests/requirements-build.txt
          -r tests/requirements-ci.txt

      - name: Resolve the golden comparison ref
        run: |
          # Nightly runs sit on main; comparing against the commit before
          # the latest lets the drift gate re-verify the newest merge.
          # There is no fallback on purpose: `|| git rev-parse HEAD` used to
          # sit here, and a ref that resolves to HEAD compares the tree
          # against itself -- byte-identical by construction, so no drift can
          # ever be reported and every claim is stale. env_drift.py now
          # refuses that state; failing here instead says which step is at
          # fault. A root commit (no HEAD^1) is the only way to get here.
          REF=$(git rev-parse --verify --quiet 'HEAD^1^{commit}') || {
            echo "HEAD has no first parent, so there is nothing to compare"
            echo "this tree against. The drift gate needs a real baseline;"
            echo "check out main with history (fetch-depth: 0) and re-run."
            exit 1
          }
          echo "GOLDEN_REF=${REF}" >> "$GITHUB_ENV"

      # Unique to this job vs a push-to-main `fast` run: the committed-fixture
      # value report (#347, level 3), per fixture rather than as a count.
      # `fast` already ran the rest of the suite on the last merge. Levels 1
      # and 2 gate there; this never fails anything: the numbers are the
      # runner's own.
      - name: Report committed-fixture drift values
        env:
          GOLDEN_MODE: drift
          DRIFT_VALUE_REPORT: "1"
          PYTHONPATH: tests/hastub
        run: python3 tests/env_drift.py --all "$GOLDEN_REF"

      - name: Closed-loop simulation
        env:
          PYTHONPATH: tests/hastub
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python3 tests/rolling.py

      # The suite under a configured zone that is not UTC (R10-SUITE-
      # HOST-DETERMINISM): every other lane runs with HASTUB_TZ unset, so a
      # check naming an instant as a naive or UTC literal, while production
      # reads the configured zone's wall clock, stays green there. Kolkata
      # is a half-hour offset far from UTC; the two scripts are the ones
      # the round-1 and round-2 reviews read red under a non-UTC zone. Its
      # own step, so its red is its own; the whole sweep, by hand, is
      # dev/audit/harnesses/host_zone_features.py --suite.
      - name: Zone-sensitive scripts under Asia/Kolkata
        if: success() || failure()
        env:
          PYTHONPATH: tests/hastub
          HASTUB_TZ: Asia/Kolkata
          TZ: Asia/Kolkata
        run: |
          python3 tests/features.py
          python3 tests/finite_boundary.py

      # Recorded days (tests/replay/*.json, written by tools/replay/export.py)
      # fed through the real coordinator cycle by cycle, every published
      # entity judged -- the lane #1499 argued for: a defect found in use
      # after seven synthetic audit rounds. Its own step, run whatever the
      # suite above concluded, so its red is its own. The full run; a pull
      # request runs it only when its diff reaches what it times (tests.yml's
      # `replay` job, R10-REPLAY-SCOPED).
      - name: Replay recorded days through the real coordinator
        if: success() || failure()
        env:
          PYTHONPATH: tests/hastub
        run: python3 tests/replay.py

  # Real Home Assistant, nightly and on demand (#521): the steps are the
  # composite action tests.yml's pull-request arm of this job also runs, so
  # the two cannot drift. tests.yml's own comment on that job carries the
  # lane's history (#511, #2056, #533). Not a required context.
  nightly-ha:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Unrequired, and on a pull request its verdict is about the pull
    # request's own driver: it grades nothing (codeowners_gap.py's rule), so
    # the driver it runs from the pull request's copy needs no pin.
    env:
      HPO_JOB_GRADES: nothing
    strategy:
      # Both images report. A floor that breaks while stable does not is the
      # most informative outcome this lane has, and fail-fast would hide it.
      fail-fast: false
      matrix:
        # The floor the integration supports (#514), and whatever is current.
        image: ["2025.2.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/nightly-ha
        with:
          image: ${{ matrix.image }}
