name: Release

# Two ways in, one result: a GitHub Release whose body is the version's
# own section of RELEASE_NOTES.md — the notes are written once, in the
# repo, and the release page quotes them verbatim.
#
# * Push a version tag (v4.0.0, v4.1.0, ...) and it releases that tag.
# * Run the workflow by hand with a tag name and it CREATES the tag at
#   the commit it runs on, then releases it — for callers whose push
#   credentials are scoped to branches only.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release (e.g. v4.0.0)"
        required: true
        type: string

permissions:
  contents: write

# Build provenance (#960, D11-07 option B, owner-approved this wave): every
# release gains a signed attestation of the tag's tree, serialised
# deterministically as the `git archive` tar of the tag and digested with
# sha256. A verifier reproduces the digest with
# `git archive --format=tar <tag> | sha256sum` and compares it against the
# attestation.
#
# The release asset (R10-MARKETPLACE, owner's option (a), 2026-10-29). #960
# declined option C -- build an artefact -- because HACS installed from the
# ref. That reason expired with the Home Assistant Marketplace, which replaces
# HACS in core from 2026.11: it refuses a download over 100 MiB (core
# marketplace `MAX_DOWNLOAD_SIZE`), and the tag archive of this repository is
# over it, because dev/ alone is most of it -- so every install fell back to
# one GitHub API fetch per file. So each release now carries
# `heatpump_optimizer.zip`: the integration folder's own files at the archive
# root, which is what a `zip_release` install unpacks into
# custom_components/heatpump_optimizer. `hacs.json` names it under `filename`,
# and tests/entities.py pins the two names equal. The release is created as a
# draft carrying the asset and published only once the asset is read back on
# it, so a release without its asset fails this run and is never published.
# The attested subject stays the tag's tree: the asset is that tree's
# custom_components/heatpump_optimizer subtree, packed by `git archive` from
# the same commit.
jobs:
  release:
    runs-on: ubuntu-latest
    # THE ONE GRANT THIS JOB ADDS BEYOND THE WORKFLOW FLOOR is the
    # owner-approved attestation grant (#201 comment 5670207248, item 5:
    # "job-scoped id-token: write"). `contents: write` restates the floor a
    # job-level block replaces, because `gh release create` still needs it.
    # `id-token: write` mints the OIDC token the Sigstore certificate is
    # requested with; it is the grant the owner signed off. `attestations:
    # write` is the one permission beyond that grant's letter, recorded as a
    # delta rather than smuggled: the action's persistence call (POST
    # /repos/{repo}/attestations) is refused without it -- the action's own
    # README names it beside id-token -- so the approved feature cannot
    # exist without this second, data-plane write. Both writes live on this
    # job alone, and tests/entities.py pins the set so neither can grow past
    # the approval in silence (the #959 precedent on `record`'s
    # `issues: write`).
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # The release asset's name. hacs.json's `filename` must equal it: the
      # Marketplace downloads the asset of that name, and tests/entities.py
      # and the check step below both refuse a mismatch.
      ASSET: heatpump_optimizer.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestry step below walks main's history back to this commit.
          fetch-depth: 0

      - name: Resolve the tag
        env:
          # Through the environment, never interpolated into the shell line.
          # `inputs.tag` is caller-supplied text and `${{ }}` substitutes it
          # before bash parses the script, so a tag containing a shell
          # metacharacter would run as a command with `contents: write`. The
          # same rule `governance.yml` states for a pull-request title. It was
          # the only unconstrained caller-supplied string reaching a SHELL LINE
          # here; `tests.yml`'s `recheck` reaches one too but is `type: boolean`,
          # which GitHub constrains. Caller-supplied text does reach `env:` in
          # two other workflows, which is safe for the same reason this line is.
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          # A tag this workflow would CREATE is worth one shape check: the
          # dispatch path writes a ref at whatever commit it checked out, and a
          # malformed name there is a ref nobody can delete through the UI.
          # Bash's own `=~`, and the reason is measured. Two weaker guards were
          # written first and both read stronger than they were:
          #   case "$TAG" in v[0-9]*.[0-9]*.[0-9]*)   accepts "v1.2.3; rm -rf /"
          #                                          -- a case glob is not anchored
          #   printf %s "$TAG" | grep -Eq '^v...$'   accepts "v1.2.3\nv9.9.9"
          #                                          -- ^ and $ anchor a LINE, and
          #                                          grep succeeds on ANY matching
          #                                          line, so a newline smuggles a
          #                                          second one past it
          # The second matters more than it looks: `TAG` is written to
          # $GITHUB_ENV, whose format is line-based, so a newline in it defines
          # arbitrary further variables for every later step in this job.
          # `[[ =~ ]]` matches the whole string, newline included, in one process.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to release '$TAG': not a vN.N.N tag name" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # AN ACCIDENTAL OFF-MAIN RELEASE STOPS HERE (#1516). Both ways in reach
      # the release and the attestation below with whatever commit the caller
      # names: a `v*` tag pushed at an unmerged branch commit, or a dispatch
      # from a branch. So `main` is fetched at run time and the commit must be
      # its ancestor. This is not the barrier against a deliberate one: a tag
      # push and a dispatch run THIS FILE AS IT STANDS AT THAT COMMIT, so a
      # commit that also deletes this step is released anyway. The barrier is
      # the `v*` tag ruleset -- who may push such a tag at all -- a repository
      # setting the owner holds. The stamp is not affected: it pushes its
      # commit to main before the tag (tools/release/stamp.py). `is-ancestor`
      # exits 1 for "not an ancestor" and 128 for an error, and both refuse.
      - name: Refuse a commit that is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "refusing to release ${TAG}: ${GITHUB_SHA} is not on main" >&2
            exit 1
          fi
          echo "${GITHUB_SHA} is on main"

      - name: Extract the tag's section from RELEASE_NOTES.md
        run: |
          awk -v tag="${TAG}" '
            $0 == "## " tag {hit=1; next}
            hit && /^## v/ {exit}
            hit {print}
          ' RELEASE_NOTES.md > /tmp/notes.md
          if ! [ -s /tmp/notes.md ]; then
            echo "See RELEASE_NOTES.md for ${TAG}." > /tmp/notes.md
          fi

      - name: Build the integration ZIP
        run: |
          set -euo pipefail
          # `<commit>:<path>` archives that subtree with its files at the
          # archive root -- the layout a `zip_release` install unpacks into
          # custom_components/heatpump_optimizer -- and only tracked files,
          # so no __pycache__ or local file of the runner reaches it.
          git archive --format=zip -o "${RUNNER_TEMP}/${ASSET}" \
            "${GITHUB_SHA}:custom_components/heatpump_optimizer"

      - name: Check the integration ZIP
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/${ASSET}" <<'EOF'
          import json, os, sys, zipfile
          path, asset = sys.argv[1], os.environ["ASSET"]
          hacs = json.load(open("hacs.json"))
          problems = []
          if hacs.get("zip_release") is not True:
              problems.append("hacs.json does not set zip_release to true")
          if hacs.get("filename") != asset:
              problems.append(f"hacs.json names {hacs.get('filename')!r}, "
                              f"this workflow uploads {asset!r}")
          with zipfile.ZipFile(path) as z:
              infos = z.infolist()
              names = {i.filename for i in infos}
              unpacked = sum(i.file_size for i in infos)
              manifest = (json.loads(z.read("manifest.json"))
                          if "manifest.json" in names else {})
          if manifest.get("domain") != "heatpump_optimizer":
              problems.append("manifest.json of this integration is not at "
                              "the archive root")
          # The Marketplace's download limit is 100 MiB; both the download
          # and what it unpacks to stay under it.
          limit = 100 * 1024 * 1024
          for what, size in (("download", os.path.getsize(path)),
                             ("unpacked", unpacked)):
              if size >= limit:
                  problems.append(f"{what} size {size} is not under {limit}")
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          EOF

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # As a DRAFT carrying the asset: the next step publishes it only
          # once the asset is read back. On dispatch the tag does not exist
          # yet; --target pins it to the commit this run checked out, and
          # publishing the draft creates the tag there. On a tag push the tag
          # exists and --target is ignored by GitHub for an existing tag.
          gh release create "${TAG}" "${RUNNER_TEMP}/${ASSET}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file /tmp/notes.md

      - name: Publish the release once its asset is on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" --json assets --jq '.assets[].name' \
              | grep -Fqx "${ASSET}"; then
            echo "::error::release ${TAG} does not carry ${ASSET}; left as a draft, not published" >&2
            exit 1
          fi
          gh release edit "${TAG}" --draft=false

      - name: Digest the tag's tree
        run: |
          # The attested subject is the TAG as it exists on the remote,
          # not the local checkout: on dispatch the previous step created
          # the tag through the API, so the local clone does not have it
          # yet. Fetch the ref explicitly, then serialise the tree it
          # points at. `git archive` output is deterministic for a given
          # commit (mtime from the commit, uid/gid zeroed, no pax
          # headers), so the same tag always digests to the same sha256.
          git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TREE_SHA256=$(git archive --format=tar "${TAG}" | sha256sum | cut -d' ' -f1)
          echo "tag ${TAG} -> tree digest sha256:${TREE_SHA256}"
          echo "TREE_SHA256=${TREE_SHA256}" >> "$GITHUB_ENV"

      - name: Attest the tag's tree
        # Pinned by commit, like every uses: ref in this repository (#960).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The subject NAME is the honest claim: the tag's source tree,
          # git-archive serialised -- not the release asset, which is one
          # subtree of it. `subject-digest` is the sha256 the previous step
          # computed over exactly that serialisation.
          subject-name: "tvofi/heatpump_optimizer ${{ env.TAG }} source tree (git archive tar)"
          subject-digest: "sha256:${{ env.TREE_SHA256 }}"
