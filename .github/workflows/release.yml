name: Release

# Pushing a version tag (v4.0.0, v4.1.0, ...) publishes a GitHub Release
# whose body is that version's own section of RELEASE_NOTES.md — the notes
# are written once, in the repo, and the release page quotes them verbatim.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract this tag's section from RELEASE_NOTES.md
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 == "## " tag {hit=1; next}
            hit && /^## v/ {exit}
            hit {print}
          ' RELEASE_NOTES.md > /tmp/notes.md
          if ! [ -s /tmp/notes.md ]; then
            echo "See RELEASE_NOTES.md for ${GITHUB_REF_NAME}." > /tmp/notes.md
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md
