name: Release

# Two ways in, one result: a GitHub Release whose body is the version's
# own section of RELEASE_NOTES.md — the notes are written once, in the
# repo, and the release page quotes them verbatim.
#
# * Push a version tag (v4.0.0, v4.1.0, ...) and it releases that tag.
# * Run the workflow by hand with a tag name and it CREATES the tag at
#   the commit it runs on, then releases it — for callers whose push
#   credentials are scoped to branches only.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release (e.g. v4.0.0)"
        required: true
        type: string

permissions:
  contents: write

# Build provenance (#960, D11-07 option B, owner-approved this wave): every
# release gains a signed attestation of the tag's tree. The subject is honest
# about what this repository ships -- no artefact exists and none is built
# (option C declined: HACS installs from the ref), so the attested subject is
# the tag's tree itself, serialised deterministically as the `git archive`
# tar of the tag and digested with sha256. A verifier reproduces the digest
# with `git archive --format=tar <tag> | sha256sum` and compares it against
# the attestation; nothing in the statement claims a downloadable asset, and
# the Signed-Releases scorecard row stays an honest PARTIAL for exactly that
# reason.
jobs:
  release:
    runs-on: ubuntu-latest
    # THE ONE GRANT THIS JOB ADDS BEYOND THE WORKFLOW FLOOR is the
    # owner-approved attestation grant (#201 comment 5670207248, item 5:
    # "job-scoped id-token: write"). `contents: write` restates the floor a
    # job-level block replaces, because `gh release create` still needs it.
    # `id-token: write` mints the OIDC token the Sigstore certificate is
    # requested with; it is the grant the owner signed off. `attestations:
    # write` is the one permission beyond that grant's letter, recorded as a
    # delta rather than smuggled: the action's persistence call (POST
    # /repos/{repo}/attestations) is refused without it -- the action's own
    # README names it beside id-token -- so the approved feature cannot
    # exist without this second, data-plane write. Both writes live on this
    # job alone, and tests/entities.py pins the set so neither can grow past
    # the approval in silence (the #959 precedent on `record`'s
    # `issues: write`).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve the tag
        env:
          # Through the environment, never interpolated into the shell line.
          # `inputs.tag` is caller-supplied text and `${{ }}` substitutes it
          # before bash parses the script, so a tag containing a shell
          # metacharacter would run as a command with `contents: write`. The
          # same rule `governance.yml` states for a pull-request title. It was
          # the only unconstrained caller-supplied string reaching a SHELL LINE
          # here; `tests.yml`'s `recheck` reaches one too but is `type: boolean`,
          # which GitHub constrains. Caller-supplied text does reach `env:` in
          # two other workflows, which is safe for the same reason this line is.
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          # A tag this workflow would CREATE is worth one shape check: the
          # dispatch path writes a ref at whatever commit it checked out, and a
          # malformed name there is a ref nobody can delete through the UI.
          # Bash's own `=~`, and the reason is measured. Two weaker guards were
          # written first and both read stronger than they were:
          #   case "$TAG" in v[0-9]*.[0-9]*.[0-9]*)   accepts "v1.2.3; rm -rf /"
          #                                          -- a case glob is not anchored
          #   printf %s "$TAG" | grep -Eq '^v...$'   accepts "v1.2.3\nv9.9.9"
          #                                          -- ^ and $ anchor a LINE, and
          #                                          grep succeeds on ANY matching
          #                                          line, so a newline smuggles a
          #                                          second one past it
          # The second matters more than it looks: `TAG` is written to
          # $GITHUB_ENV, whose format is line-based, so a newline in it defines
          # arbitrary further variables for every later step in this job.
          # `[[ =~ ]]` matches the whole string, newline included, in one process.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to release '$TAG': not a vN.N.N tag name" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Extract the tag's section from RELEASE_NOTES.md
        run: |
          awk -v tag="${TAG}" '
            $0 == "## " tag {hit=1; next}
            hit && /^## v/ {exit}
            hit {print}
          ' RELEASE_NOTES.md > /tmp/notes.md
          if ! [ -s /tmp/notes.md ]; then
            echo "See RELEASE_NOTES.md for ${TAG}." > /tmp/notes.md
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On dispatch the tag does not exist yet; --target pins it to
          # the commit this run checked out, and gh creates tag+release
          # in one go. On a tag push the tag exists and --target is
          # ignored by GitHub for an existing tag.
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file /tmp/notes.md

      - name: Digest the tag's tree
        run: |
          # The attested subject is the TAG as it exists on the remote,
          # not the local checkout: on dispatch the previous step created
          # the tag through the API, so the local clone does not have it
          # yet. Fetch the ref explicitly, then serialise the tree it
          # points at. `git archive` output is deterministic for a given
          # commit (mtime from the commit, uid/gid zeroed, no pax
          # headers), so the same tag always digests to the same sha256.
          git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TREE_SHA256=$(git archive --format=tar "${TAG}" | sha256sum | cut -d' ' -f1)
          echo "tag ${TAG} -> tree digest sha256:${TREE_SHA256}"
          echo "TREE_SHA256=${TREE_SHA256}" >> "$GITHUB_ENV"

      - name: Attest the tag's tree
        # Pinned by commit, like every uses: ref in this repository (#960).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The subject NAME is the honest claim: the tag's source tree,
          # git-archive serialised -- not an artefact, not a zip, nothing
          # downloadable. `subject-digest` is the sha256 the previous step
          # computed over exactly that serialisation.
          subject-name: "tvofi/heatpump_optimizer ${{ env.TAG }} source tree (git archive tar)"
          subject-digest: "sha256:${{ env.TREE_SHA256 }}"
