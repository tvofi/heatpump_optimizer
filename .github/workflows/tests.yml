          export SUBJECT=$(git log -1 --pretty=%s)
          python3 -I - <<'PY'
          import os, sys
          sys.path.append("tests")
          import closure
          allowed = closure.autofix_allowed(
              event_name=os.environ["EVENT_NAME"],
              closures_result=os.environ["MUTATION_RESULT"],
              head_repo=os.environ["HEAD_REPO"],
              repo=os.environ["REPO"],
              commit_subject=os.environ["SUBJECT"],
              loop_subject="ci: pin killed mutants",
          )
          print(f"allowed={allowed}")
          if not allowed:
              status = "skip-not-allowed"
          else:
              import subprocess, mutation_table
              head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True,
                                    text=True).stdout.strip()
