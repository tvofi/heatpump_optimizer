              if hasattr(mutation_table, "merge_pin_shards"):
                  merged = mutation_table.merge_pin_shards(
                      os.environ["SHARDS_DIR"], pins)
                  print(f"shards merged: {merged}")
              else:
                  # A base older than the shards: whole on shard 1.
                  pins = os.environ["SHARDS_DIR"] + "/mutation-pins-1"
              status = mutation_table.apply_pins(pins, head)
          print(f"AUTOFIX: {status}")
