name: Tests

# The suite that guards every change. Two jobs:
#
# * fast — every push and PR. Runs the whole of tests/run.sh except the
#   SLOW-gated closed-loop simulation. Golden fixtures are checked in
#   drift mode: solver output is not bit-stable across BLAS builds, so
#   comparing this runner's floats against fixtures recorded on another
#   machine would cry wolf. Instead tests/env_drift.py --all captures
#   every scenario twice IN THIS runner — once from the tree under test,
#   once from a worktree of the comparison ref — and requires the two to
#   be byte-identical. Solver noise cancels; what remains is the
#   change's own behavioural footprint, which must be empty or claimed
#   in tests/golden/claimed_drift.txt.
#
#   That comparison is computed-against-computed, so neither side of it is
#   the committed file, and until #347 no CI job compared a committed
#   fixture at all -- run.sh skips golden.py entirely in drift mode. The
#   same env_drift run now also judges its own capture against the
#   committed files, in two machine-independent levels that fail this job:
#   exact for the fixtures with no float in them (config_flow), and
#   structural -- key paths and JSON type classes, no scalar values, no list
#   lengths -- for all 55. The value differences that ARE the machine are
#   counted and printed, never failed; the nightly below prints them per
#   fixture so a human can decide what to re-record.
#
#   The env_drift baseline is cached between runs
#   under a key covering the baseline commit and tree, tests/env_drift.py
#   itself, the interpreter, the installed distributions and a bit-exact
#   fingerprint of this runner's floating-point arithmetic. On a push to
#   main the comparison ref is HEAD^1 and differs every run, so nothing is
#   restored and the uncached path is what runs; on a pull request the
#   merge-base is stable, so a second push to the same PR reuses the
#   baseline it already captured. env_drift re-checks the key inside the
#   restored entry before using it, so a wrong restore is a miss rather
#   than a stale baseline.
#
#   run.sh spreads the suite over lanes and runs tests/stress.py alone at
#   the end; every script still runs with the same arguments and every
#   failure still counts.
#
#   SCOPING, and the reason it is safe. On a PULL REQUEST the suite runs
#   with GATE_SCOPE=auto: only the scripts the diff can actually reach
#   are run, decided from the measured dependency closures in
#   tests/closures.json. On a PUSH TO MAIN -- and on the nightly, and on
#   any manual dispatch -- GATE_SCOPE is forced to full and every script
#   runs regardless of what changed. That asymmetry is the whole safety
#   argument: if a closure is ever wrong, the scoped PR gate may miss it,
#   but the very next gate, the unscoped one on main, does not. main goes
#   red within one merge instead of never. Every scoped-out script is
#   printed with its reason in the run log, twice.
#
# * closures — push to main, nightly, and on any pull request that can
#   move a closure. Re-records closures by running the suite under
#   instrumentation and fails if tests/closures.json misses anything a
#   real run touched. It runs beside `fast`, so it costs a runner and no
#   wall clock. This is what stops the closures rotting the way a
#   hand-written dependency table would.
#
#   On a push, nightly or dispatch it re-records EVERYTHING. On a pull
#   request `closure-scope` decides, from the diff and the same table:
#   skip when every changed file is INERT, full when a gate file or a
#   file in no recorded closure is touched, and otherwise re-derive only
#   the closures the diff intersects. Before that the job ran on a pull
#   request only when one ADDED a file under custom_components/, so a
#   change to what a test reads was checked one merge too late -- five
#   times (#354).
#
# * slow — nightly and on demand. Same suite plus SLOW=1, which adds
#   tests/rolling.py (the closed-loop learner simulation, ~15 minutes).
#
# * nightly-ha — nightly and on demand. The only lane that runs the
#   integration inside a real Home Assistant instead of tests/hastub, in
#   the container and at the /config path an installation actually uses.
#   Asserts that a PLAN CAME OUT, which is what #511 broke and what every
#   other lane structurally could not see. Never gates a pull request.
#
# * nightly-status — every pull request, seconds, stdlib only. Reads the
#   last CONCLUDED scheduled run of this workflow and goes RED if any of
#   its jobs failed, if none concluded recently, or if it could not look.
#   The schedule-only lanes above are `skipped` on every push and pull
#   request and are not required contexts, so their conclusions land on a
#   commit nobody re-reads and the next merge strands them: #533's lane
#   was red on both arms for two nights and nothing said so. This is the
#   telling. It is deliberately NOT a required context either.
#
# * closures-autofix / claims-autofix — same-repo PRs only. Merge
#   UNDER-SCOPED recordings, or empty an inherited claim list, then
#   retrigger Tests. Do not re-implement; see .cursor/rules/ci-autofix.mdc.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      recheck:
        description: "PR-like checks after an autofix push (skip slow)"
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * *"

# The suite needs the code it tests and the cache it reuses, nothing
# more; every job inherits this read-only floor.
permissions:
  contents: read

jobs:
  # workflow_dispatch inputs exist only on the default branch. An autofix
  # push from this PR must retrigger before that lands, so recheck is also
  # true when HEAD's subject is `ci: …` (the two autofix commit messages).
  recheck-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      recheck: ${{ steps.decide.outputs.recheck }}
    steps:
      - uses: actions/checkout@v5
      - id: decide
        run: |
          if [ "${{ github.event.inputs.recheck }}" = "true" ]; then
            echo "recheck=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUBJECT=$(git log -1 --pretty=%s)
          case "$SUBJECT" in
            ci:*) echo "recheck=true" >> "$GITHUB_OUTPUT" ;;
            *)    echo "recheck=false" >> "$GITHUB_OUTPUT" ;;
          esac

  fast:
    needs: [recheck-gate]
    if: >-
      always() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || (github.event_name == 'workflow_dispatch'
            && needs.recheck-gate.outputs.recheck == 'true')
      )
    runs-on: ubuntu-latest
    # The only job that runs the production suite. It was matrixed over both
    # interpreters from #514 until the 3.13 leg was retired: 3.14 is what
    # reported installations actually run, and two legs of a 100-minute
    # instrumented suite is most of this workflow's wall clock for a second
    # answer that had never differed from the first.
    #
    # WHAT THAT GIVES UP, said plainly rather than left to be discovered.
    # 3.13 is still the floor the README and hacs.json declare -- it follows
    # from the Home Assistant 2025.2.0 floor, whose own requires-python is
    # >=3.13.0 -- and it is still the interpreter every other job in this
    # workflow pins. What no longer runs on it is the SUITE. So a 3.13-only
    # break in production code now reaches a user rather than this gate, which
    # is a narrower version of the hole #514 was filed for. `tests/entities.py`
    # keeps the README honest about it: the "suite is tested on" sentence is
    # derived from this matrix alone, so retiring a leg without saying so in
    # the README fails there.
    #
    # fail-fast is now on, which costs nothing while the matrix is one entry
    # and is the right default if a second is ever added back: the reason it
    # was off -- a 3.14 break must not cancel the 3.13 leg, because knowing
    # which of the two broke was the whole signal -- is a reason that only
    # exists while there are two.
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]
    # Drift mode captures all 53 scenarios twice (tree + merge-base); the
    # first main run proved 45 min is not enough on GitHub's runners — the
    # step was cancelled mid-suite by its own timeout.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          # env_drift needs the comparison ref's history to build its
          # baseline worktree.
          fetch-depth: 0

      # The drift baseline cache needs no matrix-specific key: env_drift's
      # cache_key_inputs already hashes the interpreter (`sys.version`,
      # `api_version`) and the installed package inventory, so the two legs
      # compute different keys and cannot restore each other's baseline.
      # A cross-interpreter baseline is exactly the false drift that would
      # otherwise make this matrix unreadable.
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pinned test dependencies
        run: pip install -r tests/requirements-ci.txt

      - name: Resolve the golden comparison ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The PR's merge-base with its target: exactly the code this
            # PR forked from, so the drift comparison isolates the PR.
            REF=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          elif [ "${{ needs.recheck-gate.outputs.recheck }}" = "true" ]; then
            # Autofix dispatch is not a pull_request event. Compare against
            # main the same way a PR would, not HEAD^1 (the autofix commit's
            # parent), so leftover drift vs main cannot hide.
            git fetch --no-tags origin main
            REF=$(git merge-base origin/main HEAD)
          else
            # Push to main: compare against the state before this push.
            REF=$(git rev-parse --verify --quiet 'HEAD^1^{commit}') || REF=""
          fi
          if [ -z "${REF}" ]; then
            # An empty GOLDEN_REF is not "no preference": run.sh and
            # env_drift.py both fall back to origin/main, which on a push to
            # main IS this commit -- the tree would be compared against
            # itself and pass no matter what it did. Fail here instead, where
            # the reason is visible.
            echo "Could not resolve a comparison ref for this ${{ github.event_name }}."
            echo "The drift gate needs a baseline that is not this commit;"
            echo "an empty ref silently becomes origin/main == HEAD."
            exit 1
          fi
          echo "GOLDEN_REF=${REF}" >> "$GITHUB_ENV"

      # The key is computed by the same function the run itself uses, so
      # the two can never disagree, and it needs the dependencies above to
      # fingerprint them. Pull requests only: a push to main compares
      # against HEAD^1, a different commit every run, so an entry could
      # never be hit and would only take up room.
      - name: Key the drift baseline cache
        id: driftkey
        if: >-
          github.event_name == 'pull_request'
          || needs.recheck-gate.outputs.recheck == 'true'
        env:
          PYTHONPATH: tests/hastub
        run: echo "key=$(python tests/env_drift.py --cache-key "$GOLDEN_REF" --all)" >> "$GITHUB_OUTPUT"

      - name: Restore the drift baseline
        if: >-
          github.event_name == 'pull_request'
          || needs.recheck-gate.outputs.recheck == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/heatpump_optimizer/drift-baseline
          key: drift-baseline-${{ steps.driftkey.outputs.key }}

      # Warm the cache for the PRs that fork from this main commit
      # (issue #94). A merge moves every open PR's merge-base at once, so
      # they all miss the cache and each pays a ~25-minute cold capture.
      # This run already captures the new main tree for its own
      # comparison; DRIFT_WARM_CACHE tells env_drift to store it under
      # the key those PRs will compute -- same cache_store, so the entry
      # keeps its built-in key re-check: a wrong restore is a miss, never
      # a stale baseline. The nightly warms too, keeping the entry fresh
      # for the fork point even on quiet days.
      - name: Key the warmed drift baseline
        id: warmkey
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'schedule'
        env:
          PYTHONPATH: tests/hastub
        run: |
          echo "key=$(python tests/env_drift.py --cache-key "$GITHUB_SHA" --all)" >> "$GITHUB_OUTPUT"
          echo "DRIFT_WARM_CACHE=1" >> "$GITHUB_ENV"

      # Pull requests get the scoped gate; everything else -- pushes to
      # main above all -- gets the whole suite. Written as an explicit
      # equality on the event name so an event this file has not thought
      # about lands on `full`, not on `auto`.
      - name: Decide the gate scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
             || [ "${{ needs.recheck-gate.outputs.recheck }}" = "true" ]; then
            echo "GATE_SCOPE=auto" >> "$GITHUB_ENV"
            echo "GATE_SCOPE_BASE=$GOLDEN_REF" >> "$GITHUB_ENV"
          else
            echo "GATE_SCOPE=full" >> "$GITHUB_ENV"
          fi

      - name: Run the suite
        env:
          GOLDEN_MODE: drift
          # No STRESS_SOLVE_BUDGET_MS here any more. An absolute wall-clock
          # budget cannot tell a slower solver from a busier runner, and on
          # shared runners it answered the second question. tests/stress.py
          # now budgets the solve's CPU time against a reference solve timed
          # beside it, which does not move when the runner is busy.
          # STRESS_SOLVE_RATIO, STRESS_SWEEP_RATIO and
          # STRESS_SOLVE_CEILING_MS are the knobs if it ever needs one.
          #
          # Threads are pinned because process CPU time sums over all of
          # them: a runner whose core count differs from the machine the
          # ratios were calibrated on would otherwise record a different
          # thread factor for the same work. stress.py checks this and fails
          # if the reference and the scenarios disagree, but pinning means
          # the question never arises.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: ./tests/run.sh

      # The save half of the warm cache: the entry env_drift wrote under
      # the key from the step above, persisted where the PRs' restore
      # looks. save@v4 (not the post-step of a restore) because this key
      # is computed for a different ref than anything restored here.
      - name: Save the warmed drift baseline
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'schedule'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/heatpump_optimizer/drift-baseline
          key: drift-baseline-${{ steps.warmkey.outputs.key }}

  # The real-browser layout lane (issue #96): positions, sizes and
  # visibility, the three things the DOM-stub lanes cannot see. Own job
  # because it needs Chromium, which nothing else installs; it consumes
  # the same plan payload card.mjs does. The scoped gate does not decide
  # anything for this lane (it is in NOT_A_TEST) -- the card source is
  # in every closure that matters, and the lane runs on every PR.
  browser:
    needs: [recheck-gate]
    if: >-
      always() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || (github.event_name == 'workflow_dispatch'
            && needs.recheck-gate.outputs.recheck == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pinned test dependencies
        run: pip install -r tests/requirements-ci.txt

      - name: Cache the lane's Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/pw-browsers
          key: pw-chromium-1.49.0

      - name: Install playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pwlane" playwright@1.49.0
          PLAYWRIGHT_BROWSERS_PATH=~/.cache/pw-browsers \
            npx --yes playwright@1.49.0 install chromium

      - name: Write the plan payload
        env:
          PYTHONPATH: tests/hastub
        run: python tests/plan_view.py

      - name: Run the layout lane
        # PLAYWRIGHT_BROWSERS_PATH in the run command, not the step env:
        # a `~` in a workflow env var is a literal tilde, which Playwright
        # resolves relative to the repository -- the shell expands $HOME.
        run: >
          PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/pw-browsers"
          NODE_PATH="${{ runner.temp }}/pwlane/node_modules"
          node tests/card_browser.mjs

  # The brief-citation linter (#411). `.claude/` is on tests/closure.py's
  # INERT list -- closure.py's own merge check FAILS if an INERT file turns
  # up in a recorded closure -- so the scoped gate structurally cannot see
  # this directory. Same shape as `browser` above (also driving an INERT
  # script, tests/card_browser.mjs): its own never-scoped job, `if:` copied
  # verbatim, so `closure-scope`'s case output cannot skip it. `node
  # .claude/workflows/check-wave-script.mjs` is the other file in this
  # position and still runs by hand only, which leaves the wave resume control
  # flow as the one piece of orchestration no CI job runs; a job of this shape
  # for it is owed.
  #
  # Live wave-*-groups.json must lint clean (0 errors) so this job can
  # stay green on main. The 931dffe acceptance fixture is the rot pin:
  # brief_lint.mjs's no-arg path requires those ten errors, so gutting
  # lintBrief cannot green the job.
  briefs:
    needs: [recheck-gate]
    if: >-
      always() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || (github.event_name == 'workflow_dispatch'
            && needs.recheck-gate.outputs.recheck == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags are not fetched by a plain checkout. Fetched here (rather
          # than skipped) so a tag-scoped citation gets verified for real in
          # CI instead of only warned about; the linter still degrades to a
          # warning on its own if a cited tag is ever unresolvable.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Lint every wave roster's citations
        run: node .claude/workflows/brief_lint.mjs

  # The pinned, stub-free typing ruler (#303). Three numbers -- the error
  # count, its per-code split, and the `# type: ignore` count -- and none of
  # them may grow. It is a job of its own rather than a lane of `fast`
  # because it needs a toolchain no gate lane has: mypy plus real Home
  # Assistant type information, in a virtualenv built for the purpose. That
  # is the `browser` and `nightly-ha` shape.
  #
  # The ruler's dependency-free half runs in `fast` too (tests/typing_ruler.py
  # in the units lane), and deliberately: the ignore count is the guard
  # `--warn-unused-ignores` does not provide, and it must not be the metric
  # that goes unchecked on the day this install fails.
  typing:
    needs: [recheck-gate]
    if: >-
      always() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || (github.event_name == 'workflow_dispatch'
            && needs.recheck-gate.outputs.recheck == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Not matrixed over the interpreters `fast` uses. The pin is a PAIR and
      # the two halves constrain each other: homeassistant-stubs 2026.2.3
      # refuses to install below Python 3.13.2, and every release after it
      # requires 3.14.2, so exactly one interpreter line satisfies the pin
      # this ruler is defined by (#504). A second leg would either fail to
      # install or measure something else and call it the same number.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The versions live in tests/typing_budgets.json and are not repeated
      # here. A workflow that disagrees with the recorded pin is then not a
      # state that can exist, rather than a state something has to check for.
      - name: Resolve the pinned toolchain
        run: |
          python3 tests/typing_ruler.py --print-requirements \
            | tee "$RUNNER_TEMP/typing-requirements.txt"

      - name: Install the pinned toolchain
        run: |
          python3 -m venv .venv-typing
          .venv-typing/bin/python -m pip install \
            -r "$RUNNER_TEMP/typing-requirements.txt"

      # Run BY the pinned interpreter, so the ruler introspects the
      # environment it is measuring in rather than being told about it.
      - name: Run the ruler and ratchet its three numbers
        run: |
          .venv-typing/bin/python tests/typing_ruler.py --mypy \
            --emit "$RUNNER_TEMP/typing-census.json"

      # Kept on a failure too: the run that refuses because the census is not
      # yet recorded is exactly the run whose numbers are wanted.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: typing-census
          path: ${{ runner.temp }}/typing-census.json
          if-no-files-found: ignore

  # Two numbers `fast` cannot produce, both running beside it rather than
  # inside it: how much of the package the suite EXECUTES, and how much of it
  # the suite would NOTICE being wrong. They are different questions and the
  # second is the one that decides whether a check is worth its line -- five
  # W5-G7 tranches found twenty-two checks that executed the line they were
  # named for and pinned nothing, all of them green coverage.
  #
  # Neither is matrixed. Coverage of a statement does not depend on the
  # interpreter that ran it, and a second leg would pay a whole instrumented
  # suite to print the same floor.
  coverage:
    needs: [recheck-gate]
    if: >-
      always() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || (github.event_name == 'workflow_dispatch'
            && needs.recheck-gate.outputs.recheck == 'true')
      )
    runs-on: ubuntu-latest
    # The instrumented `fast` stage is the whole default gate minus the four
    # end-to-end scripts, run under a tracer that costs roughly a third again.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned test dependencies
        run: pip install -r tests/requirements-ci.txt

      # Deliberately NOT added to tests/requirements-ci.txt. env_drift's cache
      # key fingerprints the installed distribution set, so a package added
      # there invalidates the drift baseline for every `fast` run in the
      # repository -- a whole-repo cache miss to give one job a tracer. The pin
      # is exact for the same reason the rest are: coverage.py's default pragma
      # pattern is what decides whether an exempted line leaves the
      # denominator, and tests/coverage_ratchet.py counts against that pattern.
      - name: Install the tracer
        run: pip install 'coverage==7.13.1'

      # Writes nothing inside the worktree: W5P_OUT defaults under W5P_WORK, so
      # the measurement leaves no untracked evidence tree behind.
      #
      # The exit status of the stage is NOT this job's verdict and is not read
      # here. tests/features.py fails its #525 heartbeat pair under any tracer
      # -- both arms read zero ticks, the null control included, because the
      # tracer removes the stall the check exists to see -- and that pair is
      # `fast`'s to judge, on an uninstrumented run, where it is honest. What
      # this job judges is the JSON.
      - name: Measure the tree
        run: |
          # EXPORTED, not merely set: coverage_tree.sh reads W5P_WORK from the
          # environment and refuses without it, and the refusal is a one-line
          # message the `|| true` below would otherwise swallow into an empty
          # `out/` and a confusing "produced no coverage.json".
          export W5P_WORK
          W5P_WORK=$(mktemp -d)
          echo "W5P_WORK=$W5P_WORK" >> "$GITHUB_ENV"
          tools/audit/w5-partition/coverage_tree.sh fast || true
          test -s "$W5P_WORK/out/coverage.json" || {
            echo "The instrument produced no coverage.json. That is this job"
            echo "failing, not the ratchet: there is no measurement to judge."
            exit 1
          }

      - name: Ratchet the floor and the pragma count
        run: |
          python3 tests/coverage_ratchet.py \
            --coverage "$W5P_WORK/out/coverage.json"

      # Kept on a failure too: the run that refuses because the floor moved is
      # exactly the run whose per-module numbers are wanted.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-json
          path: ${{ env.W5P_WORK }}/out/coverage.json
          if-no-files-found: ignore

  # The mutation table. Scope is the files that were actually tested: the
  # production files a pull request changes, or -- for a test-only diff -- the
  # production files in the MEASURED closure of each changed script, the same
  # recording tests/closures.json gives the scoped gate.
  #
  # It does not mutate the checkout. Every worker copies the working tree
  # first, so a cancelled job cannot leave a production file edited for a
  # later step to read, which an in-place `try/finally` still can: a SIGKILL
  # does not run `finally`.
  mutation:
    needs: [recheck-gate]
    if: >-
      always() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || (github.event_name == 'workflow_dispatch'
            && needs.recheck-gate.outputs.recheck == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          # --scope changed diffs three-dot against the merge base, which a
          # shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned test dependencies
        run: pip install -r tests/requirements-ci.txt

      # `--jobs` is sized to the runner, not to taste: the drivers are
      # single-threaded, so more workers than cores only lengthens every
      # mutant's wall clock. The pool is small on purpose -- its job is to
      # catch a change that stops being noticed, not to estimate a rate, which
      # is what the nightly below is for.
      - name: Drive the table over what this diff tested
        shell: bash
        run: |
          git fetch --no-tags origin main
          set -o pipefail
          python3 tests/mutation_table.py \
            --scope changed --base origin/main --max 10 --jobs 3 \
            | tee "$RUNNER_TEMP/mutation-table.txt"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutation-table
          path: ${{ runner.temp }}/mutation-table.txt
          if-no-files-found: ignore

  # The same instrument over the whole package, which only the nightly can
  # afford. A pull request cannot see this lane at all, so it is registered in
  # `tests/nightly_status.py`'s REQUIRED_LANES and `tests/entities.py` derives
  # that coupling from this job's own `if:` -- an unregistered schedule-only
  # lane fails there rather than going dark the way #533's did.
  #
  # Deliberately one job and not split across several: the cap is a fraction
  # of one pool, so two half-runs would each judge their own half against a
  # cap measured over the whole.
  mutation-nightly:
    needs: [recheck-gate]
    if: >-
      always() && (
        github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch'
            && needs.recheck-gate.outputs.recheck != 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          # Its driver set includes tests/entities.py, whose handover checks ask
          # git whether `updated-for:` is an ancestor -- unanswerable at depth 1.
          # The driver then fails at the BASELINE, mutation_table.py refuses with
          # "the baseline is already red", and the nightly is red having run no
          # mutant at all. Its sibling `mutation` above already carries this for
          # the same reason; this job was the one that never got it.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned test dependencies
        run: pip install -r tests/requirements-ci.txt

      - name: Drive the table over the whole package
        shell: bash
        run: |
          set -o pipefail
          python3 tests/mutation_table.py \
            --scope full --max 40 --jobs 3 \
            | tee "$RUNNER_TEMP/mutation-table-full.txt"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutation-table-full
          path: ${{ runner.temp }}/mutation-table-full.txt
          if-no-files-found: ignore

  slow:
    needs: [recheck-gate]
    if: >-
      always() && (
        github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch'
            && needs.recheck-gate.outputs.recheck != 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pinned test dependencies
        run: pip install -r tests/requirements-ci.txt

      - name: Resolve the golden comparison ref
        run: |
          # Nightly runs sit on main; comparing against the commit before
          # the latest lets the drift gate re-verify the newest merge.
          # There is no fallback on purpose: `|| git rev-parse HEAD` used to
          # sit here, and a ref that resolves to HEAD compares the tree
          # against itself -- byte-identical by construction, so no drift can
          # ever be reported and every claim is stale. env_drift.py now
          # refuses that state; failing here instead says which step is at
          # fault. A root commit (no HEAD^1) is the only way to get here.
          REF=$(git rev-parse --verify --quiet 'HEAD^1^{commit}') || {
            echo "HEAD has no first parent, so there is nothing to compare"
            echo "this tree against. The drift gate needs a real baseline;"
            echo "check out main with history (fetch-depth: 0) and re-run."
            exit 1
          }
          echo "GOLDEN_REF=${REF}" >> "$GITHUB_ENV"

      - name: Run the suite including the closed-loop simulation
        env:
          GOLDEN_MODE: drift
          SLOW: "1"
          # Said out loud even though it is the default: the nightly is one
          # of the runs the scoped gate is measured against, so it never
          # scopes.
          GATE_SCOPE: full
          # The committed-fixture value report (#347, level 3), per fixture
          # rather than as a count. Only a canonical environment can honestly
          # re-record a float-bearing fixture -- a dev box would poison it,
          # which is exactly why claims exist instead of re-records -- so
          # this run is where the list belongs. It never fails anything: the
          # numbers in it are the runner's own. Levels 1 and 2 gate, in this
          # job and in `fast`, because they do not depend on the machine.
          DRIFT_VALUE_REPORT: "1"
          # See the fast job: the solve-time guard calibrates against this
          # runner rather than against a stopwatch, and threads are pinned
          # so process CPU time means the same thing here as anywhere else.
          # The nightly ref is HEAD^1 and moves every night, so there is no
          # baseline worth caching here either.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: ./tests/run.sh

  # Real Home Assistant, in the container an installation actually runs
  # (#521). Every other lane -- tests/deployment_shape.py included -- gets
  # `homeassistant` from tests/hastub, so none of them has ever observed real
  # import or setup semantics; that is the third divergence of #513, and it
  # is how #511 shipped a total loss of function in v6.3.15 behind a green
  # suite. The check that carries the value is that a PLAN CAME OUT: setup
  # succeeded throughout #511, so a lane asserting only "it loaded" would
  # have been green for the whole release.
  #
  # Nightly and on demand, never on a pull request. It costs minutes, needs
  # Docker, and is the first lane here that can go red for a reason outside
  # this repository -- a registry outage, or a Home Assistant release
  # changing setup behaviour. It blocks nothing, and it is not one of the
  # required contexts on the main-protect ruleset.
  #
  # "It reports loudly" is what this comment used to say next, and it was
  # measured false. What it does is attach its conclusion to whatever commit
  # was main's head when the schedule fired, as a check run beside that
  # commit's own `nightly-ha skipped` from the push event. Nothing notifies,
  # and the NEXT merge moves the head and strands the red on a commit no one
  # re-reads: two consecutive nights of both matrix arms failing in `_stage`
  # were found by a seat sent looking, not by the lane telling anyone. That is
  # a known and accepted property -- the whole reason it is unrequired is that
  # it can go red for the outside-this-repository reasons above, and a lane
  # that files an issue for a registry outage is worse than a quiet one. What
  # follows from it is that a defect reaching THIS lane is expensive to
  # notice, so the cheap checks that keep it runnable belong in the PR gate
  # instead: `tests/entities.py` pins the wiring of the step below.
  nightly-ha:
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Both images report. A floor that breaks while stable does not is the
      # most informative outcome this lane has, and fail-fast would hide it.
      fail-fast: false
      matrix:
        # The floor the integration supports (#514), and whatever is current.
        image: ["2025.2.0", "stable"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The driver has a HOST half as well as a container half, and the host
      # half imports the production package: `_seed_unique_id` calls
      # `config_flow.entry_identity` for the seed's unique_id, and
      # `load_committed_roster` imports every platform module for the A3
      # roster. That import resolves `homeassistant` from tests/hastub, which
      # imports voluptuous, and the package imports aiohttp -- so a bare
      # `setup-python` runner dies inside `_stage`, before Docker is reached
      # at all. It did, on both matrix arms, on two consecutive nights.
      # The same pinned set `fast`, `slow`, `browser` and `closures` install --
      # four of the eleven jobs here, not all of them; `typing`, `closure-scope`
      # and the two autofix jobs run Python and install nothing, because what
      # they run imports neither the package nor the stub. The host only stages
      # files, so nothing about these versions reaches the container, which
      # uses Home Assistant's own.
      - name: Install pinned test dependencies
        run: pip install -r tests/requirements-ci.txt

      # Its own step so a registry failure is an unmistakable red here,
      # rather than a timeout somewhere inside the lane.
      - name: Pull the Home Assistant image
        run: docker pull "homeassistant/home-assistant:${{ matrix.image }}"

      - name: Run the integration inside Home Assistant
        run: |
          python tests/nightly_ha.py \
            --image "homeassistant/home-assistant:${{ matrix.image }}"

  # The telling. `nightly-ha` and `slow` run on `schedule` alone, are `skipped`
  # on every push and pull request, and are not required contexts -- so a
  # scheduled run's conclusion attaches to whatever commit was main's head when
  # the cron fired, beside that same commit's own `skipped` from the push, and
  # the next merge moves the head and strands it. Nothing notifies. Both
  # `nightly-ha` arms failed on the 2026-09-09 and 2026-09-10 schedules and a
  # seat sent looking found it two nights later (#533).
  #
  # It is its own RED CHECK and not a warning printed inside one of the green
  # jobs above, deliberately. `.cursor/rules/ci-autofix.mdc` says read the
  # summary line and not the tick, and `.cursor/rules/brief-citations.mdc`
  # names `FIXTURE ok: N error(s)` as the shape "designed to print beside a
  # clean exit, which is exactly the shape that lets a real error be waved
  # through". A warning inside a passing job IS that shape, and the defect
  # being fixed is that nobody looked.
  #
  # It must NOT be added to the required contexts on `main-protect`. The
  # property that makes `nightly-ha` unrequired is real -- a registry outage or
  # a Home Assistant release can redden it, and neither is a reason to refuse
  # an unrelated merge -- and requiring this would transfer that to every pull
  # request in the repository. The report itself says so on every run.
  #
  # Pull requests only, not pushes to main: a lane that can go red for reasons
  # outside this repository must not be able to turn `main` red, which is the
  # signal the forced-full gate above exists to keep meaningful.
  nightly-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Actions metadata -- which runs exist and how they concluded -- is not
    # repository content, and the workflow's `contents: read` floor cannot see
    # it. This is a widening of that floor and is written down as one. It is
    # read-only, and it is far narrower than the `issues: write` the auto-filing
    # countermeasure would have needed, which is why that one was rejected and
    # this one is not. Declared at JOB level: a job-level `permissions:` block
    # REPLACES the workflow default for this job alone and is inherited by no
    # other job, so every other job in this file still runs on `contents: read`.
    # `tests/entities.py` pins the whole set of jobs that override the floor --
    # this one and the two autofix jobs, which push a commit and retrigger this
    # workflow and so carry `contents: write` and `actions: write` -- and that
    # this one's block carries no `write` at all. A fourth override then has to
    # be argued for rather than land.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # No `pip install` step, unlike the jobs that install
      # `tests/requirements-ci.txt`: the reporter is stdlib-only on purpose. A
      # check whose job is to notice that a lane went dark must not be
      # breakable by the same dependency set that darkened it -- which is
      # exactly how #533's lane went dark -- and it costs seconds this way.
      - name: Report the last scheduled run's conclusion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tests/nightly_status.py

  # The closures the scoped PR gate trusts, re-derived from real runs and
  # compared against what is committed. A closure that MISSES a file a run
  # really touched is the dangerous direction -- that is what would make the
  # gate skip a script it should have run -- and it fails here. A closure
  # that lists more than a run touched only costs time, and is reported.
  #
  # WHEN it runs on a pull request is decided here, by the same table it
  # checks. The first version of this job asked "does the pull request ADD a
  # file under custom_components/?" (#332), which is a different question from
  # the one that matters: a change to what a test READS was checked only after
  # it merged. Five incidents -- #214, #320, #332, #340, #349 -- each one a
  # green pull request, a red main, and a second pull request to repair it.
  # #353 is the sharpest: it exists solely to fix a closure error, and its own
  # `closures` check says `skipping`.
  #
  # `closure.py affected` answers the right question instead, in three cases:
  # skip (every changed file is INERT), full (a gate file, or a file in no
  # recorded closure), scoped (re-derive only the closures the diff
  # intersects, ~40 s an entry against 12-22 minutes for the table).
  closure-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      case: ${{ steps.decide.outputs.case }}
      scripts: ${{ steps.decide.outputs.scripts }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - id: decide
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # --files-from, not `--files $(...)`: a path list off the command
          # line is split on whitespace and capped by ARG_MAX.
          # Three dots, not two. base.sha is the base BRANCH TIP at the time
          # the event fired, not the merge base, so a two-dot diff charges this
          # pull request with every file anyone else merged while it was open.
          # Measured on this PR: base.sha was the v6.3.9 stamp, and the two-dot
          # form attributed VERSION, manifest.json, RELEASE_NOTES.md and both
          # claim files to it -- 11 files against the real 6. That only ever
          # over-scopes, so it is safe, but it defeats the `skip` case this job
          # exists to keep cheap, and main moved four times today while a single
          # PR was open. fetch-depth: 0 above is what makes ... resolvable.
          git diff --name-only "$BASE"..."$HEAD" > "$RUNNER_TEMP/changed.txt"
          python tests/closure.py affected \
            --files-from "$RUNNER_TEMP/changed.txt" \
            --workdir "$RUNNER_TEMP/affected"
          {
            echo "case=$(cat "$RUNNER_TEMP/affected/affected.case")"
            echo "scripts<<CLOSURE_SCRIPTS_EOF"
            cat "$RUNNER_TEMP/affected/affected.scripts"
            echo "CLOSURE_SCRIPTS_EOF"
          } >> "$GITHUB_OUTPUT"

  closures:
    needs: [closure-scope]
    # `always()` is load-bearing, not decoration. `closure-scope` only runs on
    # a pull request, so on a push to main it is SKIPPED -- and a job whose
    # `needs` was skipped is skipped too, whatever its own `if` says. Without
    # `always()` this line would silently switch off the closures check on
    # main, which is the one place it has always run: a far worse bug than the
    # one it is here to prevent.
    #
    # `!= 'skip'` rather than `== 'full' || == 'scoped'` for the same reason:
    # if `closure-scope` fails outright its outputs are empty, and an empty
    # case must run the check, not silence it. This condition fails closed in
    # every direction except the one case that was measured to be safe.
    if: >-
      always() && (
        github.event_name == 'push' || github.event_name == 'schedule'
        || needs.closure-scope.outputs.case != 'skip'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Single-version deliberately, unlike `fast` (#514). tests/closures.json
      # is ONE committed artifact and this job uploads ONE `closure-recordings`
      # for `closures-autofix` to merge; a second interpreter would upload a
      # second artifact under the same name and hand autofix two recordings of
      # the same script with no rule for choosing between them. The closure
      # table records which files a script reads, which is a property of the
      # code, not of the interpreter running it.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pinned test dependencies
        run: pip install -r tests/requirements-ci.txt

      - name: Install strace
        # node has no audit hook, so tests/card.mjs is recorded by tracing
        # its opens instead.
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Re-record the closures
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          # Through the environment, not string-interpolated into the script:
          # the value is a job output, and `${{ }}` inside `run:` is textual
          # substitution.
          SCOPE_CASE: ${{ needs.closure-scope.outputs.case }}
          SCOPE_SCRIPTS: ${{ needs.closure-scope.outputs.scripts }}
        run: |
          REF=$(git rev-parse --verify --quiet 'HEAD^1^{commit}') || REF=HEAD
          # --record-only, on both paths: merging here would overwrite the
          # committed tests/closures.json with what this run just measured, and
          # the check below would then compare the file against itself.
          if [ "$SCOPE_CASE" = "scoped" ]; then
            printf '%s\n' "$SCOPE_SCRIPTS" > "$RUNNER_TEMP/rederive.txt"
            echo "Scoped re-derive; every other closure is left as committed:"
            cat "$RUNNER_TEMP/rederive.txt"
            while read -r s; do
              [ -n "$s" ] || continue
              GOLDEN_REF="$REF" ./tests/derive_closures.sh \
                --single "$s" --out-dir "$RUNNER_TEMP/closures" --record-only
            done < "$RUNNER_TEMP/rederive.txt"
          else
            GOLDEN_REF="$REF" ./tests/derive_closures.sh \
              --out-dir "$RUNNER_TEMP/closures" --record-only
          fi

      - name: Fail if tests/closures.json under-approximates
        env:
          PYTHONPATH: tests/hastub
          SCOPE_CASE: ${{ needs.closure-scope.outputs.case }}
        run: |
          # --partial drops one check and one only: "a selectable script with
          # no recording at all", which a scoped re-derive fails by
          # construction. The under-approximation comparison -- the thing this
          # job exists for -- is identical on both paths.
          if [ "$SCOPE_CASE" = "scoped" ]; then
            python tests/closure.py check --in-dir "$RUNNER_TEMP/closures" --partial
          else
            python tests/closure.py check --in-dir "$RUNNER_TEMP/closures"
          fi

      - name: Fail if a test file re-implements a production symbol
        # The rule tests/README.md states, enforced (issue #91): a test
        # defining its own copy of a production constant or helper asserts
        # against its own arithmetic, and its mutation proofs prove the
        # copy. Cheap by design -- a name collision -- but the accident
        # this exists for was a name collision.
        env:
          PYTHONPATH: tests/hastub
        run: python tests/closure.py no-copies

      - name: Upload closure recordings
        # Autofix needs the recordings even when the check above failed.
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: closure-recordings
          path: ${{ runner.temp }}/closures
          if-no-files-found: ignore
          retention-days: 3

  # Same-repo PR only: the closures job already re-recorded under strace.
  # If check printed UNDER-SCOPED, merge those recordings and push. Not a
  # coding agent -- Linux CI already paid the derive. Does not push on
  # no-copies, a failed recording, an INERT contradiction, or its own
  # follow-up commit (`ci: re-record closures`).
  #
  # A GITHUB_TOKEN push does not fire pull_request, so after the push this
  # job dispatches Tests (recheck=true), Hassfest and Validate on the new
  # SHA. CLOSURES_PUSH_TOKEN, if set, already retriggers via synchronize
  # and the dispatch is skipped.
  closures-autofix:
    needs: [closures]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && needs.closures.result == 'failure'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.CLOSURES_PUSH_TOKEN || github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download closure recordings
        uses: actions/download-artifact@v7
        with:
          name: closure-recordings
          path: ${{ runner.temp }}/closures

      - name: Merge UNDER-SCOPED recordings
        id: autofix
        env:
          PYTHONPATH: tests/hastub
          EVENT_NAME: ${{ github.event_name }}
          CLOSURES_RESULT: ${{ needs.closures.result }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          export SUBJECT=$(git log -1 --pretty=%s)
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "tests")
          import closure
          allowed = closure.autofix_allowed(
              event_name=os.environ["EVENT_NAME"],
              closures_result=os.environ["CLOSURES_RESULT"],
              head_repo=os.environ["HEAD_REPO"],
              repo=os.environ["REPO"],
              commit_subject=os.environ["SUBJECT"],
          )
          print(f"allowed={allowed}")
          if not allowed:
              status = "skip-not-allowed"
          else:
              status = closure.apply_under_scoped_recordings(
                  os.environ["RUNNER_TEMP"] + "/closures", partial=True)
          print(f"AUTOFIX: {status}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"status={status}\n")
          PY

      - name: Push the merged closures
        if: steps.autofix.outputs.status == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          USED_PAT: ${{ secrets.CLOSURES_PUSH_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/closures.json
          git diff --cached --quiet && {
            echo "closures.json unchanged after apply; not pushing"
            exit 0
          }
          git commit -m "ci: re-record closures"
          git pull --rebase origin "$HEAD_REF" || true
          git push
          if [ "$USED_PAT" = "true" ]; then
            echo "PAT push retriggers pull_request; not dispatching"
            exit 0
          fi
          # No -f recheck=: that input is only on default-branch YAML.
          # The dispatched run uses this ref's workflow; recheck-gate
          # treats a `ci:` subject as recheck.
          gh workflow run tests.yml --ref "$HEAD_REF"
          gh workflow run hassfest.yml --ref "$HEAD_REF"
          gh workflow run validate.yml --ref "$HEAD_REF"

      # The push above runs only on `changed`; the other statuses fell through
      # to job success, so a skipped repair was invisible and the documented
      # wait never ended (#523). Last, and always(): a status the step above
      # skipped on is exactly the status worth reporting, and reporting before
      # the push would let this step's own exit throw the repair away.
      - name: Report whether the repair happened
        if: always()
        env:
          PYTHONPATH: tests/hastub
        run: |
          python tests/closure.py autofix-report --job closures-autofix \
            --status "${{ steps.autofix.outputs.status }}"

  # Same-repo PR only. fast fails INHERITED CLAIMS when a branch copies
  # main's non-empty list (#493/#494/#496). Empty both files, keep
  # claims-for and may-drift, push `ci: drop inherited claims`.
  claims-autofix:
    needs: [fast]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && needs.fast.result == 'failure'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.CLOSURES_PUSH_TOKEN || github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Drop inherited claim lists
        id: autofix
        env:
          PYTHONPATH: tests/hastub
          EVENT_NAME: ${{ github.event_name }}
          FAST_RESULT: ${{ needs.fast.result }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags origin main
          export SUBJECT=$(git log -1 --pretty=%s)
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "tests")
          import closure
          import env_drift
          allowed = closure.autofix_allowed(
              event_name=os.environ["EVENT_NAME"],
              closures_result=os.environ["FAST_RESULT"],
              head_repo=os.environ["HEAD_REPO"],
              repo=os.environ["REPO"],
              commit_subject=os.environ["SUBJECT"],
              loop_subject="ci: drop inherited claims",
          )
          print(f"allowed={allowed}")
          if not allowed:
              status = "skip-not-allowed"
          else:
              status = env_drift.apply_inherited_claims(
                  ".", ref="origin/main")
          print(f"AUTOFIX: {status}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"status={status}\n")
          PY

      - name: Push emptied claim files
        if: steps.autofix.outputs.status == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          USED_PAT: ${{ secrets.CLOSURES_PUSH_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/claimed_drift.txt tests/golden/card_claimed_drift.txt
          git diff --cached --quiet && {
            echo "claim files unchanged after apply; not pushing"
            exit 0
          }
          git commit -m "ci: drop inherited claims"
          git pull --rebase origin "$HEAD_REF" || true
          git push
          if [ "$USED_PAT" = "true" ]; then
            echo "PAT push retriggers pull_request; not dispatching"
            exit 0
          fi
          gh workflow run tests.yml --ref "$HEAD_REF"
          gh workflow run hassfest.yml --ref "$HEAD_REF"
          gh workflow run validate.yml --ref "$HEAD_REF"

      # As in closures-autofix (#523). This job's apply function has no
      # attempted-and-failed status, so today only an unrecognised or empty
      # one reddens; the step exists so the status reaches the job summary,
      # and so a status added later cannot fall through to green.
      - name: Report whether the repair happened
        if: always()
        env:
          PYTHONPATH: tests/hastub
        run: |
          python tests/closure.py autofix-report --job claims-autofix \
            --status "${{ steps.autofix.outputs.status }}"
