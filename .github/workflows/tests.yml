          # `action_required` (since 2026-10-15; run 38781421410), and the
          # next step's poll, keyed on the pushed SHA (#1283), has hpo-runs
          # approve them; the dispatch below is not held.
          echo "token_push=true" >> "$GITHUB_OUTPUT"
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # One dispatch of the umbrella, naming the PR and its base (U0c's
          # inputs): its prelude verifies they name the open PR this pushed
          # SHA heads, and its gate judges every unit at that head.
          gh workflow run ci.yml --ref "$HEAD_REF" -f pr="$PR" -f base="$BASE_REF"

      # As in closures-autofix (#1276): the dispatch runs at once. That
      # step exists because a GITHUB_TOKEN push's pull_request runs were held
      # action_required for a human; measured 2026-10-09 at two bot heads, no
      # such run is created at all, so the poll below normally finds nothing
      # and the dispatched run stands alone. Where GitHub does hold one,
      # the approve step clears it as the Actions-only App -- the RS256 mint
      # tools/pr/app_approve.sh uses, ported inline -- after the same bounded
      # poll for the pushed SHA's runs (#1283). Fail-soft throughout: absent
      # secrets print one notice and approve nothing, and a later error warns
      # rather than reddening a job whose push already happened (red means
      # "no bot commit", #523).
      - name: Approve the runs the push left holding
        if: steps.push.outputs.token_push == 'true'
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          PUSH_SHA: ${{ steps.push.outputs.pushed_sha }}
          RUNS_PEM: ${{ secrets.HPO_RUNS_PEM }}
          RUNS_APPID: ${{ secrets.HPO_RUNS_APPID }}
        run: |
          { set +x; } 2>/dev/null  # the PEM, JWT and token are never traced
          if [ -z "$RUNS_PEM" ]; then
            echo "::notice::HPO_RUNS_PEM is not set; leaving action_required runs for a human (fail-soft)"
            exit 0
          fi
          if [ -z "$RUNS_APPID" ]; then
            echo "::warning::HPO_RUNS_APPID is not set; leaving action_required runs for a human (fail-soft)"
            exit 0
          fi
          umask 077
          API=https://api.github.com
          ACCEPT='Accept: application/vnd.github+json'
          key="$RUNNER_TEMP/hpo-runs.pem"
          jwt_h="$RUNNER_TEMP/hpo-runs-jwt.h"
          tok_h="$RUNNER_TEMP/hpo-runs-token.h"
          cleanup() {
            if [ -s "$tok_h" ]; then
              curl -fsS -X DELETE -H @"$tok_h" -H "$ACCEPT" "$API/installation/token" >/dev/null 2>&1 \
                || echo "::warning::revoking the run-approver App token failed; it expires within the hour"
            fi
            rm -f "$key" "$jwt_h" "$tok_h"
          }
          trap cleanup EXIT
          # So the EXIT trap (token revoke + file removal) also fires when the
          # job is cancelled -- app_approve.sh's bounded-gap line.
          trap 'exit 130' INT TERM HUP
          printf '%s\n' "$RUNS_PEM" > "$key"
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          h=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          p=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$RUNS_APPID" | b64)
          s=$(printf '%s.%s' "$h" "$p" | openssl dgst -sha256 -sign "$key" -binary | b64) && [ -n "$s" ] || {
            echo "::warning::signing the run-approver App JWT failed; nothing approved (fail-soft)"
            exit 0
          }
          printf 'Authorization: Bearer %s.%s.%s\n' "$h" "$p" "$s" > "$jwt_h"
          inst=$(curl -fsS -H @"$jwt_h" -H "$ACCEPT" "$API/repos/$REPO/installation" \
            | python3 -I -c 'import sys,json; print(int(json.load(sys.stdin)["id"]))') || {
            echo "::warning::the run-approver App has no installation on $REPO, or its JWT was refused; nothing approved (fail-soft)"
            exit 0
          }
          curl -fsS -X POST -H @"$jwt_h" -H "$ACCEPT" "$API/app/installations/$inst/access_tokens" \
            | python3 -I -c 'import sys,json
          t = json.load(sys.stdin)["token"]
          open(sys.argv[1], "w").write("Authorization: Bearer %s\n" % t)' "$tok_h" && [ -s "$tok_h" ] || {
            echo "::warning::minting the run-approver App installation token failed; nothing approved (fail-soft)"
            exit 0
          }
          # The pushed SHA's pull_request runs are created asynchronously,
          # so a listing fired the instant the push step ends can precede
          # every run and approve nothing while they appear moments later
          # (#1283). Bounded poll first: re-list every 5s for up to 60s
          # until one action_required run sits at the pushed SHA the push
          # step exported. An expired window stays fail-soft -- the flow
          # below prints the after-state it always printed, plus one
          # notice naming the timeout, because a genuinely run-less push
          # is legitimate (nothing-staged paths exit before token_push).
          sha_held() {
            curl -fsS -H @"$tok_h" -H "$ACCEPT" \
              "$API/repos/$REPO/actions/runs?branch=$HEAD_REF&status=action_required&per_page=100" \
              | python3 -I -c 'import sys,json
          for r in json.load(sys.stdin).get("workflow_runs", []):
              if r["head_sha"] == sys.argv[1]:
                  print(r["id"])' "$PUSH_SHA"
          }
          waited=0
          hits=$(sha_held)
          while [ -z "$hits" ] && [ "$waited" -lt 60 ]; do
            sleep 5
            waited=$((waited + 5))
            hits=$(sha_held)
          done
          [ -n "$hits" ] || echo "::notice::no action_required run at $PUSH_SHA appeared within ${waited}s of the push; printing the after-state (fail-soft)"
          held_ids() {
            curl -fsS -H @"$tok_h" -H "$ACCEPT" \
              "$API/repos/$REPO/actions/runs?branch=$HEAD_REF&status=action_required&per_page=100" \
              | python3 -I -c 'import sys,json
          for r in json.load(sys.stdin).get("workflow_runs", []):
              print(r["id"], r["name"])'
          }
          held=$(held_ids) || {
            echo "::warning::listing action_required runs on $HEAD_REF failed; nothing approved (fail-soft)"
            exit 0
          }
          approved=0
          while read -r id name; do
            [ -n "$id" ] || continue
            if curl -fsS -X POST -H @"$tok_h" -H "$ACCEPT" "$API/repos/$REPO/actions/runs/$id/approve"; then
              echo "approved run $id ($name)"
              approved=$((approved + 1))
            else
              echo "::warning::approving run $id ($name) was refused; it stays action_required (fail-soft)"
            fi
          done <<< "$held"
          {
            echo "### mutation-autofix: approve held runs"
            echo
            echo '```'
            echo "$approved run(s) on $HEAD_REF approved by the Actions-only App"
            echo "after-state: $(held_ids | wc -l | tr -d ' ') run(s) still action_required"
            held_ids | sed 's/^/  still held: /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # As in closures-autofix (#523): the status reaches the job summary, and
      # a measurement that was owed and did not happen reddens this job.
      - name: Report whether the repair happened
        if: always()
        run: |
          python3 -I "$RUNNER_TEMP/pinned/closure.py" autofix-report --job mutation-autofix \
            --status "${{ steps.autofix.outputs.status }}"
