      # and the dispatched run stands alone. Where GitHub does hold one,
      # the approve step clears it as the Actions-only App -- the RS256 mint
      # tools/pr/app_approve.sh uses, ported inline -- after the same bounded
      # poll for the pushed SHA's runs (#1283). Fail-soft throughout: absent
      # secrets print one notice and approve nothing, and a later error warns
      # rather than reddening a job whose push already happened (red means
