              event_name=os.environ["EVENT_NAME"],
              closures_result=os.environ["FAST_RESULT"],
              head_repo=os.environ["HEAD_REPO"],
              repo=os.environ["REPO"],
              commit_subject=os.environ["SUBJECT"],
              loop_subject="ci: drop inherited claims",
