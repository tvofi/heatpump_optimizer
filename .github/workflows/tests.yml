      - name: Push the pinned ledger
        id: push
        if: steps.autofix.outputs.status == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ inputs.pr }}
          BASE_REF: ${{ inputs.base }}
          USED_PAT: ${{ secrets.CLOSURES_PUSH_TOKEN != '' }}
          PUSH_TOKEN: ${{ secrets.CLOSURES_PUSH_TOKEN || github.token }}
