          # next step's poll, keyed on the pushed SHA (#1283), has hpo-runs
          # approve them; the dispatch below is not held.
          echo "token_push=true" >> "$GITHUB_OUTPUT"
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
