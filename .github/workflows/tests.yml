          # for this pull and push only, the header actions/checkout would
          # have written.
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/claimed_drift.txt tests/golden/card_claimed_drift.txt
          git diff --cached --quiet && {
            echo "claim files unchanged after apply; not pushing"
            exit 0
          }
          git commit -m "ci: drop inherited claims"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            pull --rebase --autostash origin "$HEAD_REF" || true
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push
