            curl -fsS -H @"$tok_h" -H "$ACCEPT" \
              "$API/repos/$REPO/actions/runs?branch=$HEAD_REF&status=action_required&per_page=100" \
              | python3 -I -c 'import sys,json
          for r in json.load(sys.stdin).get("workflow_runs", []):
              print(r["id"], r["name"])'
          }
          held=$(held_ids) || {
            echo "::warning::listing action_required runs on $HEAD_REF failed; nothing approved (fail-soft)"
            exit 0
          }
          approved=0
          while read -r id name; do
            [ -n "$id" ] || continue
            if curl -fsS -X POST -H @"$tok_h" -H "$ACCEPT" "$API/repos/$REPO/actions/runs/$id/approve"; then
              echo "approved run $id ($name)"
              approved=$((approved + 1))
            else
              echo "::warning::approving run $id ($name) was refused; it stays action_required (fail-soft)"
            fi
          done <<< "$held"
          {
            echo "### closures-autofix: approve held runs"
            echo
            echo '```'
            echo "$approved run(s) on $HEAD_REF approved by the Actions-only App"
            echo "after-state: $(held_ids | wc -l | tr -d ' ') run(s) still action_required"
