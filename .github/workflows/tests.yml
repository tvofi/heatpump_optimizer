      # of every program it executes, never the pull request's (the pinned-
      # grader rule of decision 0013), and every Python under `-I`, so no
      # `PYTHONPATH`, `sitecustomize` or module in the working tree runs
      # instead. The copies are unstaged at once: only the repaired file is
      # committed, and `--autostash` below carries them across the pull.
      - name: Restore the programs this job runs from the base commit
        env:
          PINNED: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$PINNED^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=1 origin "$PINNED"
          git checkout "$PINNED" -- tests/closure.py tests/env_drift.py
          git reset -q -- tests/closure.py tests/env_drift.py
