        run: |
          set -euo pipefail
          git cat-file -e "$PINNED^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=1 origin "$PINNED"
          git checkout "$PINNED" -- tests/closure.py tests/mutation_table.py
          git reset -q -- tests/closure.py tests/mutation_table.py
          # The report runs after `pull --rebase --autostash`, which can leave
