name: Tests

# The suite that guards every change. Two jobs:
#
# * fast — every push and PR. Runs the whole of tests/run.sh except the
#   SLOW-gated closed-loop simulation. Golden fixtures are checked in
#   drift mode: solver output is not bit-stable across BLAS builds, so
#   comparing this runner's floats against fixtures recorded on another
#   machine would cry wolf. Instead tests/env_drift.py --all captures
#   every scenario twice IN THIS runner — once from the tree under test,
#   once from a worktree of the comparison ref — and requires the two to
#   be byte-identical. Solver noise cancels; what remains is the
#   change's own behavioural footprint, which must be empty or claimed
#   in tests/golden/claimed_drift.txt.
#
# * slow — nightly and on demand. Same suite plus SLOW=1, which adds
#   tests/rolling.py (the closed-loop learner simulation, ~15 minutes).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  fast:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Drift mode captures all 53 scenarios twice (tree + merge-base); the
    # first main run proved 45 min is not enough on GitHub's runners — the
    # step was cancelled mid-suite by its own timeout.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          # env_drift needs the comparison ref's history to build its
          # baseline worktree.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned test dependencies
        run: pip install -r tests/requirements-ci.txt

      - name: Resolve the golden comparison ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The PR's merge-base with its target: exactly the code this
            # PR forked from, so the drift comparison isolates the PR.
            REF=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            # Push to main: compare against the state before this push.
            REF=$(git rev-parse --verify --quiet 'HEAD^1^{commit}') || REF=""
          fi
          if [ -z "${REF}" ]; then
            # An empty GOLDEN_REF is not "no preference": run.sh and
            # env_drift.py both fall back to origin/main, which on a push to
            # main IS this commit -- the tree would be compared against
            # itself and pass no matter what it did. Fail here instead, where
            # the reason is visible.
            echo "Could not resolve a comparison ref for this ${{ github.event_name }}."
            echo "The drift gate needs a baseline that is not this commit;"
            echo "an empty ref silently becomes origin/main == HEAD."
            exit 1
          fi
          echo "GOLDEN_REF=${REF}" >> "$GITHUB_ENV"

      - name: Run the suite
        env:
          GOLDEN_MODE: drift
          # Shared runners are slower than the development box; the guard
          # still catches order-of-magnitude solver regressions.
          STRESS_SOLVE_BUDGET_MS: "120000"
        run: ./tests/run.sh

  slow:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned test dependencies
        run: pip install -r tests/requirements-ci.txt

      - name: Resolve the golden comparison ref
        run: |
          # Nightly runs sit on main; comparing against the commit before
          # the latest lets the drift gate re-verify the newest merge.
          # There is no fallback on purpose: `|| git rev-parse HEAD` used to
          # sit here, and a ref that resolves to HEAD compares the tree
          # against itself -- byte-identical by construction, so no drift can
          # ever be reported and every claim is stale. env_drift.py now
          # refuses that state; failing here instead says which step is at
          # fault. A root commit (no HEAD^1) is the only way to get here.
          REF=$(git rev-parse --verify --quiet 'HEAD^1^{commit}') || {
            echo "HEAD has no first parent, so there is nothing to compare"
            echo "this tree against. The drift gate needs a real baseline;"
            echo "check out main with history (fetch-depth: 0) and re-run."
            exit 1
          }
          echo "GOLDEN_REF=${REF}" >> "$GITHUB_ENV"

      - name: Run the suite including the closed-loop simulation
        env:
          GOLDEN_MODE: drift
          SLOW: "1"
          STRESS_SOLVE_BUDGET_MS: "120000"
        run: ./tests/run.sh
