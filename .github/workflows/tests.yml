name: Tests

# The suite that guards every change. Two jobs:
#
# * fast — every push and PR. Runs the whole of tests/run.sh except the
#   SLOW-gated closed-loop simulation. Golden fixtures are checked in
#   drift mode: solver output is not bit-stable across BLAS builds, so
#   comparing this runner's floats against fixtures recorded on another
#   machine would cry wolf. Instead tests/env_drift.py --all captures
#   every scenario twice IN THIS runner — once from the tree under test,
#   once from a worktree of the comparison ref — and requires the two to
#   be byte-identical. Solver noise cancels; what remains is the
#   change's own behavioural footprint, which must be empty or claimed
#   in tests/golden/claimed_drift.txt.
#
#   That comparison is computed-against-computed, so neither side of it is
#   the committed file, and until #347 no CI job compared a committed
#   fixture at all -- run.sh skips golden.py entirely in drift mode. The
#   same env_drift run now also judges its own capture against the
#   committed files, in two machine-independent levels that fail this job:
#   exact for the fixtures with no float in them (config_flow), and
#   structural -- key paths and JSON type classes, no scalar values, no list
#   lengths -- for all 55. The value differences that ARE the machine are
#   counted and printed, never failed; the nightly below prints them per
#   fixture so a human can decide what to re-record.
#
#   The env_drift baseline is cached between runs
#   under a key covering the baseline commit and tree, tests/env_drift.py
#   itself, the interpreter, the installed distributions and a bit-exact
#   fingerprint of this runner's floating-point arithmetic. On a push to
#   main the comparison ref is HEAD^1 and differs every run, so nothing is
#   restored and the uncached path is what runs; on a pull request the
#   merge-base is stable, so a second push to the same PR reuses the
#   baseline it already captured. env_drift re-checks the key inside the
#   restored entry before using it, so a wrong restore is a miss rather
#   than a stale baseline.
#
#   run.sh spreads the suite over lanes and runs tests/stress.py alone at
#   the end; every script still runs with the same arguments and every
#   failure still counts.
#
#   SCOPING, and the reason it is safe. On a PULL REQUEST the suite runs
#   with GATE_SCOPE=auto: only the scripts the diff can actually reach
#   are run, decided from the measured dependency closures in
#   tests/closures.json, and so does every workflow_dispatch of this file
#   (an autofix retrigger or the batch proof, against main's merge base).
#   On a PUSH TO MAIN GATE_SCOPE is forced to full and every script
#   runs regardless of what changed. That asymmetry is the whole safety
#   argument: if a closure is ever wrong, the scoped PR gate may miss it,
#   but the very next gate, the unscoped one on main, does not. main goes
#   red within one merge instead of never. Every scoped-out script is
#   printed with its reason in the run log, twice.
#
# * closures — push to main, and on any pull request that can
#   move a closure. Re-records closures by running the suite under
#   instrumentation and fails if tests/closures.json misses anything a
#   real run touched. It runs beside `fast`, so it costs a runner and no
#   wall clock. This is what stops the closures rotting the way a
#   hand-written dependency table would.
#
#   On a push it re-records EVERYTHING. On a pull request
#   `closure-scope` decides, from the diff and the same table:
#   full when a gate file or a file in no recorded closure is touched,
#   and otherwise re-derive only the closures the diff intersects. A
#   `workflow_dispatch` (the batch proof's arm) is scoped the same way,
#   from its own three-dot diff against origin/main, failing closed to
#   full (a1, the round-9 closures pre-study). The
#   old third case -- skip when every changed file is INERT -- is now the
#   docs-only FAST ARM inside the job rather than a skip (#201 item 8):
#   `closures` is a required context on `main-protect`, which SUCCESS
#   satisfies without doubt. (The three `--admin` merges once cited as
#   proof a skip blocks also lacked `hassfest`/`validate-hacs`; #1101.)
#   Before `closure-scope` existed the job ran
#   on a pull request only when one ADDED a file under
#   custom_components/, so a change to what a test reads was checked one
#   merge too late -- five times (#354).
#
# * The nightly lanes -- slow, the mutation nightly and ledger, nightly-ha
#   and the record beat -- are .github/workflows/nightly.yml's since
#   R10-CI-LAYOUT PR 1 (archive/probe/design-ci-rev4, DESIGN-P1 2(a)), so
#   this file has no schedule. It keeps nightly-ha's pull-request arm: the
#   only lane that runs the integration inside a real Home Assistant, run,
#   unrequired, on a pull request whose diff touches what its driver reads
#   (#2056), over the composite action .github/actions/nightly-ha that the
#   nightly arm shares.
#
# * nightly-status — every pull request, seconds, stdlib only. Reads the
#   last CONCLUDED scheduled run of nightly.yml and goes RED if any of
#   its jobs failed, if none concluded recently, or if it could not look.
#   The schedule-only lanes above are `skipped` on every push and nearly
#   every pull request and are not required contexts, so their conclusions land on a
#   commit nobody re-reads and the next merge strands them: #533's lane
#   was red on both arms for two nights and nothing said so. This is the
#   telling. It is deliberately NOT a required context either.
#
# * closures-autofix / claims-autofix / mutation-autofix — same-repo PRs
#   only. Merge UNDER-SCOPED recordings, empty an inherited claim list, or
#   pin measured kills, then retrigger CI. Do not re-implement; see .cursor/rules/ci-autofix.mdc.

on:
  # A unit of the CI umbrella (R10-CI-LAYOUT P2b, unit U5; DESIGN-P2 2.1): ci.yml
  # calls this file once, as job `tests`, when the prelude's workset names it
  # (a code run: pull_request, push, merge_group or a dispatch), so every check
  # reads `tests / <job>`. Inside a call `github.event_name` and `github.event`
  # are the caller's, so every event guard below reads the umbrella's event.
  # The inputs are U0c's interface, each a string defaulting to "".
  workflow_call:
    inputs:
      gate_scope:
        description: "The prelude's scope: auto, or full on push; anything else runs full"
        type: string
        default: ""
      pr:
        description: "The PR this run judges (empty on push and a dispatch naming none)"
        type: string
        default: ""
      base:
        description: "That PR's base ref name"
        type: string
        default: ""
      head:
        description: "The head SHA the prelude derived"
        type: string
        default: ""
      # A dispatch's own `-f recheck=` / `-f no-skip=` (merge_train.py's batch
      # proof dispatches ci.yml with -f recheck=true); empty on every other
      # event, so lane-proofs and closure-scope's laneskip step read them.
      recheck:
        description: "Record and reuse lane proofs like a pull request (the batch proof's arm)"
        type: string
        default: ""
      no-skip:
        description: "Force every heavy lane to run, ignoring recorded green proofs (R9-CI-SKIP)"
        type: string
        default: ""
    # The autofix jobs' push token and the run-approver App, until M-3.
    secrets:
      CLOSURES_PUSH_TOKEN:
        required: false
      HPO_RUNS_PEM:
        required: false
      HPO_RUNS_APPID:
        required: false

# The suite needs the code it tests and the cache it reuses, nothing
# more; every job inherits this read-only floor.
permissions:
  contents: read

# No concurrency group and no cancel-superseded job: the umbrella's run-id
# group holds every run alone, and supersession is ci.yml's own
# cancel-superseded (DESIGN-P2 2.2, rev2 N1).
jobs:
  fast:
    needs: [closure-scope]
    # R9-CI-SKIP: this lane stands down at the STEP level, never the job
    # level, and that is measured, not taste. A matrix job skipped by a
    # job-level `if:` reports its check WITHOUT the matrix suffix -- `fast`,
    # not `fast (3.14)` -- and the required context is `fast (3.14)`, so a
    # job-level skip leaves the merge rule waiting for a check that never
    # reports (demonstrated live on this pull request's first demo head, run
    # 38322500356). A skipped NON-matrix lane keeps its exact name, but under
    # the umbrella a skipped required job FAILs `gate` (DESIGN-P2 4.2), so
    # `browser` and `typing` stand down at the step level too; only `coverage`,
    # required on push alone, where closure-scope never runs, still skips at
    # the job level. So `fast` runs
    # a job that reports SUCCESS while standing down: every step after the
    # report below is gated on the closure-scope decision, which is empty --
    # RUN -- on every event the skip arm does not cover, push to main above
    # all.
    if: >-
      !cancelled() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || github.event_name == 'merge_group'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # The only job that runs the production suite. It was matrixed over both
    # interpreters from #514 until the 3.13 leg was retired: 3.14 is what
    # reported installations actually run, and two legs of a 100-minute
    # instrumented suite is most of this workflow's wall clock for a second
    # answer that had never differed from the first.
    #
    # WHAT THAT GIVES UP, said plainly rather than left to be discovered.
    # 3.13 is still the floor the README and hacs.json declare -- it follows
    # from the Home Assistant 2025.2.0 floor, whose own requires-python is
    # >=3.13.0 -- and it is still the interpreter every other job in this
    # workflow pins. What no longer runs on it is the SUITE. So a 3.13-only
    # break in production code now reaches a user rather than this gate, which
    # is a narrower version of the hole #514 was filed for. `tests/entities.py`
    # keeps the README honest about it: the "suite is tested on" sentence is
    # derived from this matrix alone, so retiring a leg without saying so in
    # the README fails there.
    #
    # fail-fast is now on, which costs nothing while the matrix is one entry
    # and is the right default if a second is ever added back: the reason it
    # was off -- a 3.14 break must not cancel the 3.13 leg, because knowing
    # which of the two broke was the whole signal -- is a reason that only
    # exists while there are two.
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]
    # Drift mode captures all 53 scenarios twice (tree + merge-base); the
    # first main run proved 45 min is not enough on GitHub's runners — the
    # step was cancelled mid-suite by its own timeout.
    timeout-minutes: 100
    steps:
      # Unconditional: the one step a standing-down run still executes, so
      # the log says what the run stands on even when nothing else runs.
      - name: Report the lane-skip decision this run stands on
        run: |
          echo "fast: closure-scope decided '${{ needs.closure-scope.outputs.fast_skip || 'run' }}' for this base and diff."
          if [ "${{ needs.closure-scope.outputs.fast_skip }}" = "skip" ]; then
            echo "A recorded green run at this exact base and diff stands in for this"
            echo "rerun; every step below is skipped and this job reports success."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.closure-scope.outputs.fast_skip != 'skip'
        with:
          # env_drift needs the comparison ref's history to build its
          # baseline worktree.
          fetch-depth: 0

      # The drift baseline cache needs no matrix-specific key: env_drift's
      # cache_key_inputs already hashes the interpreter (`sys.version`,
      # `api_version`) and the installed package inventory, so the two legs
      # compute different keys and cannot restore each other's baseline.
      # A cross-interpreter baseline is exactly the false drift that would
      # otherwise make this matrix unreadable.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.closure-scope.outputs.fast_skip != 'skip'
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.closure-scope.outputs.fast_skip != 'skip'
        with:
          node-version: "22"

      # Every install in this workflow is hash-pinned (#1548), and
      # tests/entities.py refuses one that is not: `--require-hashes` over a
      # committed lock, `--build-constraint` for what an sdist build installs,
      # `npm ci` over a committed package-lock.json. Why each flag is there is
      # in the header of tests/requirements-ci.txt and requirements-build.txt.
      - name: Install pinned test dependencies
        if: needs.closure-scope.outputs.fast_skip != 'skip'
        run: >-
          pip install --require-hashes
          --build-constraint tests/requirements-build.txt
          -r tests/requirements-ci.txt

      - name: Resolve the golden comparison ref
        if: needs.closure-scope.outputs.fast_skip != 'skip'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The PR's merge-base with its target: exactly the code this
            # PR forked from, so the drift comparison isolates the PR.
            REF=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
            # The branch's OWN claim list is read from the PR head, not the
            # synthetic merge tree this checkout is (env_drift's CLAIM_HEAD).
            echo "CLAIM_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            # A queue entry is a merge commit (merge method MERGE): its first
            # parent is the main tip or the entry ahead of it, its second the
            # pull request's head. That is the shape of a pull request's
            # synthetic merge, whose merge-base with its target is the same
            # first parent, so the drift comparison and the claim list are
            # read exactly as on the pull request. No second parent means the
            # queue's merge method changed; fail rather than guess.
            REF=$(git rev-parse --verify --quiet 'HEAD^1^{commit}') || REF=""
            PR_TIP=$(git rev-parse --verify --quiet 'HEAD^2^{commit}') || {
              echo "This merge_group commit has no second parent; the queue must merge with merge method MERGE."
              exit 1
            }
            echo "CLAIM_HEAD=${PR_TIP}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Autofix dispatch is not a pull_request event. Compare against
            # main the same way a PR would, not HEAD^1 (the autofix commit's
            # parent), so leftover drift vs main cannot hide.
            git fetch --no-tags origin main
            REF=$(git merge-base origin/main HEAD)
          else
            # Push to main: compare against the state before this push.
            REF=$(git rev-parse --verify --quiet 'HEAD^1^{commit}') || REF=""
          fi
          if [ -z "${REF}" ]; then
            # An empty GOLDEN_REF is not "no preference": run.sh and
            # env_drift.py both fall back to origin/main, which on a push to
            # main IS this commit -- the tree would be compared against
            # itself and pass no matter what it did. Fail here instead, where
            # the reason is visible.
            echo "Could not resolve a comparison ref for this ${{ github.event_name }}."
            echo "The drift gate needs a baseline that is not this commit;"
            echo "an empty ref silently becomes origin/main == HEAD."
            exit 1
          fi
          echo "GOLDEN_REF=${REF}" >> "$GITHUB_ENV"

      # The key is computed by the same function the run itself uses, so
      # the two can never disagree, and it needs the dependencies above to
      # fingerprint them. Pull requests only: a push to main compares
      # against HEAD^1, a different commit every run, so an entry could
      # never be hit and would only take up room.
      - name: Key the drift baseline cache
        id: driftkey
        if: >-
          github.event_name == 'pull_request'
          || github.event_name == 'merge_group'
          || github.event_name == 'workflow_dispatch'
            && needs.closure-scope.outputs.fast_skip != 'skip'
        env:
          PYTHONPATH: tests/hastub
        run: echo "key=$(python tests/env_drift.py --cache-key "$GOLDEN_REF" --all)" >> "$GITHUB_OUTPUT"

      - name: Restore the drift baseline
        if: >-
          github.event_name == 'pull_request'
          || github.event_name == 'merge_group'
          || github.event_name == 'workflow_dispatch'
            && needs.closure-scope.outputs.fast_skip != 'skip'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/heatpump_optimizer/drift-baseline
          key: drift-baseline-${{ steps.driftkey.outputs.key }}

      # Warm the cache for the PRs that fork from this main commit
      # (issue #94). A merge moves every open PR's merge-base at once, so
      # they all miss the cache and each pays a ~25-minute cold capture.
      # This run already captures the new main tree for its own
      # comparison; DRIFT_WARM_CACHE tells env_drift to store it under
      # the key those PRs will compute -- same cache_store, so the entry
      # keeps its built-in key re-check: a wrong restore is a miss, never
      # a stale baseline. The nightly warms too, keeping the entry fresh
      # for the fork point even on quiet days.
      - name: Key the warmed drift baseline
        id: warmkey
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'schedule'
            && needs.closure-scope.outputs.fast_skip != 'skip'
        env:
          PYTHONPATH: tests/hastub
        run: |
          echo "key=$(python tests/env_drift.py --cache-key "$GITHUB_SHA" --all)" >> "$GITHUB_OUTPUT"
          echo "DRIFT_WARM_CACHE=1" >> "$GITHUB_ENV"

      - name: Run the suite
        if: needs.closure-scope.outputs.fast_skip != 'skip'
        env:
          # CI-cost metrics (tests/ci_ratchet.py): run.sh appends this run's
          # scope decision here when the variable is set; local runs never
          # set it and emit nothing.
          HPO_CI_METRICS: ${{ runner.temp }}/ci-metrics-fast.tsv
          GOLDEN_MODE: drift
          # The scope is the prelude's (its "Decide" step moved there, U5):
          # `auto` on a pull request, the merge queue and a dispatch, against
          # the comparison ref resolved above; anything else -- a push to main
          # above all, or an empty input -- runs the whole suite.
          GATE_SCOPE: ${{ inputs.gate_scope == 'auto' && 'auto' || 'full' }}
          GATE_SCOPE_BASE: ${{ env.GOLDEN_REF }}
          # The architecture-score pair is `arch-instrument`'s, below (U5b):
          # run.sh skips it here by name.
          RUN_PART: fast
          # No STRESS_SOLVE_BUDGET_MS here any more. An absolute wall-clock
          # budget cannot tell a slower solver from a busier runner, and on
          # shared runners it answered the second question. tests/stress.py
          # now budgets the solve's CPU time against a reference solve timed
          # beside it, which does not move when the runner is busy.
          # STRESS_SOLVE_RATIO, STRESS_SWEEP_RATIO and
          # STRESS_SOLVE_CEILING_MS are the knobs if it ever needs one.
          #
          # Threads are pinned because process CPU time sums over all of
          # them: a runner whose core count differs from the machine the
          # ratios were calibrated on would otherwise record a different
          # thread factor for the same work. stress.py checks this and fails
          # if the reference and the scenarios disagree, but pinning means
          # the question never arises.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: ./tests/run.sh

      # CI-cost metrics, lane by lane: the ci-ratchet job on main reads this
      # run's three artifacts plus the recent window's. Always uploaded,
      # however the suite ended -- a red run's cost is still cost -- and
      # empty on a run whose lane never executed a line.
      - name: Upload the fast lane's CI metrics
        if: always() && needs.closure-scope.outputs.fast_skip != 'skip'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-metrics-fast
          path: ${{ runner.temp }}/ci-metrics-fast.tsv
          if-no-files-found: ignore
          retention-days: 7

      # The save half of the warm cache: the entry env_drift wrote under
      # the key from the step above, persisted where the PRs' restore
      # looks. save@v4 (not the post-step of a restore) because this key
      # is computed for a different ref than anything restored here.
      - name: Save the warmed drift baseline
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'schedule'
            && needs.closure-scope.outputs.fast_skip != 'skip'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/heatpump_optimizer/drift-baseline
          key: drift-baseline-${{ steps.warmkey.outputs.key }}

  # The architecture score's own check (R9-EG-A1: tests/arch_score.py and
  # tests/arch_score_head.py), beside `fast` instead of inside it (R10-CI-LAYOUT
  # P2b, U5b; plan section 6, roster carry 3). On a slow runner the pair was
  # about 41 of fast's 58 minutes. run.sh's RUN_PART=arch runs the pair alone,
  # under the same scope `fast` takes and the same lane-skip decision, and
  # its own accounting owes exactly the pair; `fast` skips it by name. Named
  # apart from arch-score.yml's `arch-score`, which grades a pull request WITH
  # the instrument (D-2); this guards the instrument. A required job, so it
  # stands down at the step level (DESIGN-P2 4.2).
  arch-instrument:
    needs: [closure-scope]
    if: >-
      !cancelled() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || github.event_name == 'merge_group'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # The pair's slow-runner time (2350-2436 s, roster carry 3) and set-up.
    timeout-minutes: 60
    steps:
      - name: Say the lane-skip decision this run stands on
        run: |
          echo "arch-instrument: closure-scope decided '${{ needs.closure-scope.outputs.fast_skip || 'run' }}' for fast's base and diff."
          if [ "${{ needs.closure-scope.outputs.fast_skip }}" = "skip" ]; then
            echo "A recorded green run of fast and this job at this exact base and diff"
            echo "stands in for this rerun; every step below is skipped and this job reports success."
          fi

      # Full history: the scoped plan diffs against the merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.closure-scope.outputs.fast_skip != 'skip'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.closure-scope.outputs.fast_skip != 'skip'
        with:
          python-version: "3.14"

      - name: Install pinned test dependencies
        if: needs.closure-scope.outputs.fast_skip != 'skip'
        run: >-
          pip install --require-hashes
          --build-constraint tests/requirements-build.txt
          -r tests/requirements-ci.txt

      # The scope `fast` takes: the prelude's, diffed from the merge base with
      # the PR's base (origin/main on a dispatch naming none); full on push.
      - name: Run the architecture-score pair
        if: needs.closure-scope.outputs.fast_skip != 'skip'
        env:
          RUN_PART: arch
          GATE_SCOPE: ${{ inputs.gate_scope == 'auto' && 'auto' || 'full' }}
          GATE_SCOPE_BASE: origin/${{ inputs.base || 'main' }}
        run: ./tests/run.sh

  # The real-browser layout lane (issue #96): positions, sizes and
  # visibility, the three things the DOM-stub lanes cannot see. Own job
  # because it needs Chromium, which nothing else installs; it consumes
  # the same plan payload card.mjs does. The scoped gate does not decide
  # anything for this lane (it is in NOT_A_TEST) -- the card source is
  # in every closure that matters, and the lane runs on every PR.
  browser:
    needs: [closure-scope]
    # R9-CI-SKIP: Level 1 only -- card_browser.mjs is NOT_A_TEST and no
    # closure has ever measured it, so only the byte-identical-tree case is
    # provable for this lane; closure-scope's browser decision never answers
    # `skip` on a moved base. Empty output reads as RUN, as for `fast`.
    if: >-
      !cancelled() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || github.event_name == 'merge_group'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Unconditional (DESIGN-P2 4.2: no required job ever skips): a required
      # `tests / browser` skipped at the job level FAILs the gate as SKIPPED,
      # so this lane stands down at the step level, as `fast` does, and this is
      # the one step a standing-down run executes.
      - name: Say the lane-skip decision this run stands on
        run: |
          echo "browser: closure-scope decided '${{ needs.closure-scope.outputs.browser_skip || 'run' }}' for this base and diff."
          if [ "${{ needs.closure-scope.outputs.browser_skip }}" = "skip" ]; then
            echo "A recorded green run at this exact base and diff stands in for this"
            echo "rerun; every step below is skipped and this job reports success."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.closure-scope.outputs.browser_skip != 'skip'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.closure-scope.outputs.browser_skip != 'skip'
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.closure-scope.outputs.browser_skip != 'skip'
        with:
          node-version: "22"

      - name: Install pinned test dependencies
        if: needs.closure-scope.outputs.browser_skip != 'skip'
        run: >-
          pip install --require-hashes
          --build-constraint tests/requirements-build.txt
          -r tests/requirements-ci.txt

      - name: Cache the lane's Chromium
        if: needs.closure-scope.outputs.browser_skip != 'skip'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pw-browsers
          # Keyed on the lock, not a typed version: a playwright bump (a
          # Dependabot one included) is a new key, so the new Chromium is
          # cached instead of downloaded on every run under the old key.
          key: pw-chromium-${{ hashFiles('tests/pwlane/package-lock.json') }}

      - name: Install playwright and Chromium
        if: needs.closure-scope.outputs.browser_skip != 'skip'
        run: |
          mkdir -p "$RUNNER_TEMP/pwlane"
          cp tests/pwlane/package.json tests/pwlane/package-lock.json \
            "$RUNNER_TEMP/pwlane/"
          npm ci --prefix "$RUNNER_TEMP/pwlane"
          PLAYWRIGHT_BROWSERS_PATH=~/.cache/pw-browsers \
            "$RUNNER_TEMP/pwlane/node_modules/.bin/playwright" install chromium

      - name: Write the plan payload
        if: needs.closure-scope.outputs.browser_skip != 'skip'
        env:
          PYTHONPATH: tests/hastub
        run: python tests/plan_view.py

      - name: Run the layout lane
        if: needs.closure-scope.outputs.browser_skip != 'skip'
        # PLAYWRIGHT_BROWSERS_PATH in the run command, not the step env:
        # a `~` in a workflow env var is a literal tilde, which Playwright
        # resolves relative to the repository -- the shell expands $HOME.
        run: >
          PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/pw-browsers"
          NODE_PATH="${{ runner.temp }}/pwlane/node_modules"
          node tests/card_browser.mjs

  # The brief-citation linter (#411). `.claude/` is on tests/closure.py's
  # INERT list -- closure.py's own merge check FAILS if an INERT file turns
  # up in a recorded closure -- so the scoped gate structurally cannot see
  # this directory. Same shape as `browser` above (also driving an INERT
  # script, tests/card_browser.mjs): its own never-scoped job, `if:` copied
  # verbatim, so `closure-scope`'s case output cannot skip it. `node
  # tools/policy/check-wave-script.mjs` is the other file in this
  # position and still runs by hand only, which leaves the wave resume control
  # flow as the one piece of orchestration no CI job runs; a job of this shape
  # for it is owed.
  #
  # Live wave-*-groups.json must lint clean (0 errors) so this job can
  # stay green on main. The 931dffe acceptance fixture is the rot pin:
  # brief_lint.mjs's no-arg path requires those ten errors, so gutting
  # lintBrief cannot green the job.
  briefs:
    if: >-
      !cancelled() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || github.event_name == 'merge_group'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are not fetched by a plain checkout. Fetched here (rather
          # than skipped) so a tag-scoped citation gets verified for real in
          # CI instead of only warned about; the linter still degrades to a
          # warning on its own if a cited tag is ever unresolvable.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Pinned as governance.yml's `policy-docs` is (decision 0013): the
      # rosters are the pull request's, the linter the base's.
      - name: Restore the check source from the base commit
        env:
          PINNED: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (inputs.base && format('origin/{0}', inputs.base)) || github.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$PINNED^{commit}" 2>/dev/null || git fetch -q --no-tags --depth=1 origin "$PINNED"
          rm -rf .claude/workflows/vendor
          # Each program at its path before and after the reorganisation (R9-RO-2):
          # the diff lists what PINNED holds of them, skipping the half it lacks,
          # which a checkout of a pathspec would refuse. R9-RO-9 drops the old half.
          git diff --name-only -z "$(git hash-object -t tree /dev/null)" "$PINNED" -- \
            '.claude/workflows/*.mjs' \
            '.claude/workflows/*.py' \
            '.claude/workflows/vendor' \
            'tools/audit/*.sh' \
            'tools/audit/record-predicate' \
            'tools/audit/round6/D11/fix/codeowners_gap.py' \
            'tools/policy/*.mjs' \
            'tools/policy/*.py' \
            'tools/pr/*.py' \
            'tools/policy/vendor' \
            'tools/pr/*.sh' \
            'tools/seat/*.sh' \
            'tools/coverage/*.sh' \
            'dev/audit/*.sh' \
            'tools/policy/record-predicate' \
            'dev/audit/rounds/round6/D11/fix/codeowners_gap.py' \
            'tests/layout.py' > "$RUNNER_TEMP/pinned.list"
          test -s "$RUNNER_TEMP/pinned.list"
          git checkout "$PINNED" --pathspec-from-file="$RUNNER_TEMP/pinned.list" --pathspec-file-nul
          echo "check source restored from $PINNED: $(git diff --cached --name-only | wc -l) file(s) differ from the pull request's copy"
          test -f .claude/workflows/policy_lint.mjs || test -f tools/policy/policy_lint.mjs

      - name: Lint every wave roster's citations
        run: if test -f .claude/workflows/brief_lint.mjs; then node .claude/workflows/brief_lint.mjs; else node tools/policy/brief_lint.mjs; fi

  # The pinned, stub-free typing ruler (#303). Three numbers -- the error
  # count, its per-code split, and the `# type: ignore` count -- and none of
  # them may grow. It is a job of its own rather than a lane of `fast`
  # because it needs a toolchain no gate lane has: mypy plus real Home
  # Assistant type information, in a virtualenv built for the purpose. That
  # is the `browser` and `nightly-ha` shape.
  #
  # The ruler's dependency-free half runs in `fast` too (tests/typing_ruler.py
  # in the units lane), and deliberately: the ignore count is the guard
  # `--warn-unused-ignores` does not provide, and it must not be the metric
  # that goes unchecked on the day this install fails.
  typing:
    needs: [closure-scope]
    if: >-
      !cancelled() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || github.event_name == 'merge_group'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Unconditional (DESIGN-P2 4.2: no required job ever skips): a required
      # `tests / typing` skipped at the job level FAILs the gate as SKIPPED,
      # so this lane stands down at the step level, as `fast` does, and this is
      # the one step a standing-down run executes.
      - name: Say the lane-skip decision this run stands on
        run: |
          echo "typing: closure-scope decided '${{ needs.closure-scope.outputs.typing_skip || 'run' }}' for this base and diff."
          if [ "${{ needs.closure-scope.outputs.typing_skip }}" = "skip" ]; then
            echo "A recorded green run at this exact base and diff stands in for this"
            echo "rerun; every step below is skipped and this job reports success."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.closure-scope.outputs.typing_skip != 'skip'

      # Not matrixed over the interpreters `fast` uses. The pin is a PAIR and
      # the two halves constrain each other: homeassistant-stubs 2026.9.3
      # refuses to install below Python 3.14.2, so exactly one interpreter
      # line satisfies the pin this ruler is defined by (#504). A second leg
      # would either fail to install or measure something else and call it
      # the same number.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.closure-scope.outputs.typing_skip != 'skip'
        with:
          python-version: "3.14"

      # The versions are recorded in tests/typing_budgets.json and installed
      # from tests/requirements-typing.txt, the hash-pinned resolution of
      # exactly what `typing_ruler.py --print-requirements` names (#1548).
      # The two cannot drift apart unseen: the source-only ruler in `fast`
      # refuses a lock whose mypy or homeassistant-stubs pin is not the
      # recorded pair, and guard 2 below refuses an installed pair that is not.
      # --no-deps: the lock overrides homeassistant's cryptography pin (see
      # its header), and it is already the complete resolution.
      - name: Install the pinned toolchain
        if: needs.closure-scope.outputs.typing_skip != 'skip'
        run: |
          python3 -m venv .venv-typing
          .venv-typing/bin/python -m pip install --require-hashes --no-deps \
            --build-constraint tests/requirements-build.txt \
            -r tests/requirements-typing.txt

      # Run BY the pinned interpreter, so the ruler introspects the
      # environment it is measuring in rather than being told about it.
      - name: Run the ruler and ratchet its three numbers
        if: needs.closure-scope.outputs.typing_skip != 'skip'
        run: |
          .venv-typing/bin/python tests/typing_ruler.py --mypy \
            --emit "$RUNNER_TEMP/typing-census.json"

      # Kept on a failure too: the run that refuses because the census is not
      # yet recorded is exactly the run whose numbers are wanted.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.closure-scope.outputs.typing_skip != 'skip'
        with:
          name: typing-census
          path: ${{ runner.temp }}/typing-census.json
          if-no-files-found: ignore

  # Two numbers `fast` cannot produce, both running beside it rather than
  # inside it: how much of the package the suite EXECUTES, and how much of it
  # the suite would NOTICE being wrong. They are different questions and the
  # second is the one that decides whether a check is worth its line -- five
  # W5-G7 tranches found twenty-two checks that executed the line they were
  # named for and pinned nothing, all of them green coverage.
  #
  # Neither is matrixed. Coverage of a statement does not depend on the
  # interpreter that ran it, and a second leg would pay a whole instrumented
  # suite to print the same floor.
  coverage:
    needs: [closure-scope]
    # R9-CI-SKIP, both levels as for `fast`: this lane measures the same
    # `closure.py select` plan under a tracer, so the closures table proves
    # its inputs unmoved exactly as it proves fast's. Not a required context,
    # so a skip here buys runner minutes and one queue slot, not a verdict.
    if: >-
      !cancelled() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || github.event_name == 'workflow_dispatch'
      ) && needs.closure-scope.outputs.coverage_skip != 'skip'
    runs-on: ubuntu-latest
    # The instrumented `fast` stage is the whole default gate minus the four
    # end-to-end scripts, run under a tracer that costs roughly a third again.
    timeout-minutes: 90
    steps:
      # Full history: the scope below diffs against the merge base and reads
      # that base's tests/closures.json, as `fast`'s does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Per-script coverage is reused from the push run at the diff's base
      # (R9-F10.9b, #1812) -- and, since the V1 lever, the push arm reuses
      # the same way: its entry is derivable by the same formula at the
      # first parent (HEAD^1, the previous push to main), so a push diff
      # that clears a script's closure copies that script's data instead of
      # re-measuring it. The key is the base commit plus everything that
      # decides what a script's data means: the instrument, the tracer and
      # dependency locks, and the interpreter. A change to any of them is a
      # different key, so a miss, so every script is measured. A push keys
      # its own commit and saves. The runner's OS is in the key as well,
      # since the tracer's data is the platform's (#1822 review, R9-F10.9c).
      - name: Key the per-script coverage
        id: covkey
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE=$(git rev-parse HEAD)
            RESTORE_BASE=$(git rev-parse HEAD^1)
          else
            BASE=$(git merge-base origin/main HEAD)
            RESTORE_BASE=$BASE
          fi
          PY=$(python -c 'import sys; print(sys.version.split()[0])')
          HASH="${{ hashFiles('tools/audit/w5-partition/coverage_tree.sh', 'tools/coverage/coverage_tree.sh', 'tests/requirements-coverage.txt', 'tests/requirements-ci.txt', 'tests/requirements-build.txt') }}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "restore_base=$RESTORE_BASE" >> "$GITHUB_OUTPUT"
          echo "key=coverage-per-v1-${{ runner.os }}-$BASE-py$PY-$HASH" >> "$GITHUB_OUTPUT"
          echo "restore_key=coverage-per-v1-${{ runner.os }}-$RESTORE_BASE-py$PY-$HASH" >> "$GITHUB_OUTPUT"

      # An exact key and no restore-keys: data from any other commit is a
      # miss. The push arm restores its parent's entry by the same rule.
      - name: Restore the base's per-script coverage
        id: covbase
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/coverage-base
          key: ${{ steps.covkey.outputs.restore_key }}

      # THE ENTRY MUST BE MAIN'S PUSH RUN'S (#1822 review, R9-F10.9c). A
      # restore searches this pull request's own cache scope before main's, so
      # an earlier head of the same pull request whose tests.yml saved under
      # this key would be restored here in place of the push run's data. The
      # push run writes a marker naming its event, ref and commit; an entry
      # whose marker is not a push to main at this key's base is discarded and
      # every script is measured, as on a miss. BASE here is that base: the
      # merge base on a pull request, HEAD^1 on a push. A head that forges the
      # marker too is not caught here: the diff's plan then still skips only
      # what select says it may, and the scoped gate's own discipline applies.
      - name: Check the restored coverage is main's push run's
        id: covtrust
        if: steps.covbase.outputs.cache-hit == 'true'
        env:
          BASE: ${{ steps.covkey.outputs.restore_base }}
        run: |
          # The decision is closure.py's, not this step's, so the selftest
          # pins it: a non-push marker, a marker at another commit and a
          # missing marker are all discards, and reuse never engages from a
          # non-push run.
          if python tests/closure.py coverage-trust \
              --reuse-dir "$RUNNER_TEMP/coverage-base" \
              --expect "push refs/heads/main $BASE"; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf "$RUNNER_TEMP/coverage-base"
          fi

      - name: Install pinned test dependencies
        run: >-
          pip install --require-hashes
          --build-constraint tests/requirements-build.txt
          -r tests/requirements-ci.txt

      # Deliberately NOT added to tests/requirements-ci.txt. env_drift's cache
      # key fingerprints the installed distribution set, so a package added
      # there invalidates the drift baseline for every `fast` run in the
      # repository -- a whole-repo cache miss to give one job a tracer. The pin
      # is exact for the same reason the rest are: coverage.py's default pragma
      # pattern is what decides whether an exempted line leaves the
      # denominator, and tests/coverage_ratchet.py counts against that pattern.
      - name: Install the tracer
        run: >-
          pip install --require-hashes
          --build-constraint tests/requirements-build.txt
          -r tests/requirements-coverage.txt

      # Writes nothing inside the worktree: W5P_OUT defaults under W5P_WORK, so
      # the measurement leaves no untracked evidence tree behind.
      #
      # The exit status of the stage is NOT this job's verdict and is not read
      # here. tests/features.py fails its #525 heartbeat pair under any tracer
      # -- both arms read zero ticks, the null control included, because the
      # tracer removes the stall the check exists to see -- and that pair is
      # `fast`'s to judge, on an uninstrumented run, where it is honest. What
      # this job judges is the JSON.
      - name: Measure the tree
        env:
          # CI-cost metrics (tests/ci_ratchet.py): coverage_tree.sh appends
          # one line per instrumented script execution here.
          HPO_CI_METRICS: ${{ runner.temp }}/ci-metrics-coverage.tsv
        run: |
          # EXPORTED, not merely set: coverage_tree.sh reads W5P_WORK from the
          # environment and refuses without it, and the refusal is a one-line
          # message the `|| true` below would otherwise swallow into an empty
          # `out/` and a confusing "produced no coverage.json".
          export W5P_WORK
          W5P_WORK=$(mktemp -d)
          echo "W5P_WORK=$W5P_WORK" >> "$GITHUB_ENV"
          # The gate's own scope for this diff decides which scripts can
          # reuse the base's data: a script the plan skips has no changed file
          # in its measured closure. The diff is against the restored base --
          # the merge base on a pull request, HEAD^1 on a push (V1: the push
          # arm reuses under the same rule and the same FULL plan on a diff
          # no closure mentions). Only on a hit the marker check trusted; a
          # miss or a discarded entry measures everything.
          if [ "${{ steps.covtrust.outputs.trusted }}" = "true" ]; then
            PYTHONPATH=tests/hastub python tests/closure.py select \
              --diff "${{ steps.covkey.outputs.restore_base }}" \
              --workdir "$RUNNER_TEMP/coverage-scope"
            export W5P_SCOPE="$RUNNER_TEMP/coverage-scope/scope.json"
            export W5P_REUSE="$RUNNER_TEMP/coverage-base"
          else
            echo "No per-script coverage for ${{ steps.covkey.outputs.base }}: measuring every script."
          fi
          if test -f tools/audit/w5-partition/coverage_tree.sh; then
            tools/audit/w5-partition/coverage_tree.sh fast || true
          else
            tools/coverage/coverage_tree.sh fast || true
          fi
          test -s "$W5P_WORK/out/coverage.json" || {
            echo "The instrument produced no coverage.json. That is this job"
            echo "failing, not the ratchet: there is no measurement to judge."
            exit 1
          }

      # The honest count, where the reader is (V1): how many script
      # measurements this run copied from the base instead of re-measuring,
      # with the bounded loss stated in the same line.
      - name: Summarize the per-script reuse
        if: always()
        run: |
          if test -s "$W5P_WORK/out/scripts.tsv"; then
            python tests/closure.py coverage-summary "$W5P_WORK/out/scripts.tsv" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no per-script table: the instrument produced no measurement" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Kept on a failure too: the run that refuses because the floor moved is
      # exactly the run whose per-module numbers are wanted.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-json
          path: ${{ env.W5P_WORK }}/out/coverage.json
          if-no-files-found: ignore

      - name: Upload the coverage lane's CI metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-metrics-coverage
          path: ${{ runner.temp }}/ci-metrics-coverage.tsv
          if-no-files-found: ignore
          retention-days: 7

      # The next runs' base: this commit's per/ directory, every script in it
      # either measured here or copied from the previous push with its
      # provenance.tsv saying which (V1). Copied to the path the restore
      # names, because a cache entry's version hashes its path: saved from
      # the mktemp directory, no restore would ever hit.
      - name: Stage this commit's per-script coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp -R "$W5P_WORK/out/per" "$RUNNER_TEMP/coverage-base"
          printf '%s %s %s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/coverage-base/.measured-by"

      - name: Save this commit's per-script coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/coverage-base
          key: ${{ steps.covkey.outputs.key }}

  # The coverage ratchet, in a job of its own (decision 0013, amended).
  # `coverage` above runs the pull request's suite, so nothing after that in
  # the same job is the base's any more. This job runs no program the pull
  # request carries before its grader, and grades the JSON `coverage`
  # measured. That measurement is still the output of the pull request's code:
  # the pin closes an edit to the grader, not a suite that misreports.
  coverage-ratchet:
    needs: [coverage]
    # R9-CI-SKIP: grades the JSON `coverage` measured, so a coverage that
    # SKIPPED -- a recorded green stands in for the run -- has no fresh JSON
    # and nothing to grade; the recorded run's ratchet already passed on the
    # identical inputs. Without this guard a skip here would redden on the
    # missing artifact, which is the failure the skip exists to prevent.
    if: >-
      !cancelled() && needs.coverage.result != 'skipped' && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # A missing artifact fails this step, so a measurement that never
      # happened is a red here, never a green.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-json
          path: ${{ runner.temp }}/coverage

      # PINNED (decision 0013): restored from the base, checked byte-identical
      # to the base's object, and run under `-I -S`, all in this one step.
      # Nothing before it in this job runs the pull request's code: after
      # anything that did, the job would be the pull request's (it could
      # overwrite the file, put a shim on `$GITHUB_PATH`, set `BASH_ENV`
      # through `$GITHUB_ENV`, or use the runner's sudo). This file is
      # @tvofi's, so that review keeps it true; `codeowners_gap.py --check` is
      # a lint that refuses the forms known to break it. The pull
      # request's own copy runs in `graders-head-copy`, which is not required.
      - name: Ratchet the floor and the pragma count with the base's grader
        env:
          PINNED: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$PINNED^{commit}" 2>/dev/null || git fetch -q --no-tags --depth=1 origin "$PINNED"
          git checkout "$PINNED" -- \
            'tests/coverage_ratchet.py'
          test "$(git hash-object tests/coverage_ratchet.py)" = "$(git rev-parse "$PINNED:tests/coverage_ratchet.py")"
          python3 -I -S tests/coverage_ratchet.py \
            --coverage "$RUNNER_TEMP/coverage/coverage.json"

  # The mutation table. Scope is the files that were actually tested: the
  # production files a pull request changes, or -- for a test-only diff -- the
  # production files in the MEASURED closure of each changed script, the same
  # recording tests/closures.json gives the scoped gate.
  #
  # It does not mutate the checkout. Every worker copies the working tree
  # first, so a cancelled job cannot leave a production file edited for a
  # later step to read, which an in-place `try/finally` still can: a SIGKILL
  # does not run `finally`.
  mutation:
    if: >-
      !cancelled() && (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || github.event_name == 'merge_group'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 160
    # The shard matrix `mutation-pins` expands (R10-CI-LAYOUT PR 1: the plan
    # step was its own job, `mutation-pin-plan`, until it folded in here).
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --scope changed diffs three-dot against the merge base, which a
          # shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned test dependencies
        run: >-
          pip install --require-hashes
          --build-constraint tests/requirements-build.txt
          -r tests/requirements-ci.txt

      # `--jobs` is sized to the runner, not to taste: the drivers are
      # single-threaded, so more workers than cores only lengthens every
      # mutant's wall clock. The pool is small on purpose -- its job is to
      # catch a change that stops being noticed, not to estimate a rate, which
      # is what the nightly below is for.
      - name: Drive the table over what this diff tested
        shell: bash
        run: |
          git fetch --no-tags origin main
          set -o pipefail
          python3 tests/mutation_table.py \
            --scope changed --base origin/main --max 10 --jobs 3 \
            | tee "$RUNNER_TEMP/mutation-table.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-table
          path: ${{ runner.temp }}/mutation-table.txt
          if-no-files-found: ignore

      # Sizes `mutation-pins`' matrix from the table just written, the head's
      # mutation_table.py as the drive step above runs it, with no grant.
      # `always()`: a refusal fails the drive step, and that run is exactly
      # the one whose `shards` the pin chain needs -- skipped, it would leave
      # `fromJSON('')` failing `mutation-pins` at expansion. It only writes
      # $GITHUB_OUTPUT and must not fail the lane: the `touch` covers a drive
      # that wrote no table.
      - name: Size the shard matrix from the sites the diff added
        id: plan
        if: always()
        run: |
          touch "$RUNNER_TEMP/mutation-table.txt"
          python3 -I - "$RUNNER_TEMP/mutation-table.txt" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.path.insert(0, "tests")
          import mutation_table
          n = mutation_table.pin_shard_count(open(sys.argv[1]).read())
          print(f"count={n}")
          print(f"shards={json.dumps(list(range(1, n + 1)))}")
          PY
          cat "$GITHUB_OUTPUT"

  # The measuring half of `mutation-autofix`: no write grant, because the
  # drivers are the pull request's code and never run beside a token that can
  # push. Only a ratchet refusal ("N unpinned site(s) against M") is measured
  # -- a breached survivor cap is a finding, not a missing pin. The measuring
  # PROGRAM is the base's copy of mutation_table.py -- the pull request's base
  # commit, as mutation-autofix restores it, so a stacked pull request
  # measures with the program its base carries -- and a pull request that
  # edits the tool cannot change how its own kills are measured; the status
  # and the apply step are this head's code, the trust every autofix job
  # already extends. The copy is kept out of the worker overlay
  # (`.git/info/exclude`): an untracked script there reddens entities.py's
  # closure checks at baseline and no kill could ever be measured (#1599's
  # review). The status is `measurement()`'s, read from the program's own
  # summary line, so a run that did not measure reddens the autofix job.
  #
  # SHARDED (R9-CI-1). One runner pinned 10 of #2025's 56 sites in its budget
  # and left 46 for later pushes, each paying the baselines again. The shards
  # split the sites by anchor (`pin_shard`) and run at once, each with the
  # whole budget; mutation-autofix merges their artifacts (`merge_pin_shards`)
  # into one commit. `mutation`'s plan step sizes the matrix from the refusal's
  # site count (`pin_shard_count`: five sites a shard, at most twelve -- the
  # sizes the 260-minute budget and this job's concurrency were derived
  # from), so a big diff costs runners rather than wall clock. A base
  # program without --shard runs whole on shard 1 and the other shards stand
  # down.
  mutation-pins:
    needs: [mutation]
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && needs.mutation.result == 'failure'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The step's 340 plus this runner's checkout, pip install and upload
    # (R9-CI-1 round 2: the budget the step hands the base program is 260).
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shard: ${{ fromJSON(needs.mutation.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned test dependencies
        run: >-
          pip install --require-hashes
          --build-constraint tests/requirements-build.txt
          -r tests/requirements-ci.txt

      - name: Download the lane's table
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: mutation-table
          path: ${{ runner.temp }}

      - name: Measure pins for the sites this diff added unpinned
        id: pins
        timeout-minutes: 340
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation.outputs.count }}
        run: |
          set -uo pipefail
          git fetch --no-tags origin main
          out="$RUNNER_TEMP/mutation-pins"
          mkdir -p "$out"
          printf '%s\n' "$PR_HEAD" > "$out/head"
          touch "$RUNNER_TEMP/mutation-table.txt"
          python3 -c 'import json, sys; sys.path.insert(0, "tests"); import mutation_table as m; print(json.dumps(m.load_budgets()))' \
            > "$RUNNER_TEMP/ledger-before.json"
          rm -f "$RUNNER_TEMP/pin-run.txt"
          # 260 minutes under a 340-minute step and a 350-minute job, sized
          # from the run that measured the pool instead of estimating it
          # (R9-CI-1 round 2, run 37925123437 shard 3, base b2b6acd64: 5
          # draw_range.py sites). Its shared drivers are ~3160 s of recorded
          # seconds a site; the 3-worker pool cost 1.46x that, so five sites
          # took ~128 min of shared work, and each survivor's EXCLUSIVE tail
          # (stress.py and harness_headers.py, a settle and a run each, ~980 s)
          # would have added ~114 min more -- ~248 min against the 120-minute
          # budget the run had, so every tail was cut and the shard refused
          # having completed nothing. 260 covers it. The step adds the worst
          # run that can still be in flight at the deadline --
          # driver_timeout is TIMEOUT_SCALE (3) x the driver's own seconds, so
          # boost_drift_replay.py's recorded 1489.6 s is ~75 min -- and the
          # job adds this runner's checkout, pip install and upload. A base
          # program that has the flag gets it; pin_shard_count sizes the
          # matrix so a shard holds five sites.
          budget=()
          shard=()
          run=1
          if grep -qE '^MUTATION TABLE REFUSED -- [0-9]+ unpinned site\(s\) against' \
               "$RUNNER_TEMP/mutation-table.txt" \
             && git show "$PR_BASE":tests/mutation_table.py > tests/_mutation_table_base.py \
             && grep -q -- '--pin-killed' tests/_mutation_table_base.py; then
            echo tests/_mutation_table_base.py >> .git/info/exclude
            grep -q -- '--budget-minutes' tests/_mutation_table_base.py \
              && budget=(--budget-minutes 260)
            if grep -q -- '--shard' tests/_mutation_table_base.py; then
              shard=(--shard "$SHARD/$SHARDS")
            elif [ "$SHARD" != 1 ]; then
              run=0
              echo "base program has no --shard: shard 1 measures the whole pool"
            fi
            # A refusal exits non-zero; the runner's `bash -e` would end the
            # step there, before measurement() wrote any status, and
            # mutation-autofix then read a missing file as skip-no-measurement
            # (#2025, run 37663843895). measurement() grades the run instead.
            [ "$run" = 1 ] && { python3 tests/_mutation_table_base.py --pin-killed --base origin/main --jobs 3 \
              "${budget[@]}" "${shard[@]}" 2>&1 | tee "$RUNNER_TEMP/pin-run.txt" \
              || echo "pin run exited non-zero; measurement() grades it"; }
          fi
          rm -f tests/_mutation_table_base.py
          [ "$run" = 1 ] || exit 0
          python3 - "$RUNNER_TEMP" "$out" <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tests")
          import mutation_table
          tmp, out = Path(sys.argv[1]), Path(sys.argv[2])
          run = tmp / "pin-run.txt"
          status, added = mutation_table.measurement(
              (tmp / "mutation-table.txt").read_text(),
              run.read_text() if run.exists() else None,
              json.loads((tmp / "ledger-before.json").read_text()),
              mutation_table.load_budgets())
          (out / "pins.json").write_text(json.dumps(added, indent=2))
          (out / "status").write_text(status + "\n")
          print(f"measure: {status}, {len(added)} anchor(s)")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.pins.outcome != 'skipped'
        with:
          name: mutation-pins-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutation-pins/
          if-no-files-found: ignore

  # Real Home Assistant, in the container an installation actually runs
  # (#521). Every other lane -- tests/deployment_shape.py included -- gets
  # `homeassistant` from tests/hastub, so none of them has ever observed real
  # import or setup semantics; that is the third divergence of #513, and it
  # is how #511 shipped a total loss of function in v6.3.15 behind a green
  # suite. The check that carries the value is that a PLAN CAME OUT: setup
  # succeeded throughout #511, so a lane asserting only "it loaded" would
  # have been green for the whole release.
  #
  # Here, on a pull request only, when its three-dot diff touches a file the
  # lane's own driver reads outside the package (the `nightly_ha` output of
  # `closure-scope`); the nightly and on-demand arm is nightly.yml's copy of
  # this job, over the same composite action. It costs minutes, needs Docker,
  # and is the first lane here that can go red for a reason outside this
  # repository -- a registry outage, or a Home Assistant release changing
  # setup behaviour. It blocks nothing, and it is not one of the required
  # contexts on the main-protect ruleset.
  #
  # Why a pull request at all (#2056's root cause): #2041 added the A16 check,
  # whose container half no pull-request lane executes, and its reviewer wrote
  # that it "runs on schedule or dispatch only" and was not run. Both arms went
  # red at the next schedule on main. A change to the driver is the one change
  # whose container half nothing else can run, so it runs here before merge.
  # A change to the package alone does not: catching the product late in real
  # Home Assistant is what this lane is for, and running it on every product
  # pull request would put a registry outage on all of them.
  #
  # "It reports loudly" is what this comment used to say next, and it was
  # measured false. What it does is attach its conclusion to whatever commit
  # was main's head when the schedule fired, as a check run beside that
  # commit's own `nightly-ha skipped` from the push event. Nothing notifies,
  # and the NEXT merge moves the head and strands the red on a commit no one
  # re-reads: two consecutive nights of both matrix arms failing in `_stage`
  # were found by a seat sent looking, not by the lane telling anyone. That is
  # a known and accepted property -- the whole reason it is unrequired is that
  # it can go red for the outside-this-repository reasons above, and a lane
  # that files an issue for a registry outage is worse than a quiet one. What
  # follows from it is that a defect reaching THIS lane is expensive to
  # notice, so the cheap checks that keep it runnable belong in the PR gate
  # instead: `tests/entities.py` pins the wiring of the step below.
  nightly-ha:
    needs: [closure-scope]
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && needs.closure-scope.outputs.nightly_ha == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Unrequired, and on a pull request its verdict is about the pull
    # request's own driver: it grades nothing (codeowners_gap.py's rule), so
    # the driver it runs from the pull request's copy needs no pin.
    env:
      HPO_JOB_GRADES: nothing
    strategy:
      # Both images report. A floor that breaks while stable does not is the
      # most informative outcome this lane has, and fail-fast would hide it.
      fail-fast: false
      matrix:
        # The floor the integration supports (#514), and whatever is current.
        image: ["2025.2.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every step after the checkout is the composite action's, the one
      # nightly.yml's schedule arm runs too (R10-CI-LAYOUT PR 1): a matrix
      # suffix survives a composite action, where a reusable workflow would
      # rename the check `nightly-ha / ...` and nightly_status would read the
      # lane as MISSING.
      - uses: ./.github/actions/nightly-ha
        with:
          image: ${{ matrix.image }}

  # The telling. `nightly-ha` and `slow` run on nightly.yml's `schedule` (and
  # dispatch), never on a pull request but for nightly-ha's driver arm above,
  # and are not required contexts -- so a
  # scheduled run's conclusion attaches to whatever commit was main's head when
  # the cron fired, beside that same commit's own `skipped` from the push, and
  # the next merge moves the head and strands it. Nothing notifies. Both
  # `nightly-ha` arms failed on the 2026-09-09 and 2026-09-10 schedules and a
  # seat sent looking found it two nights later (#533).
  #
  # It is its own RED CHECK and not a warning printed inside one of the green
  # jobs above, deliberately. `.cursor/rules/ci-autofix.mdc` says read the
  # summary line and not the tick, and `.cursor/rules/brief-citations.mdc`
  # names `FIXTURE ok: N error(s)` as the shape "designed to print beside a
  # clean exit, which is exactly the shape that lets a real error be waved
  # through". A warning inside a passing job IS that shape, and the defect
  # being fixed is that nobody looked.
  #
  # It must NOT be added to the required contexts on `main-protect`. The
  # property that makes `nightly-ha` unrequired is real -- a registry outage or
  # a Home Assistant release can redden it, and neither is a reason to refuse
  # an unrelated merge -- and requiring this would transfer that to every pull
  # request in the repository. The report itself says so on every run.
  #
  # Pull requests only, not pushes to main: a lane that can go red for reasons
  # outside this repository must not be able to turn `main` red, which is the
  # signal the forced-full gate above exists to keep meaningful.
  nightly-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Actions metadata -- which runs exist and how they concluded -- is not
    # repository content, and the workflow's `contents: read` floor cannot see
    # it. This is a widening of that floor and is written down as one. It is
    # read-only, and it is far narrower than the `issues: write` the auto-filing
    # countermeasure would have needed, which is why that one was rejected and
    # this one is not. Declared at JOB level: a job-level `permissions:` block
    # REPLACES the workflow default for this job alone and is inherited by no
    # other job, so every other job in this file still runs on `contents: read`.
    # `tests/entities.py` pins the whole set of jobs that override the floor --
    # this one and the three autofix jobs, which push a commit and retrigger this
    # workflow and so carry `contents: write` and `actions: write` -- and that
    # this one's block carries no `write` at all. A fifth override then has to
    # be argued for rather than land.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # No `pip install` step, unlike the jobs that install
      # `tests/requirements-ci.txt`: the reporter is stdlib-only on purpose. A
      # check whose job is to notice that a lane went dark must not be
      # breakable by the same dependency set that darkened it -- which is
      # exactly how #533's lane went dark -- and it costs seconds this way.
      # PINNED (decision 0013): restored from the base, checked byte-identical
      # to the base's object, and run under `-I -S`, all in this one step.
      # Nothing before it in this job runs the pull request's code: after
      # anything that did, the job would be the pull request's (it could
      # overwrite the file, put a shim on `$GITHUB_PATH`, set `BASH_ENV`
      # through `$GITHUB_ENV`, or use the runner's sudo). This file is
      # @tvofi's, so that review keeps it true; `codeowners_gap.py --check` is
      # a lint that refuses the forms known to break it. The pull
      # request's own copy runs in `graders-head-copy`, which is not required.
      - name: Report the last scheduled run's conclusion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$PINNED^{commit}" 2>/dev/null || git fetch -q --no-tags --depth=1 origin "$PINNED"
          git checkout "$PINNED" -- \
            'tests/nightly_status.py'
          test "$(git hash-object tests/nightly_status.py)" = "$(git rev-parse "$PINNED:tests/nightly_status.py")"
          python -I -S tests/nightly_status.py

  # THE PULL REQUEST'S OWN COPY OF EACH PINNED GRADER (decision 0013, amended
  # 2026-09-24). `coverage-ratchet`, `nightly-status` and governance.yml's
  # `delivery-status` restore their grader from the base, so a pull request
  # that changes one is graded by the old copy there. This job runs the new
  # copy the way that job does, so a changed grader still shows red or green
  # on the pull request that changes it. It is not a required context, and
  # `HPO_JOB_GRADES: nothing` tells `codeowners_gap.py` it grades nothing. Its
  # red blocks nothing by itself: `pr-contract` makes the body answer every
  # red check run under `## Red checks`, and the fix review returns `blocked`
  # on one the body left unanswered. Each step runs only when the three-dot
  # diff touches its grader.
  # `nightly_status.py` is not here: it needs `actions: read`, and `fast`
  # already drives the pull request's copy through `tests/entities.py`.
  #
  # THE GOVERNANCE ARM (#1757, the #1721 RCA). `policy-docs` restores every
  # `.claude/workflows/*.mjs` from the base, so a changed governance grader
  # first ran under the Actions GITHUB_TOKEN on the push to main: #1715's
  # comparator read a ruleset field that token cannot see, and main was red
  # for 2 h 21 m. A seat's local run cannot see it either, since it reads as
  # the seat. So when the diff touches what `policy-docs` restores, the pull
  # request's own `policy_lint.mjs` and `field_coverage.mjs` run here with
  # this job's read-only token. `tests/entities.py` derives the token-bearing
  # pinned graders from the workflows and refuses one with neither a step
  # here nor a recorded reason.
  graders-head-copy:
    needs: [coverage]
    # R9-CI-SKIP: the coverage-json download below is gated the same way, so
    # a skipped `coverage` (no fresh artifact, its download step stands down)
    # cannot redden this job on a missing artifact.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HPO_JOB_GRADES: nothing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # policy_lint.mjs's citation resolvers ask git about cited tags.
          fetch-tags: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Name the pinned graders this pull request changes
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python tests/closure.py changed --base "$BASE" --head "$HEAD" > "$RUNNER_TEMP/changed.txt"
          for g in coverage_ratchet delivery_status; do
            if grep -qx "tests/$g.py" "$RUNNER_TEMP/changed.txt"; then
              echo "$g=true" >> "$GITHUB_OUTPUT"
              echo "tests/$g.py changed: its own copy runs below"
            else
              echo "$g=false" >> "$GITHUB_OUTPUT"
            fi
          done
          # The pathspec governance.yml's `policy-docs` restores from the base.
          if git diff --quiet "$BASE"..."$HEAD" -- \
              '.claude/workflows/*.mjs' \
              '.claude/workflows/*.py' \
              '.claude/workflows/vendor' \
              'tools/audit/*.sh' \
              'tools/audit/record-predicate' \
              'tools/audit/round6/D11/fix/codeowners_gap.py' \
              'tools/policy/*.mjs' \
              'tools/policy/*.py' \
              'tools/pr/*.py' \
              'tools/policy/vendor' \
              'tools/pr/*.sh' \
              'tools/seat/*.sh' \
              'tools/coverage/*.sh' \
              'dev/audit/*.sh' \
              'tools/policy/record-predicate' \
              'dev/audit/rounds/round6/D11/fix/codeowners_gap.py' \
              'tests/layout.py'; then
            echo "governance=false" >> "$GITHUB_OUTPUT"
          else
            echo "governance=true" >> "$GITHUB_OUTPUT"
            echo "a pinned governance grader changed: its own copy runs below"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: >-
          steps.changed.outputs.coverage_ratchet == 'true'
          && needs.coverage.result != 'skipped'
        with:
          name: coverage-json
          path: ${{ runner.temp }}/coverage

      # R9-CI-SKIP: the two steps above this line and the one below stand
      # down together when `coverage` skipped (no fresh JSON exists); every
      # other grader below runs regardless, so a skipped lane never reddens
      # its own downstream graders.
      - name: The pull request's coverage_ratchet.py, as `coverage-ratchet` runs it
        if: >-
          steps.changed.outputs.coverage_ratchet == 'true'
          && needs.coverage.result != 'skipped'
        run: |
          python3 tests/coverage_ratchet.py \
            --coverage "$RUNNER_TEMP/coverage/coverage.json"

      - name: The pull request's delivery_status.py, as `delivery-status` runs it
        if: always() && steps.changed.outputs.delivery_status == 'true'
        run: |
          git fetch --no-tags --quiet origin main
          # A non-zero exit shared with the base copy on this tree is that
          # copy's own. Exit with the pull request's code only when the two
          # differ, and exit 1 when this copy prints OVERDUE and the base
          # copy does not: both of those exits are 1, so the codes alone
          # cannot separate them.
          head_copy="$RUNNER_TEMP/delivery_status.head.py"
          cp tests/delivery_status.py "$head_copy"
          git show origin/main:tests/delivery_status.py > tests/delivery_status.py
          set +e
          python tests/delivery_status.py --check > "$RUNNER_TEMP/delivery_status.base.out"
          base_rc=$?
          set -e
          cp "$head_copy" tests/delivery_status.py
          set +e
          python tests/delivery_status.py --check > "$RUNNER_TEMP/delivery_status.head.out"
          head_rc=$?
          set -e
          cat "$RUNNER_TEMP/delivery_status.base.out"
          echo "----- head copy -----"
          cat "$RUNNER_TEMP/delivery_status.head.out"
          echo "delivery_status --check head_rc=$head_rc base_rc=$base_rc"
          head_overdue=0
          base_overdue=0
          if grep -q '^DELIVERY STATUS OVERDUE' "$RUNNER_TEMP/delivery_status.head.out"; then
            head_overdue=1
          fi
          if grep -q '^DELIVERY STATUS OVERDUE' "$RUNNER_TEMP/delivery_status.base.out"; then
            base_overdue=1
          fi
          if [ "$head_overdue" -eq 1 ] && [ "$base_overdue" -eq 0 ]; then
            exit 1
          fi
          if [ "$head_rc" -ne "$base_rc" ]; then
            exit "$head_rc"
          fi
          exit 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && steps.changed.outputs.governance == 'true' }}
        with:
          node-version: "22"

      - name: The pull request's policy_lint.mjs, under the Actions token
        if: ${{ !cancelled() && steps.changed.outputs.governance == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/policy/policy_lint.mjs

      - name: The pull request's field_coverage.mjs, under the Actions token
        if: ${{ !cancelled() && steps.changed.outputs.governance == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/policy/field_coverage.mjs

  # The closures the scoped PR gate trusts, re-derived from real runs and
  # compared against what is committed. A closure that MISSES a file a run
  # really touched is the dangerous direction -- that is what would make the
  # gate skip a script it should have run -- and it fails here. A closure
  # that lists more than a run touched only costs time, and is reported.
  #
  # WHEN it runs on a pull request is decided here, by the same table it
  # checks. The first version of this job asked "does the pull request ADD a
  # file under custom_components/?" (#332), which is a different question from
  # the one that matters: a change to what a test READS was checked only after
  # it merged. Five incidents -- #214, #320, #332, #340, #349 -- each one a
  # green pull request, a red main, and a second pull request to repair it.
  # #353 is the sharpest: it exists solely to fix a closure error, and its own
  # `closures` check says `skipping`.
  #
  # `closure.py affected` answers the right question instead, in three cases:
  # skip (every changed file is INERT), full (a gate file, or a file in no
  # recorded closure), scoped (re-derive only the closures the diff
  # intersects, ~40 s an entry against 30-55 minutes for the table).
  #
  # It also runs on `workflow_dispatch` (a1 of the round-9 closures
  # pre-study): the merge train's batch proof pushes a `batch/<tag>-<n>`
  # branch and dispatches this workflow on it, and a dispatch has no pull
  # request base/head -- so before this, `SCOPE_CASE` was empty and the
  # `closures` job below ran the FULL arm (~50 minutes) on every batch, for
  # a diff whose entries had each already been scope-checked on their own
  # pull requests. The dispatch arm derives the same three-dot diff, against
  # `origin/main`, that a pull request derives against its base, and FAILS
  # CLOSED: no origin/main, no merge base, an unreadable or EMPTY diff, or a
  # failed `affected` all yield an empty file list, and `affected` answers
  # `full` ("no changed files could be determined") for exactly that. A
  # push to main and the nightly are NOT here on purpose: their full arm is
  # rule 1's detector and stays untouched.
  # R9-CI-SKIP: the record half of the lane-skip lever. `closure-scope`
  # decides whether a heavy lane may skip a rerun a recorded green run
  # already answers; this job is what records those greens -- and ONLY after
  # the lane actually ran and passed. It runs on the same events the skip arm
  # covers, writes one tiny JSON per lane into the cache key that job's
  # restore reads, and does nothing else: no checkout (the state is
  # closure-scope's output, computed against the run's pinned GITHUB_SHA),
  # no token, no gate script. A lane that skipped needs no new record -- the
  # entry its skip stood on is the entry this job would write, byte-equal,
  # and actions/cache keys are immutable, so `continue-on-error` absorbs the
  # reserve refusal a legitimate rerun (a `no-skip` dispatch) would raise.
  # ci.yml's cancel-superseded cancels this run on a newer push, so a
  # proof can never be recorded against a diff the lanes never judged.
  lane-proofs:
    needs: [closure-scope, fast, arch-instrument, coverage, browser]
    if: >-
      !cancelled() && (
        github.event_name == 'pull_request'
        || (github.event_name == 'workflow_dispatch'
            && inputs.recheck == 'true'
            && inputs.no-skip != 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # fast's proof stands in for arch-instrument too, which stands down on
      # fast's decision (U5b), so it is recorded only when both ran green.
      - name: Record fast's green run at this base and diff
        if: >-
          needs.fast.result == 'success'
          && needs.arch-instrument.result == 'success'
          && needs.closure-scope.outputs.fast_skip != 'skip'
        run: |
          mkdir -p "$RUNNER_TEMP/lane-proof-fast"
          # A quoted heredoc, never an interpolated double-quoted string: the
          # state is JSON and carries its own double quotes, which would
          # close the shell's quoting mid-value.
          cat > "$RUNNER_TEMP/lane-proof-fast/state.json" <<'STATE_EOF'
          ${{ needs.closure-scope.outputs.state_fast }}
          STATE_EOF
          cat "$RUNNER_TEMP/lane-proof-fast/state.json"
      - name: Save fast's proof
        if: >-
          needs.fast.result == 'success'
          && needs.arch-instrument.result == 'success'
          && needs.closure-scope.outputs.fast_skip != 'skip'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lane-proof-fast
          key: lane-proof-fast-${{ needs.closure-scope.outputs.ls_branch }}-${{ needs.closure-scope.outputs.ls_diff }}-${{ needs.closure-scope.outputs.ls_base }}

      - name: Record coverage's green run at this base and diff
        if: >-
          needs.coverage.result == 'success'
          && needs.closure-scope.outputs.coverage_skip != 'skip'
        run: |
          mkdir -p "$RUNNER_TEMP/lane-proof-coverage"
          # A quoted heredoc, never an interpolated double-quoted string: the
          # state is JSON and carries its own double quotes, which would
          # close the shell's quoting mid-value.
          cat > "$RUNNER_TEMP/lane-proof-coverage/state.json" <<'STATE_EOF'
          ${{ needs.closure-scope.outputs.state_coverage }}
          STATE_EOF
          cat "$RUNNER_TEMP/lane-proof-coverage/state.json"
      - name: Save coverage's proof
        if: >-
          needs.coverage.result == 'success'
          && needs.closure-scope.outputs.coverage_skip != 'skip'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lane-proof-coverage
          key: lane-proof-coverage-${{ needs.closure-scope.outputs.ls_branch }}-${{ needs.closure-scope.outputs.ls_diff }}-${{ needs.closure-scope.outputs.ls_base }}

      - name: Record browser's green run at this base and diff
        if: >-
          needs.browser.result == 'success'
          && needs.closure-scope.outputs.browser_skip != 'skip'
        run: |
          mkdir -p "$RUNNER_TEMP/lane-proof-browser"
          # A quoted heredoc, never an interpolated double-quoted string: the
          # state is JSON and carries its own double quotes, which would
          # close the shell's quoting mid-value.
          cat > "$RUNNER_TEMP/lane-proof-browser/state.json" <<'STATE_EOF'
          ${{ needs.closure-scope.outputs.state_browser }}
          STATE_EOF
          cat "$RUNNER_TEMP/lane-proof-browser/state.json"
      - name: Save browser's proof
        if: >-
          needs.browser.result == 'success'
          && needs.closure-scope.outputs.browser_skip != 'skip'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lane-proof-browser
          key: lane-proof-browser-${{ needs.closure-scope.outputs.ls_branch }}-${{ needs.closure-scope.outputs.ls_diff }}-${{ needs.closure-scope.outputs.ls_base }}

  closure-scope:
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'merge_group'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      case: ${{ steps.decide.outputs.case }}
      scripts: ${{ steps.decide.outputs.scripts }}
      nightly_ha: ${{ steps.decide.outputs.nightly_ha }}
      # R9-CI-SKIP: the heavy lanes' skip decisions and the state a green
      # run of each would record. Empty on every event the skip arm does not
      # cover (push above all), which every lane's `if:` reads as RUN.
      fast_skip: ${{ steps.skipfast.outputs.decision }}
      coverage_skip: ${{ steps.skipcoverage.outputs.decision }}
      browser_skip: ${{ steps.skipbrowser.outputs.decision }}
      # O17: typing records no proof, so only lane_skip's Level 0 (a diff
      # of rosters and delivery rows alone) can skip it.
      typing_skip: ${{ steps.skiptyping.outputs.decision }}
      ls_branch: ${{ steps.laneskip.outputs.branch }}
      ls_base: ${{ steps.laneskip.outputs.base }}
      ls_diff: ${{ steps.laneskip.outputs.diff }}
      state_fast: ${{ steps.skipfast.outputs.state }}
      state_coverage: ${{ steps.skipcoverage.outputs.state }}
      state_browser: ${{ steps.skipbrowser.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # R9-CI-SKIP, step 1 of 3: identify what a heavy lane would be judged
      # on -- the three-dot diff CONTENT against the merge base (the same ref
      # `fast` resolves as GOLDEN_REF), and the merge-base commit itself.
      # Keyed on the commit, not its tree: two commits can share a tree while
      # the history the suite's checks read (`entities.py` reads origin/main)
      # moved, and Level 1's byte-identical argument must not ride on that.
      # Pull requests and the recheck dispatch only -- the events whose
      # re-runs a recorded green can stand in for. A push to main (CLAUDE.md
      # rule 1: forced full), the merge queue, the nightly and every other
      # dispatch leave these outputs unset and every lane runs.
      - name: Identify the diff and base the heavy lanes would judge
        id: laneskip
        if: >-
          github.event_name == 'pull_request'
          || (github.event_name == 'workflow_dispatch'
              && inputs.recheck == 'true'
              && inputs.no-skip != 'true')
        run: |
          git fetch --no-tags origin main
          MB=$(git merge-base origin/main HEAD) || {
            echo "no merge base against origin/main; lanes run"
            exit 0
          }
          BRANCH="${{ github.head_ref || github.ref_name }}"
          # GITHUB_SHA, not HEAD: the run's pinned commit -- refs/pull/N/merge
          # on a pull request, the branch head on a dispatch -- so a branch
          # that moves under this run cannot key a proof off a diff the lanes
          # never judged.
          DIFF=$(git diff "$MB"..."$GITHUB_SHA" | git hash-object --stdin)
          {
            echo "branch=$BRANCH"
            echo "base=$MB"
            echo "diff=$DIFF"
          } >> "$GITHUB_OUTPUT"

      # Step 2 of 3: restore the last green proof for each lane. The exact
      # key is (lane, branch, diff, base): a hit means the recorded green ran
      # at exactly this base for exactly this diff. `restore-keys` reaches
      # the newest entry for the same (lane, branch, diff) at an OLDER base,
      # which is what Level 2 judges. A miss -- eviction, a fork pull request
      # whose cache scope cannot see this branch, a first run -- is a RUN:
      # the mechanism can only ever fail toward the expensive answer.
      - name: Restore fast's last green proof
        if: steps.laneskip.outputs.diff != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lane-proof-fast
          key: lane-proof-fast-${{ steps.laneskip.outputs.branch }}-${{ steps.laneskip.outputs.diff }}-${{ steps.laneskip.outputs.base }}
          restore-keys: lane-proof-fast-${{ steps.laneskip.outputs.branch }}-${{ steps.laneskip.outputs.diff }}-
      - name: Restore coverage's last green proof
        if: steps.laneskip.outputs.diff != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lane-proof-coverage
          key: lane-proof-coverage-${{ steps.laneskip.outputs.branch }}-${{ steps.laneskip.outputs.diff }}-${{ steps.laneskip.outputs.base }}
          restore-keys: lane-proof-coverage-${{ steps.laneskip.outputs.branch }}-${{ steps.laneskip.outputs.diff }}-
      - name: Restore browser's last green proof
        if: steps.laneskip.outputs.diff != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lane-proof-browser
          key: lane-proof-browser-${{ steps.laneskip.outputs.branch }}-${{ steps.laneskip.outputs.diff }}-${{ steps.laneskip.outputs.base }}
          restore-keys: lane-proof-browser-${{ steps.laneskip.outputs.branch }}-${{ steps.laneskip.outputs.diff }}-

      # Step 3 of 3: the decision itself, in tests/lane_skip.py -- the one
      # instrument, self-tested in governance's instrument-self-tests and
      # pinned by tests/entities.py, never workflow-expression logic that no
      # test can drive. The state file it also emits is what a GREEN run of
      # the lane would record at exactly this base and diff; the `lane-proofs`
      # job saves it, and nothing here ever does -- the lanes have not run.
      - name: Decide whether fast may skip
        id: skipfast
        if: steps.laneskip.outputs.diff != ''
        run: |
          python tests/lane_skip.py decide --lane fast \
            --diff-ref "${{ steps.laneskip.outputs.base }}" \
            --state-file "$RUNNER_TEMP/lane-proof-fast/state.json" \
            --workdir "$RUNNER_TEMP/lane-skip/fast"
          echo "decision=$(cat "$RUNNER_TEMP/lane-skip/fast/decision")" >> "$GITHUB_OUTPUT"
          echo "state=$(cat "$RUNNER_TEMP/lane-skip/fast/state.json")" >> "$GITHUB_OUTPUT"
      - name: Decide whether coverage may skip
        id: skipcoverage
        if: steps.laneskip.outputs.diff != ''
        run: |
          python tests/lane_skip.py decide --lane coverage \
            --diff-ref "${{ steps.laneskip.outputs.base }}" \
            --state-file "$RUNNER_TEMP/lane-proof-coverage/state.json" \
            --workdir "$RUNNER_TEMP/lane-skip/coverage"
          echo "decision=$(cat "$RUNNER_TEMP/lane-skip/coverage/decision")" >> "$GITHUB_OUTPUT"
          echo "state=$(cat "$RUNNER_TEMP/lane-skip/coverage/state.json")" >> "$GITHUB_OUTPUT"
      - name: Decide whether browser may skip
        id: skipbrowser
        if: steps.laneskip.outputs.diff != ''
        run: |
          python tests/lane_skip.py decide --lane browser \
            --diff-ref "${{ steps.laneskip.outputs.base }}" \
            --state-file "$RUNNER_TEMP/lane-proof-browser/state.json" \
            --workdir "$RUNNER_TEMP/lane-skip/browser"
          echo "decision=$(cat "$RUNNER_TEMP/lane-skip/browser/decision")" >> "$GITHUB_OUTPUT"
          echo "state=$(cat "$RUNNER_TEMP/lane-skip/browser/state.json")" >> "$GITHUB_OUTPUT"

      - name: Decide whether typing may skip
        id: skiptyping
        if: steps.laneskip.outputs.diff != ''
        run: |
          python tests/lane_skip.py decide --lane typing \
            --diff-ref "${{ steps.laneskip.outputs.base }}" \
            --workdir "$RUNNER_TEMP/lane-skip/typing"
          echo "decision=$(cat "$RUNNER_TEMP/lane-skip/typing/decision")" >> "$GITHUB_OUTPUT"

      - id: decide
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          HEAD="${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}"
          # --files-from, not `--files $(...)`: a path list off the command
          # line is split on whitespace and capped by ARG_MAX.
          # Three dots, not two. base.sha is the base BRANCH TIP at the time
          # the event fired, not the merge base, so a two-dot diff charges this
          # pull request with every file anyone else merged while it was open.
          # Measured on this PR: base.sha was the v6.3.9 stamp, and the two-dot
          # form attributed VERSION, manifest.json, RELEASE_NOTES.md and both
          # claim files to it -- 11 files against the real 6. That only ever
          # over-scopes, so it is safe, but it defeats the `skip` case this job
          # exists to keep cheap, and main moved four times today while a single
          # PR was open. fetch-depth: 0 above is what makes ... resolvable.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # The dispatch arm: derive the diff against origin.main, with the
            # same fail-closed rule the fast arm below states -- a diff this
            # job cannot derive is a diff the full arm must judge. Every
            # failure path lands on an EMPTY changed.txt, and `affected`
            # answers `full` for an empty list. The extra fetch keeps
            # origin/main present even if checkout's refspec ever narrows;
            # its failure is swallowed into the empty list too.
            git fetch --quiet origin main || true
            MAIN_TIP=$(git rev-parse --verify --quiet refs/remotes/origin/main) || MAIN_TIP=""
            if [ -n "$MAIN_TIP" ] && MB=$(git merge-base "$MAIN_TIP" HEAD); then
              python tests/closure.py changed --base "$MB" --head "$HEAD" > "$RUNNER_TEMP/changed.txt" 2>/dev/null || : > "$RUNNER_TEMP/changed.txt"
            else
              : > "$RUNNER_TEMP/changed.txt"
            fi
            echo "dispatch diff (three-dot $MAIN_TIP...HEAD):"
            cat "$RUNNER_TEMP/changed.txt"
            # The nightly-ha lane is a pull-request decision: on a dispatch it
            # keeps its pre-a1 behaviour (the job stays skipped) rather than
            # widening this change beyond the closures arm it is for.
            echo "nightly_ha=false" >> "$GITHUB_OUTPUT"
          else
            python tests/closure.py changed --base "$BASE" --head "$HEAD" > "$RUNNER_TEMP/changed.txt"
            # `nightly-ha` on this pull request: what tests/nightly_ha.py reads
            # outside custom_components/, MEASURED by `closure.py record` over a
            # real run of the lane (run 37764931838, both images, the same 37
            # paths), plus the requirements file its job installs.
            # tests/entities.py re-measures what `_stage` mounts into the
            # container and refuses a path this list does not cover.
            if git diff --quiet "$BASE"..."$HEAD" -- \
                tests/nightly_ha.py \
                tests/ha_contract.py \
                tests/harness.py \
                tests/hastub \
                tests/golden/config_flow.json \
                tests/requirements-nightly-ha.txt; then
              echo "nightly_ha=false" >> "$GITHUB_OUTPUT"
            else
              echo "nightly_ha=true" >> "$GITHUB_OUTPUT"
              echo "the diff touches what nightly-ha's driver reads: nightly-ha runs"
            fi
          fi
          python tests/closure.py affected \
            --files-from "$RUNNER_TEMP/changed.txt" \
            --workdir "$RUNNER_TEMP/affected"
          {
            echo "case=$(cat "$RUNNER_TEMP/affected/affected.case")"
            echo "scripts<<CLOSURE_SCRIPTS_EOF"
            cat "$RUNNER_TEMP/affected/affected.scripts"
            echo "CLOSURE_SCRIPTS_EOF"
          } >> "$GITHUB_OUTPUT"

  closures:
    # No `coverage` need (R10-CI-LAYOUT PR 1, W1): the round-9 C1 composition
    # it carried is gone at its source, so every in-scope script records bare
    # here and this job starts when `closure-scope` ends.
    needs: [closure-scope]
    # `!cancelled()` is load-bearing, not decoration. `closure-scope` only runs
    # on a pull request, so on a push to main it is SKIPPED -- and a job whose
    # `needs` was skipped is skipped too, whatever its own `if` says. Without
    # it (`always()` also works, but keeps a superseded run's job running and
    # the newer run pending in the group) this line would switch off the check on
    # main, which is the one place it has always run: a far worse bug than the
    # one it is here to prevent.
    #
    # THE DOCS-ONLY FAST LANE (#201 item 8, ledger finding (c)). This job no
    # longer has a skip case at all, so its `if` is bare `!cancelled()`: the only
    # diff that ever skipped here is the one `closure-scope` derives as
    # `skip` -- every changed file INERT and absent from every recorded
    # closure -- which is exactly the diff the bot's ci/delivery-ledger cycle
    # pull requests carry. `closures` is one of the `main-protect` ruleset's
    # required contexts, which SUCCESS satisfies without doubt. #1022, #1025
    # and #1027 merged `--admin`, but their heads also lacked the required
    # `hassfest`/`validate-hacs` (#1101): no proof a skip blocks. The ruleset
    # carve-out was refused (not expressible without weakening everyone), so
    # the lane reports SUCCESS instead: on the `skip` case the job runs the
    # cheap arm below -- it re-derives the case itself, from the same
    # `tests/closure.py affected` the gate's own scoping uses, and fails
    # unless the answer is `skip` again -- while every code-touching diff
    # takes the full arm, whose steps are unchanged. The old condition's
    # fail-closed reading survives the move: an empty case (a failed
    # `closure-scope`), an unknown event, the nightly and every push all
    # take the full arm, exactly as they did when `!= 'skip'` was the last
    # line of the `if`. A `workflow_dispatch` (a1) takes what its own
    # re-derived case says, and its derivation fails closed to `full`.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # actions: read for the C2 consume step's artifact lookup below (the
    # batch proof's recordings are found BY NAME through the API); contents
    # stays at the workflow floor.
    permissions:
      contents: read
      actions: read
    # 'true' exactly when this run's diff the gate's own closure scoping
    # derives as touching nothing measured. That is `closure-scope`'s output,
    # computed by `tests/closure.py affected` -- the same rule
    # `GATE_SCOPE=auto` uses in `fast` -- and NOT a paths filter of this
    # workflow's own: a second rule for "docs-only" would drift from the
    # gate's the first time either learned a new inert prefix. The dispatch
    # arm (a1) is included: a batch whose whole diff is inert answers `skip`
    # here exactly as a docs-only pull request does.
    env:
      DOCS_ONLY_FAST: ${{ (github.event_name == 'pull_request'
                           || github.event_name == 'merge_group'
                           || github.event_name == 'workflow_dispatch')
                         && needs.closure-scope.outputs.case == 'skip' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Single-version deliberately, unlike `fast` (#514). tests/closures.json
      # is ONE committed artifact and this job uploads ONE `closure-recordings`
      # for `closures-autofix` to merge; a second interpreter would upload a
      # second artifact under the same name and hand autofix two recordings of
      # the same script with no rule for choosing between them. The closure
      # table records which files a script reads, which is a property of the
      # code, not of the interpreter running it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Everything from here to the under-approximation check is the full arm
      # and is gated off the docs-only fast lane: the fast arm derives its
      # answer with stdlib-only `tests/closure.py` calls and needs neither
      # node, the pinned dependencies, nor strace. On any diff the gate can
      # scope -- full or scoped -- every one of these steps runs exactly as it
      # did before the fast lane existed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.DOCS_ONLY_FAST != 'true'
        with:
          node-version: "22"

      - name: Install pinned test dependencies
        if: env.DOCS_ONLY_FAST != 'true'
        run: >-
          pip install --require-hashes
          --build-constraint tests/requirements-build.txt
          -r tests/requirements-ci.txt

      - name: Install strace
        # node has no audit hook, so tests/card.mjs is recorded by tracing
        # its opens instead.
        if: env.DOCS_ONLY_FAST != 'true'
        run: sudo apt-get update && sudo apt-get install -y strace

      # THE FAST ARM. `closure-scope` already derived `skip` for this diff;
      # this step re-derives it HERE, from the same table and the same
      # three-dot diff, so the job's success is its own measurement rather
      # than a parrot of an upstream job's output -- and it FAILS CLOSED if
      # the two derivations ever disagree: a diff this job cannot derive as
      # `skip` is a diff the full arm must judge, on the next event if not
      # this one. Seconds, stdlib only, and it is the whole difference
      # between this check reporting `success` and reporting `skipped` on a
      # docs-only pull request.
      - name: Fast arm -- re-derive the skip case and refuse anything else
        if: env.DOCS_ONLY_FAST == 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # The same three-dot, --files-from derivation closure-scope ran:
          # base.sha is the base branch tip, not the merge base, so two dots
          # would charge this job with files merged elsewhere while it was
          # open. A disagreement here is not retried or waved through; the
          # step fails and the full arm runs on the next event.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # The dispatch arm has no pull_request shas: the same
            # fail-closed diff against origin/main closure-scope derives,
            # restated here so this arm's success is its own measurement
            # exactly as it is on a pull request.
            git fetch --quiet origin main || true
            MAIN_TIP=$(git rev-parse --verify --quiet refs/remotes/origin/main) || MAIN_TIP=""
            if [ -n "$MAIN_TIP" ] && MB=$(git merge-base "$MAIN_TIP" HEAD); then
              python tests/closure.py changed --base "$MB" --head "$HEAD" > "$RUNNER_TEMP/changed.txt" 2>/dev/null || : > "$RUNNER_TEMP/changed.txt"
            else
              : > "$RUNNER_TEMP/changed.txt"
            fi
            echo "dispatch diff (three-dot $MAIN_TIP...HEAD):"
          else
            BASE="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
            HEAD="${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}"
            python tests/closure.py changed --base "$BASE" --head "$HEAD" > "$RUNNER_TEMP/changed.txt"
          fi
          cat "$RUNNER_TEMP/changed.txt"
          python tests/closure.py affected \
            --files-from "$RUNNER_TEMP/changed.txt" \
            --workdir "$RUNNER_TEMP/affected"
          CASE=$(cat "$RUNNER_TEMP/affected/affected.case")
          echo "re-derived case: $CASE (closure-scope said: ${{ needs.closure-scope.outputs.case }})"
          if [ "$CASE" != "skip" ]; then
            echo "::error::closure-scope derived 'skip' but this job's own"
            echo "re-derivation says '$CASE'. The fast arm may not pass a diff"
            echo "it cannot scope; failing closed so the full arm judges it."
            exit 1
          fi

      # C2 (round-9 heavy-script consolidation): a batch's proof run -- the
      # workflow_dispatch this workflow's merge train fires on the batch
      # branch -- re-records every closure on tree P_n and, since this
      # branch's change, uploads those recordings under a name carrying that
      # tree hash. The batch's LAST merge produces this push run on a
      # byte-identical tree, so this step can consume them instead of paying
      # the ~28-55 min re-record again. Every refusal here is a fallback to
      # the full arm below: no artifact for this tree, a failed download, a
      # manifest naming another tree, an empty or unhealthy recording --
      # `closure.py proof-consume` is the authority and it fails closed.
      # The under-approximation check still runs, on the consumed
      # recordings, unchanged. The fast and coverage arms of this push run
      # are never skipped: they are the first verdict/line-set grades of
      # this tree and the coverage base's producer.
      - name: Consume the batch proof's recordings when the tree is byte-identical
        id: proof_consume
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && env.DOCS_ONLY_FAST != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "this push run's tree: $TREE"
          echo "PROOF_CONSUMED=false" >> "$GITHUB_ENV"
          PROOF=$(mktemp -d)
          # Found BY NAME, not by run: the name carries the tree hash, so a
          # recording set made on any other tree cannot be selected here.
          ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=closure-recordings-tree-$TREE" \
                 --jq '[.artifacts[] | select(.expired == false)]
                       | sort_by(.created_at) | .[-1].id // empty' || true)
          if [ -z "$ID" ]; then
            echo "no proof recordings for tree $TREE; re-recording fresh (fail closed)"
            exit 0
          fi
          echo "found proof recordings artifact $ID for tree $TREE"
          if ! gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > "$PROOF/proof.zip" \
             || ! unzip -oq "$PROOF/proof.zip" -d "$PROOF/rec"; then
            echo "could not download or unpack the artifact; re-recording fresh (fail closed)"
            exit 0
          fi
          # upload-artifact zips the directory's contents; tolerate a single
          # wrapping directory rather than assume it.
          if [ ! -f "$PROOF/rec/tree.txt" ] && [ -f "$PROOF/rec/closures/tree.txt" ]; then
            mv "$PROOF/rec/closures"/* "$PROOF/rec/"
          fi
          if python tests/closure.py proof-consume --expect-tree "$TREE" --in-dir "$PROOF/rec"; then
            mkdir -p "$RUNNER_TEMP/closures"
            cp "$PROOF"/rec/*.json "$RUNNER_TEMP/closures/"
            echo "PROOF_CONSUMED=true" >> "$GITHUB_ENV"
          else
            echo "proof-consume refused; re-recording fresh (fail closed)"
          fi

      - name: Re-record the closures
        # Full arm only: the fast arm has no recording to make. Unchanged
        # from before the fast lane on every diff that reaches it, except
        # that a consumed proof (C2) already put the recordings on disk.
        if: >-
          env.DOCS_ONLY_FAST != 'true' && env.PROOF_CONSUMED != 'true'
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          # Through the environment, not string-interpolated into the script:
          # the value is a job output, and `${{ }}` inside `run:` is textual
          # substitution.
          SCOPE_CASE: ${{ needs.closure-scope.outputs.case }}
          SCOPE_SCRIPTS: ${{ needs.closure-scope.outputs.scripts }}
          # CI-cost metrics (tests/ci_ratchet.py): derive_closures.sh appends
          # one line per script it records, classed by the same case
          # closure-scope derived.
          HPO_CI_METRICS: ${{ runner.temp }}/ci-metrics-closures.tsv
          HPO_CI_SCOPE: ${{ needs.closure-scope.outputs.case == 'scoped' && 'scoped' || 'full' }}
        run: |
          REF=$(git rev-parse --verify --quiet 'HEAD^1^{commit}') || REF=HEAD
          # --record-only, on both paths: merging here would overwrite the
          # committed tests/closures.json with what this run just measured, and
          # the check below would then compare the file against itself.
          if [ "$SCOPE_CASE" = "scoped" ]; then
            printf '%s\n' "$SCOPE_SCRIPTS" > "$RUNNER_TEMP/rederive.txt"
            echo "Scoped re-derive; every other closure is left as committed:"
            cat "$RUNNER_TEMP/rederive.txt"
            # One --scripts-from lane run, not a --single per script: a
            # serial loop pays the SUM of the selected recordings (51m18s
            # over 24 scripts on #2071's job) where a lane-balanced run pays
            # the MAX of its lanes. The runner shards the list itself
            # (closure.py lane-plan: the producer/consumer and driver/child
            # orderings kept inside one lane) and bounds itself to three
            # lanes on this runner, so nothing is passed in here. The
            # recordings are the same recordings the loop took (R9-F10.15).
            GOLDEN_REF="$REF" ./tests/derive_closures.sh \
              --scripts-from "$RUNNER_TEMP/rederive.txt" \
              --out-dir "$RUNNER_TEMP/closures" --record-only
          else
            GOLDEN_REF="$REF" ./tests/derive_closures.sh \
              --out-dir "$RUNNER_TEMP/closures" --record-only
          fi

      - name: Fail if tests/closures.json under-approximates
        # Full arm only, with the recordings the re-record step above made.
        if: env.DOCS_ONLY_FAST != 'true'
        env:
          PYTHONPATH: tests/hastub
          SCOPE_CASE: ${{ needs.closure-scope.outputs.case }}
        run: |
          # --partial drops one check and one only: "a selectable script with
          # no recording at all", which a scoped re-derive fails by
          # construction. The under-approximation comparison -- the thing this
          # job exists for -- is identical on both paths. The output goes to
          # check.txt in the uploaded recordings: closures-autofix runs the
          # base's closure.py, and reddens where this one printed UNDER-SCOPED
          # and that one did not (#1846).
          set -o pipefail
          if [ "$SCOPE_CASE" = "scoped" ]; then
            python -u tests/closure.py check --in-dir "$RUNNER_TEMP/closures" --partial 2>&1 | tee "$RUNNER_TEMP/closures/check.txt"
          else
            python -u tests/closure.py check --in-dir "$RUNNER_TEMP/closures" 2>&1 | tee "$RUNNER_TEMP/closures/check.txt"
          fi

      - name: Fail if a test file re-implements a production symbol
        # The rule tests/README.md states, enforced (issue #91): a test
        # defining its own copy of a production constant or helper asserts
        # against its own arithmetic, and its mutation proofs prove the
        # copy. Cheap by design -- a name collision -- but the accident
        # this exists for was a name collision. Runs on BOTH arms: it is a
        # pure AST scan with no dependencies, so the fast arm carries it
        # and the full arm keeps it.
        env:
          PYTHONPATH: tests/hastub
        run: python tests/closure.py no-copies

      # C2's producer side: the proof run (workflow_dispatch on a batch
      # branch, fired by the merge train) writes its recordings' tree hash
      # beside them, so the artifact's NAME and its manifest agree -- one
      # upload step writes both, which is what makes a mislabel require a
      # bug in this single step rather than a race.
      - name: Write the recordings' tree hash
        if: >-
          always() && github.event_name == 'workflow_dispatch'
          && env.DOCS_ONLY_FAST != 'true'
        run: |
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "CLOSURES_TREE=$TREE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/closures"
          printf '%s\n' "$TREE" > "$RUNNER_TEMP/closures/tree.txt"

      - name: Upload closure recordings
        # Autofix needs the recordings even when the check above failed.
        # Full arm only: the fast arm makes no recordings, and a failure it
        # could report is one no recording exists to repair. A pull request
        # uploads under the name `closures-autofix` merges; a dispatch (the
        # batch proof) uploads tree-named, for the C2 consume step.
        if: >-
          always() && (github.event_name == 'pull_request'
                       || github.event_name == 'workflow_dispatch')
          && env.DOCS_ONLY_FAST != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && 'closure-recordings' || format('closure-recordings-tree-{0}', env.CLOSURES_TREE) }}
          path: ${{ runner.temp }}/closures
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload the closures lane's CI metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-metrics-closures
          path: ${{ runner.temp }}/ci-metrics-closures.tsv
          if-no-files-found: ignore
          retention-days: 7

  # THE CI RATCHET (round-9, tvofi's request). One-way budgets over CI cost
  # and code health, graded once per merge: this job runs on the push the
  # merge makes, reads the ci-metrics artifacts the run's own lanes emitted
  # plus the recent window's (a ratchet whose input is typed by a human is
  # not a ratchet), and refuses any metric that grew. Never passes --record:
  # the always-green shape (the same null control the coverage ratchet's
  # wiring carries). Not a required context: the merge already happened; the
  # red is a debt a follow-up pays or a deliberate --record re-records.
  ci-ratchet:
    needs: [fast, coverage, closures]
    if: >-
      !cancelled() && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # The window fetch's decisions -- the list call's retry, the refusal of
      # an empty or partial body as a failed fetch (never an empty window),
      # and the skip of an artifact that expired before its zip download --
      # are in tests/ci_ratchet.py, not in a heredoc, so --self-test drives
      # them with no network. The step is here, in the job that runs them,
      # and tests/entities.py also pins it: a self-test no run line names is
      # one the tree never runs (tools/audit/seat/selftest_wiring.py's rule).
      #
      # Why the refusal moved out: on 2026-10-20 the inline
      # `gh api … --jq … > window.json || true` returned a body gh's jq
      # engine could not parse, `|| true` swallowed the exit code, and the
      # next step died on `json.load` of a 0-byte file with a traceback that
      # named nothing (CI job 118878630676).
      - name: Self-test the window fetch and parse
        run: python3 -I tests/ci_ratchet.py --self-test

      - name: Gather this run's and the recent window's metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/metrics"; mkdir -p "$M"
          # This run's three lanes, by name, from this run.
          for lane in fast coverage closures; do
            gh run download "$GITHUB_RUN_ID" --name "ci-metrics-$lane" \
              --dir "$M" || echo "no ci-metrics-$lane artifact this run"
          done
          # The recent window: the newest ci-metrics artifact per lane per
          # run of the last 15 runs that are not this one, whatever their
          # event -- the scoping metric reads pull_request runs, the push
          # counts read push runs, and every line carries its own event and
          # run id, so the ratchet groups them itself. The run association is
          # read as .workflow_run.id with a .run_id fallback (the list API
          # stopped returning .run_id on 2026-10-12); both stay null-safe in
          # ci_ratchet.window_entries, which owns the selection now.
          python3 -I tests/ci_ratchet.py --gather --metrics-dir "$M"
      # The window is ci.yml's push runs and, across the cut-over, the
      # pre-umbrella Tests runs, each carrying its jobs: the critical path is
      # a CI run's span to its last `tests / *` job (U9a). Its reads and its
      # refusals are tests/ci_ratchet.py's, self-tested above.
      - name: Fetch the recent push runs' durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tests/ci_ratchet.py --gather-runs "$RUNNER_TEMP/runs.json"

      - name: Grade the ratchet
        run: >-
          python3 tests/ci_ratchet.py
          --metrics-dir "$RUNNER_TEMP/metrics"
          --runs-json "$RUNNER_TEMP/runs.json"


  # Same-repo PR only: the closures job already re-recorded under strace.
  # If check printed UNDER-SCOPED or INERT READS UNDER-APPROXIMATED, merge
  # those recordings and push (R9-CI-1: the second is the same merge). Not a
  # coding agent -- Linux CI already paid the derive. Does not push on
  # no-copies, a failed recording of a script the check named, an INERT
  # contradiction, or its own follow-up commit (`ci: re-record closures`).
  #
  # A GITHUB_TOKEN push's own pull_request runs are created but held
  # `action_required` until approved (since 2026-10-15; run 38781421410), so
  # the approve step below has hpo-runs approve them, and this job also
  # dispatches CI (ci.yml, -f pr -f base) on the new SHA, whose dispatched
  # run is not held and whose gate judges every unit there.
  # CLOSURES_PUSH_TOKEN, if set, retriggers via synchronize and the dispatch
  # is skipped.
  closures-autofix:
    needs: [closures]
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && needs.closures.result == 'failure'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.CLOSURES_PUSH_TOKEN || github.token }}
          persist-credentials: false

      # D11-s1-03: this job holds `contents: write`, so it runs the BASE's copy
      # of every program it executes, never the pull request's (the pinned-
      # grader rule of decision 0013), and every Python under `-I`, so no
      # `PYTHONPATH`, `sitecustomize` or module in the working tree runs
      # instead. The copies are unstaged at once: only the repaired file is
      # committed, and `--autostash` below carries them across the pull.
      - name: Restore the programs this job runs from the base commit
        env:
          PINNED: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$PINNED^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=1 origin "$PINNED"
          git checkout "$PINNED" -- tests/closure.py
          git reset -q -- tests/closure.py
          # The report runs after `pull --rebase --autostash`, which can leave
          # the pull request's copy in the tree; it runs this copy instead.
          install -D -m 0444 tests/closure.py "$RUNNER_TEMP/pinned/closure.py"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Download closure recordings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: closure-recordings
          path: ${{ runner.temp }}/closures

      - name: Merge UNDER-SCOPED recordings
        id: autofix
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLOSURES_RESULT: ${{ needs.closures.result }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          export SUBJECT=$(git log -1 --pretty=%s)
          python3 -I - <<'PY'
          import os, sys
          sys.path.append("tests")
          import closure
          allowed = closure.autofix_allowed(
              event_name=os.environ["EVENT_NAME"],
              closures_result=os.environ["CLOSURES_RESULT"],
              head_repo=os.environ["HEAD_REPO"],
              repo=os.environ["REPO"],
              commit_subject=os.environ["SUBJECT"],
          )
          print(f"allowed={allowed}")
          if not allowed:
              status = "skip-not-allowed"
          else:
              status = closure.apply_under_scoped_recordings(
                  os.environ["RUNNER_TEMP"] + "/closures", partial=True)
          print(f"AUTOFIX: {status}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"status={status}\n")
          PY

      - name: Push the merged closures
        id: push
        if: steps.autofix.outputs.status == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ inputs.pr }}
          BASE_REF: ${{ inputs.base }}
          USED_PAT: ${{ secrets.CLOSURES_PUSH_TOKEN != '' }}
          PUSH_TOKEN: ${{ secrets.CLOSURES_PUSH_TOKEN || github.token }}
        run: |
          # The checkout left no token on disk (D11-s1-03); git gets it here,
          # for this pull and push only, the header actions/checkout would
          # have written.
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/closures.json
          git diff --cached --quiet && {
            echo "closures.json unchanged after apply; not pushing"
            exit 0
          }
          git commit -m "ci: re-record closures"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            pull --rebase --autostash origin "$HEAD_REF" || true
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push
          if [ "$USED_PAT" = "true" ]; then
            echo "PAT push retriggers pull_request; not dispatching"
            exit 0
          fi
          # A GITHUB_TOKEN push's pull_request runs at this head are held
          # `action_required` (since 2026-10-15; run 38781421410), and the
          # next step's poll, keyed on the pushed SHA (#1283), has hpo-runs
          # approve them; the dispatch below is not held.
          echo "token_push=true" >> "$GITHUB_OUTPUT"
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # No -f recheck=: the dispatched run uses this ref's workflow, and
          # every dispatch of it runs the pull-request-like lanes (the
          # nightly lanes are nightly.yml's since R10-CI-LAYOUT PR 1).
          # One dispatch of the umbrella, naming the PR and its base (U0c's
          # inputs): its prelude verifies they name the open PR this pushed
          # SHA heads, and its gate judges every unit at that head.
          gh workflow run ci.yml --ref "$HEAD_REF" -f pr="$PR" -f base="$BASE_REF"

      # The dispatch above runs at once. #1276 added this step because a
      # GITHUB_TOKEN push's pull_request runs were held action_required for a
      # human, and a pending required check shadowed the dispatched green on
      # the PR. Measured 2026-10-09, at two bot heads: no such run is created
      # at all, so this step normally finds nothing to approve and the
      # dispatched runs stood alone. Under the umbrella the held run is a
      # `CI` run (ci.yml), which this step approves like any other on the
      # branch; whether it is approved beside the dispatched `gate` or the
      # step is deleted is M-3's decision (DESIGN-P2 10, U10's M-3(b)).
      # The listing is preceded by a bounded poll: GitHub creates the pushed
      # SHA's runs asynchronously, and a one-shot listing was measured
      # approving nothing while all five runs appeared moments later (#1283).
      # Approve them as a dedicated Actions-only App -- HPO_RUNS_PEM /
      # HPO_RUNS_APPID, Actions: write alone, a smaller blast radius than
      # hpo-approver's -- minting the token with the same RS256 flow
      # tools/pr/app_approve.sh uses, ported inline because a workflow
      # cannot read the orchestrator box's key files. Fail-soft throughout:
      # absent secrets print one notice and approve nothing (until the owner
      # sets them, behavior is unchanged), and a later mint or approve error
      # warns rather than reddening a job whose push already happened -- red
      # means "no bot commit" (#523), and the commit exists.
      - name: Approve the runs the push left holding
        if: steps.push.outputs.token_push == 'true'
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          PUSH_SHA: ${{ steps.push.outputs.pushed_sha }}
          RUNS_PEM: ${{ secrets.HPO_RUNS_PEM }}
          RUNS_APPID: ${{ secrets.HPO_RUNS_APPID }}
        run: |
          { set +x; } 2>/dev/null  # the PEM, JWT and token are never traced
          if [ -z "$RUNS_PEM" ]; then
            echo "::notice::HPO_RUNS_PEM is not set; leaving action_required runs for a human (fail-soft)"
            exit 0
          fi
          if [ -z "$RUNS_APPID" ]; then
            echo "::warning::HPO_RUNS_APPID is not set; leaving action_required runs for a human (fail-soft)"
            exit 0
          fi
          umask 077
          API=https://api.github.com
          ACCEPT='Accept: application/vnd.github+json'
          key="$RUNNER_TEMP/hpo-runs.pem"
          jwt_h="$RUNNER_TEMP/hpo-runs-jwt.h"
          tok_h="$RUNNER_TEMP/hpo-runs-token.h"
          cleanup() {
            if [ -s "$tok_h" ]; then
              curl -fsS -X DELETE -H @"$tok_h" -H "$ACCEPT" "$API/installation/token" >/dev/null 2>&1 \
                || echo "::warning::revoking the run-approver App token failed; it expires within the hour"
            fi
            rm -f "$key" "$jwt_h" "$tok_h"
          }
          trap cleanup EXIT
          # So the EXIT trap (token revoke + file removal) also fires when the
          # job is cancelled -- app_approve.sh's bounded-gap line.
          trap 'exit 130' INT TERM HUP
          printf '%s\n' "$RUNS_PEM" > "$key"
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          h=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          p=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$RUNS_APPID" | b64)
          s=$(printf '%s.%s' "$h" "$p" | openssl dgst -sha256 -sign "$key" -binary | b64) && [ -n "$s" ] || {
            echo "::warning::signing the run-approver App JWT failed; nothing approved (fail-soft)"
            exit 0
          }
          printf 'Authorization: Bearer %s.%s.%s\n' "$h" "$p" "$s" > "$jwt_h"
          inst=$(curl -fsS -H @"$jwt_h" -H "$ACCEPT" "$API/repos/$REPO/installation" \
            | python3 -I -c 'import sys,json; print(int(json.load(sys.stdin)["id"]))') || {
            echo "::warning::the run-approver App has no installation on $REPO, or its JWT was refused; nothing approved (fail-soft)"
            exit 0
          }
          curl -fsS -X POST -H @"$jwt_h" -H "$ACCEPT" "$API/app/installations/$inst/access_tokens" \
            | python3 -I -c 'import sys,json
          t = json.load(sys.stdin)["token"]
          open(sys.argv[1], "w").write("Authorization: Bearer %s\n" % t)' "$tok_h" && [ -s "$tok_h" ] || {
            echo "::warning::minting the run-approver App installation token failed; nothing approved (fail-soft)"
            exit 0
          }
          # The pushed SHA's pull_request runs are created asynchronously,
          # so a listing fired the instant the push step ends can precede
          # every run and approve nothing while they appear moments later
          # (#1283). Bounded poll first: re-list every 5s for up to 60s
          # until one action_required run sits at the pushed SHA the push
          # step exported. An expired window stays fail-soft -- the flow
          # below prints the after-state it always printed, plus one
          # notice naming the timeout, because a genuinely run-less push
          # is legitimate (nothing-staged paths exit before token_push).
          sha_held() {
            curl -fsS -H @"$tok_h" -H "$ACCEPT" \
              "$API/repos/$REPO/actions/runs?branch=$HEAD_REF&status=action_required&per_page=100" \
              | python3 -I -c 'import sys,json
          for r in json.load(sys.stdin).get("workflow_runs", []):
              if r["head_sha"] == sys.argv[1]:
                  print(r["id"])' "$PUSH_SHA"
          }
