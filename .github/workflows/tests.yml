        continue-on-error: true
        with:
          pattern: mutation-pins*
          path: ${{ runner.temp }}/mutation-pins-shards

      # No driver runs here: the pins were measured in `mutation`, which holds
      # no write grant, and this job only merges the entries it measured into
      # the head's ledger, each checked against the head's own inventory.
      - name: Take the pinned ledger
        id: autofix
        env:
          EVENT_NAME: ${{ github.event_name }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          PINS: ${{ runner.temp }}/mutation-pins
          SHARDS_DIR: ${{ runner.temp }}/mutation-pins-shards
