# PROBE CUT (U0c probe ref, never P2b): the one trivial unit the umbrella
# calls on ci-probe refs, so DESIGN-P2 10's U0 live perturbations run before
# any real callee is converted. Its job reports `probe / probe`.
name: Probe unit

on:
  workflow_call:
    inputs:
      pr:
        type: string
        default: ""
      base:
        type: string
        default: ""
      head:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # M-5b/M-7 window: the unit stays in progress for 4 min so one listing at a 60 s poll lands inside it
      - run: sleep 240
# m6 nochain trivial push 2026-10-23T06:04:33Z
# m6 chain trivial push
