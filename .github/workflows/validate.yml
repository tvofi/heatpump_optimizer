name: Validate

# A called workflow of ci.yml's umbrella and of marketplace.yml's weekly
# schedule: each caller owns the triggers, the run-id concurrency group and the
# grant (`contents: read`). It takes no secrets, and one input: the prelude's
# `stand_down` (#3885), which marketplace.yml never passes, so its runs validate.
on:
  workflow_call:
    inputs:
      stand_down:
        description: "The prelude's light-run stand-downs (#3885): when it names `validate` (no production file changed) the steps below skip and the job reports success"
        type: string
        default: ""

# Read-only validation: the GITHUB_TOKEN needs nothing beyond checkout.
permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    env:
      STAND_DOWN: ${{ contains(format(' {0} ', inputs.stand_down), ' validate ') }}
    steps:
      # Unconditional: on a light run (no production file changed, prelude.light) the
      # one step that runs, so the job says why it reports success.
      - name: Say the light decision this run stands on
        run: |
          echo "validate: stand down on a light run (prelude.stand_down, #3885): ${{ env.STAND_DOWN }}"

      - name: Checkout
        if: env.STAND_DOWN != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HACS validation
        if: env.STAND_DOWN != 'true'
        # Pinned by commit: this is a moving branch upstream.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
