name: Validate

# A called workflow of ci.yml's umbrella: the caller owns the triggers, the
# run-id concurrency group and the grant (`contents: read`). It takes no inputs
# and no secrets.
on:
  workflow_call:

# Read-only validation: the GITHUB_TOKEN needs nothing beyond checkout.
permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HACS validation
        # Pinned by commit: this is a moving branch upstream.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
