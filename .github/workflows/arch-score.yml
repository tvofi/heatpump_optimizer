# The architecture score as a required check (R9-EG-A4, #1774; tvofi's
# decision R3-6, 2026-09-29). A pull request passes when the score, with the
# counters, reads delta-S >= 0 and no gate metric rises from the merge base to
# the head, or when its body explains every rise under `## Architecture score`
# (tools/audit/archscore/gate.py states the rule; the fix reviewer judges the
# reason). It is a review trigger, never a target (tools/audit/archscore/ABOUT.md).
#
# WHY ITS OWN FILE. tests.yml is the suite; this check reads the body, so it
# re-runs on `edited` (a body edit is the answer to a red run), and an event a
# workflow lists starts every job in it. One job, no `if:`, so no run this
# file starts is a skipped one (#1514's shape, as budget-raise-gate.yml).
#
# The check runs the BASE's scorer and the BASE's tests/structure.py (which the
# scorer loads by path into its own process), as tests.yml restores its check
# source: a pull request cannot edit the check that grades it. #2068's round 1
# planted exactly that edit; tests/arch_score.py drives this file's score step
# over it. The pull request that adds gate.py has no base copy and runs its own.

name: Architecture score

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

# No run is cancelled, as in budget-raise-gate.yml (R9-CI-2a): this check reads
# the body, so a body edit starts a same-SHA twin of the run in flight, and
# cancelling either would leave the SHA with a cancelled check run the edit
# was meant to replace. The job is short and its check run is per head, so a
# superseded head's run finishing costs nothing. `tests/entities.py` pins the
# route.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  arch-score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0: the merge base and the head are archived out of the clone.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # A queue entry carries no pull request: named from the queue branch and
      # its second parent, as budget-raise-gate.yml does, and the API must
      # report the same head.
      - name: Name the pull request and read its body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          NUMBER="$PR_NUMBER"
          if [ "$EVENT" = "merge_group" ]; then
            NUMBER=$(printf '%s' "$QUEUE_REF" | jq -Rr 'capture("/pr-(?<n>[0-9]+)-[0-9a-f]{40}$").n')
            test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" --jq '.head.sha')" = "$(git rev-parse 'HEAD^2^{commit}')"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          echo "pull request $NUMBER, body $(wc -c < "$RUNNER_TEMP/body.md") bytes"

      # The scorer, and everything it loads, is the BASE's: tools/audit/archscore/
      # and tests/structure.py (vector.py loads the latter by path into the
      # gate's process) come from a checkout of the base commit, so a pull
      # request cannot edit the check that grades it, as tests.yml restores its
      # check source (decision 0013). Only the two commits' custom_components/
      # are read, out of git. When the base holds no gate.py, this pull request
      # is the one adopting it: it runs its own copy, once, and the workflow
      # file that says so is under the owner's review.
      - name: Score the change, and refuse an unexplained rise
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          GATE=tools/audit/archscore/gate.py
          if git cat-file -e "$PR_BASE:$GATE" 2>/dev/null; then
            git worktree add -q --detach "$RUNNER_TEMP/base" "$PR_BASE"
            cd "$RUNNER_TEMP/base"
            echo "gate and structure.py from the base $PR_BASE"
          else
            echo "the base holds no $GATE: this pull request adopts it, so its own copy runs"
          fi
          python3 -I "$GATE" --self-test
          python3 -I "$GATE" --base "$PR_BASE" --head "$PR_HEAD" --body "$RUNNER_TEMP/body.md"
