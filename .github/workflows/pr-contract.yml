# The pull-request contract: a body is checked against the evidence it owes.
#
# A CALLEE OF ci.yml (R10-CI-LAYOUT P2b, U6). The umbrella's `pr-contract`
# caller runs this after every other unit, on code and edit events that name a
# pull request, so the red list below is final. It is a unit, not a required
# context: `gate` is the one required check, and this job's check run reads
# `pr-contract / pr-contract`. A body edit re-runs it because ci.yml lists
# `edited`; the PR number, base ref name and head SHA arrive as inputs, the
# prelude's, and the event (`github.event`, `github.event_name`) is the
# caller's. Nothing here selects an event any more: no `pull_request`, no
# `merge_group`, no `concurrency` (ci.yml's run-id group holds the run alone).
#
# `tests.yml` must not carry `edited`: the umbrella's callers are skipped on an
# edit run unless the prelude's workset names them (DESIGN-P2 4.3).

name: PR contract

on:
  workflow_call:
    inputs:
      pr:
        type: string
        default: ""
      base:
        type: string
        default: ""
      head:
        type: string
        default: ""

# The floor a job-level block replaces; restated on the job. `security-events`
# and `actions` are the code-scanning wait's reads (DESIGN-P2 4.3): runs and
# jobs for steps 1-3, analyses and alerts for steps 4-5.
permissions:
  contents: read
  security-events: read
  actions: read

jobs:
  pr-contract:
    # The evidence sections a body owes, checked at the head CI is running. A
    # body edit re-runs this and must NOT re-run the forty-minute gate: ci.yml's
    # workset for an edit run names this job and the body units only. No `if:`:
    # the caller's decides, and a skipped job here would write a skipped check.
    runs-on: ubuntu-latest
    # The code-scanning wait is bounded at ten minutes (codescan_wait.py
    # WAIT_MAX_S); the rest of the job is about a minute.
    timeout-minutes: 20
    # THE GRANTS THIS JOB ADDS ARE READS. The red-list step below reads the
    # head's check runs through `/commits/<sha>/check-runs`, which the token
    # refuses without `checks: read` (#956); the body step reads the pull
    # request's own resource through `/pulls/<number>`, which it refuses
    # without `pull-requests: read` (the `record` job's `--stats` carries the
    # same grant for the same read); `contents: read` restates the workflow
    # floor a job-level block replaces, because the checkout needs it. A
    # read-only widening on the one job that reads the API is the
    # `nightly-status` precedent in tests.yml, and the override pin in
    # tests/entities.py counts this block and carries this argument.
    # `security-events: read` and `actions: read` are the code-scanning wait's
    # (DESIGN-P2 4.3): the run and its jobs, then the analyses and alerts.
    permissions:
      contents: read
      checks: read
      pull-requests: read
      security-events: read
      actions: read
    steps:
      # fetch-depth 0 because `## Approval` is keyed on the DIFF (R3-D11-03):
      # the base commit has to be in the clone for `git diff base...head` to
      # answer. The default depth-1 checkout has neither the base nor any
      # history, and a diff that cannot run would read as "touches no policy
      # file" -- the fail-open this keying exists to close.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      # THE CHECK IS NOT EXECUTED FROM THE CHANGE IT IS CHECKING (#1515, the
      # `policy-docs` step of #1403 applied to this job). Every step below
      # grades the pull request's body and diff, so the program must be the
      # base's -- one appended `process.exit(0)` to `counts.mjs`, which
      # `policy_lint.mjs` imports, turned this job's refusal of an empty body
      # into rc 0. The same pathspecs as `policy-docs`. FIRST, before any
      # program the pull request carries (decision 0013): a step running the
      # pull request's code can write $GITHUB_ENV and so reach every later step,
      # so the self-tests this job used to run moved to governance.yml's
      # `instrument-self-tests`, and this job runs no pull-request program at
      # all. A file the base does not have cannot be restored, the limit
      # `policy-docs` states.
      - name: Restore the check source from the base commit
        env:
          # The event's base commit; a dispatch carries none, and falls back to
          # the base ref's tip (the clone is full-depth, so origin/<ref> exists).
          PINNED: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || format('origin/{0}', inputs.base) }}
        run: |
          set -euo pipefail
          rm -rf .claude/workflows/vendor
          # Each program at its path before and after the reorganisation (R9-RO-2):
          # the diff lists what PINNED holds of them, skipping the half it lacks,
          # which a checkout of a pathspec would refuse. R9-RO-9 drops the old half.
          git diff --name-only -z "$(git hash-object -t tree /dev/null)" "$PINNED" -- \
            '.claude/workflows/*.mjs' \
            '.claude/workflows/*.py' \
            '.claude/workflows/vendor' \
            'tools/audit/*.sh' \
            'tools/audit/record-predicate' \
            'tools/audit/round6/D11/fix/codeowners_gap.py' \
            'tools/audit/seat/roster_lib.py' \
            'tools/policy/*.mjs' \
            'tools/policy/*.py' \
            'tools/pr/*.py' \
            'tools/ci/*.py' \
            'tools/policy/vendor' \
            'tools/pr/*.sh' \
            'tools/seat/*.sh' \
            'tools/coverage/*.sh' \
            'dev/audit/*.sh' \
            'tools/policy/record-predicate' \
            'dev/audit/rounds/round6/D11/fix/codeowners_gap.py' \
            'tests/layout.py' > "$RUNNER_TEMP/pinned.list"
          test -s "$RUNNER_TEMP/pinned.list"
          git checkout "$PINNED" --pathspec-from-file="$RUNNER_TEMP/pinned.list" --pathspec-file-nul
          echo "check source restored from $PINNED: $(git diff --cached --name-only | wc -l) file(s) differ from the pull request's copy"
          test -f .claude/workflows/policy_lint.mjs || test -f tools/policy/policy_lint.mjs

      # THE MERGE QUEUE (round-9 process review item 2). A `merge_group` run
      # carries no pull request in its payload, so the entry is named from the
      # tree: its number from the queue branch's name, its head as the queue
      # commit's second parent (merge method MERGE), and the API must report
      # that same head or the step fails -- a run that cannot name what it
      # grades must not pass. On every other event the number and head are the
      # prelude's inputs (a dispatch and a review carry no `pull_request`
      # payload to read them from), and the base commit is the payload's, else
      # the API's. Outputs only, never $GITHUB_ENV: nothing here can reach a
      # later program, and it runs after the restore, from admitted commands
      # alone.
      - name: Name the pull request this run grades
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          IN_PR: ${{ inputs.pr }}
          IN_HEAD: ${{ inputs.head }}
          PAYLOAD_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "merge_group" ]; then
            NUMBER=$(printf '%s' "$QUEUE_REF" | jq -Rr 'capture("/pr-(?<n>[0-9]+)-[0-9a-f]{40}$").n')
            HEAD=$(git rev-parse --verify 'HEAD^2^{commit}')
            test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" --jq '.head.sha')" = "$HEAD"
            echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "base=$QUEUE_BASE" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD" >> "$GITHUB_OUTPUT"
            echo "queue entry: pull request $NUMBER at $HEAD on base $QUEUE_BASE"
          else
            test -n "$IN_PR" && test -n "$IN_HEAD"
            BASE=${PAYLOAD_BASE:-$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${IN_PR}" --jq '.base.sha')}
            echo "number=$IN_PR" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "head=$IN_HEAD" >> "$GITHUB_OUTPUT"
            echo "pull request $IN_PR at $IN_HEAD on base $BASE"
          fi

      # THE BODY IS READ FROM THE API AT RUN TIME, NEVER FROM THE EVENT
      # PAYLOAD. `${{ github.event.pull_request.body }}` is the body as it
      # stood when the event fired, and `gh run rerun` replays that payload,
      # so a body corrected after the event never reached this check. Measured
      # on #1059 at head a93a43b: the body was edited to name a93a43b, run
      # 35093322057 was re-run twice (attempts 2 and 3) and refused both times
      # with "`## Head` does not name a93a43b" while `GET /pulls/1059` showed
      # the corrected body; a close/reopen -- a fresh event at the same head,
      # no tree change -- passed as run 35098726083. The ledger lane in
      # governance.yml edited its PR's body with GITHUB_TOKEN until decision
      # 0009 step 3b moved that write to the seat author; those edits fired no
      # `pull_request` event, so a manual re-run was the only route to green
      # there and the one route that could not work. The `if:` on this job
      # keeps the read off the `schedule` and `push` paths, which carry no
      # pull request to read.
      #
      # Fail-closed, on the red-list step's principle: a read that fails must
      # fail the step, because an empty file from a failed fetch is "no
      # sections", and that reads as a contract violation the author did not
      # commit. `printf '%s'` keeps the file shape the payload write had --
      # no newline the API did not send; the command substitution drops only
      # trailing newlines, which every reader (`sections()` in policy_lint,
      # `head_section_sha`, figure_lint, preflight's `$(cat)`) trims anyway.
      # The number goes through `env:` and never into the shell line, so the
      # untrusted-context census in tools/audit/round4/D11/untrusted_text.py
      # counts the same `env:` interpolations and the same zero free-text
      # shell ones as before this step changed.
      - name: Read the body off the API, not the event payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          BODY=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')
          printf '%s' "$BODY" > /tmp/pr-body.md
          AUTHOR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.user.login // ""')
          printf '%s' "$AUTHOR" > /tmp/pr-author.txt
          # The title too: a queue entry's payload does not carry it, and a
          # dispatch's has no pull request. Read like the body, never the payload.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title // ""' > /tmp/pr-title.txt

      # The paths decide whether `## Approval` is owed, so this runs WITHOUT
      # `|| true` and with `set -o pipefail`: a derivation that fails must fail
      # the step. policy_lint refuses an unreadable or empty list for the same
      # reason -- an empty diff is not a thing a pull request has.
      - name: List the paths this pull request changes
        env:
          PR_BASE: ${{ steps.pr.outputs.base }}
          PR_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          # --no-renames, and it is not cosmetic: a rename is reported by its
          # DESTINATION only, so moving CLAUDE.md to RENAMED.md yields a list
          # matching no glob and the approval gate would not fire on the change
          # that removed a policy file. Measured both ways before wiring it.
          git diff --no-renames --name-only "$PR_BASE...$PR_HEAD" > /tmp/pr-files.txt
          wc -l < /tmp/pr-files.txt
          # The same diff less its additions: what the base already had. A
          # reporter that grades `main` is exempt from `## Red checks` only
          # while the diff touches none of its inputs, and a delivery row the
          # pull request ADDS (its own) is not one; a row it edits or deletes is.
          git diff --no-renames --name-only --diff-filter=a "$PR_BASE...$PR_HEAD" > /tmp/pr-existing.txt

      # THE CODE-SCANNING WAIT (DESIGN-P2 4.3, steps 1-5; owner ruling R-10,
      # option B). The `CodeQL` check concludes before the last uploading leg
      # ends, so the check listing below cannot see a finding only the python
      # leg reports. This step waits for the analyses of the run that owns the
      # codeql unit (a poll of at least 60 s, bounded at ten minutes), reads
      # each by id, and lists the alerts left open as
      # `code-scanning alert <n> (<rule id>)`, one per line, for the list below.
      # It fails closed on any failed read. Its program is the base's (the
      # restore above takes tools/ci/*.py). `CS_BASE_REPEATS` is empty until the
      # live probe (U6 case 6) shows the merge ref's analysis repeats the base's
      # alerts; set it to subtract them.
      - name: Wait for code scanning and list its open alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ inputs.base }}
          CS_BASE_REPEATS: ""
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER" && test -n "$BASE_REF"
          python3 -I tools/ci/codescan_wait.py --pr "$PR_NUMBER" --base "$BASE_REF" ${CS_BASE_REPEATS:+--base-repeats} > /tmp/pr-alerts.txt
          printf 'code-scanning alerts the body must answer: %s\n' "$(paste -sd, /tmp/pr-alerts.txt)"

      # #956: the red-check trigger CLAUDE.md calls enforced, enforced. The
      # head's check runs are listed FIRST, the red names are handed to the
      # body check as `--red`, and the same body that exited 0 when CI passed
      # no `--red` exits 1 now -- the only behaviour change of this wiring.
      #
      # THE EXCLUSION KEY IS THE CHECK-RUN NAME `pr-contract`, and nothing
      # else. Every run this job ever produces carries that name -- GitHub
      # Actions names a job's check run after the job, this job has no matrix,
      # and re-runs keep the name -- so keying on it excludes this job's OWN
      # prior runs at the head whatever produced them: the `synchronize` run,
      # the `edited` run a body edit fires at the outgoing head (#1031's run
      # 34896491442 sat exactly there), a manual re-run's new attempt. A key
      # on any run or attempt IDENTIFIER is wrong twice over: a re-run gets a
      # new id, and an event-driven re-run at the SAME head gets a new run id
      # -- the #1031 shape -- so an id-keyed exclusion lets this job's own red
      # back into the list and the deadlock the caveat names returns: a body
      # refused for not naming a red caused by not naming it. The name key
      # cannot exclude a FOREIGN red -- a red from another check the body must
      # answer -- because the listing's other entries are runs other jobs
      # produced and every foreign job carries a foreign name; `pr-contract`
      # is the only job by that name in this repository. RED means the
      # corpus's own predicate: conclusion `failure` at the head, so a
      # skipped, cancelled, timed-out or still-running check is not red, and a
      # check that failed and then succeeded still is (the listing, never
      # `gh pr checks` -- the no-gh rule's own reason). One call, one page per
      # hundred runs (`--paginate`): single-digit seconds inside a job that
      # already runs about 75 s.
      #
      # THE EXCLUSION KEYS ARE NOW TWO (N4). A unit's check run is named
      # `<caller> / <job>`, so this job's own is `pr-contract / pr-contract`;
      # the name key above holds for that name, and `gate` is excluded too: it
      # is red whenever anything required is red, so listing it would ask a
      # body to answer the verdict it feeds. The code-scanning alerts the wait
      # step listed join the list, each as its own name (R-10, option B).
      - name: List the red checks at this head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          # Fail-closed, on the paths-file step's own principle: a derivation
          # that fails must fail the step, because an empty red list read from
          # a failed fetch is "no reds" -- the fail-open this wiring closes.
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD}/check-runs" \
            --jq '.check_runs[]
                   | select(.status == "completed" and .conclusion == "failure")
                   | select(.name != "pr-contract / pr-contract")
                   | select(.name != "gate")
                   | .name' | sort -u > /tmp/pr-reds.txt
          cat /tmp/pr-alerts.txt >> /tmp/pr-reds.txt
          sort -u /tmp/pr-reds.txt -o /tmp/pr-reds.txt
          printf 'red checks the body must answer: %s\n' \
            "$(paste -sd, /tmp/pr-reds.txt)"

      - name: Check the body against the contract
        env:
          # The title is written by whoever opened the pull request, so it
          # reaches the shell as a file read below, never as an interpolation. It
          # is also EVIDENCE (R3-D11-03): `## Approval` is keyed on --paths-file
          # below, and the title only adds to it.
          PR_HEAD: ${{ steps.pr.outputs.head }}
          # #2028: the red history (#1144) reads every branch commit's check
          # runs and SKIPS without a token; no revision of this step held one,
          # so the contract printed `skip red-history` and passed a body silent
          # on a red an earlier commit carried. The program is the
          # base's (restored above) and the grant is the job's reads only.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One --red flag per name, never one comma-joined value: a check
          # name containing a comma would split into fragments neither the
          # refusal nor `## Red checks` can match.
          RED_ARGS=()
          while IFS= read -r name; do
            RED_ARGS+=(--red "$name")
          done < /tmp/pr-reds.txt
          PR_TITLE=$(cat /tmp/pr-title.txt)
          if test -f .claude/workflows/policy_lint.mjs; then
            node .claude/workflows/policy_lint.mjs \
              --pr-body /tmp/pr-body.md --head "$PR_HEAD" --title "$PR_TITLE" \
              --author "$(cat /tmp/pr-author.txt)" \
              --paths-file /tmp/pr-files.txt --existing-file /tmp/pr-existing.txt \
              "${RED_ARGS[@]}"
          else
            node tools/policy/policy_lint.mjs \
              --pr-body /tmp/pr-body.md --head "$PR_HEAD" --title "$PR_TITLE" \
              --author "$(cat /tmp/pr-author.txt)" \
              --paths-file /tmp/pr-files.txt --existing-file /tmp/pr-existing.txt \
              "${RED_ARGS[@]}"
          fi

      - name: Every figure's command resolves at this head
        if: always()
        run: if test -f .claude/workflows/figure_lint.mjs; then node .claude/workflows/figure_lint.mjs --pr-body /tmp/pr-body.md; else node tools/policy/figure_lint.mjs --pr-body /tmp/pr-body.md; fi

      # preflight.sh refuses a closing keyword whose number is not in the
      # intended list it is given. A seat states that list (the roster group's
      # `fixes`) on prepr.sh; CI has no seat, so it derives the list here. The
      # key is the issue NUMBER, not the branch: a group's `resume.branch` is a
      # handoff path (`handoff/r10-tariff`) that the fix branch drifts from
      # (`fix/r10-tariff-pr`), and `group_for_branch`'s last-segment fallback
      # does not answer for the `-pr` suffix. The number is the one field the
      # body and every roster share.
      #
      # WHAT IS REFUSED: a `Closes #N` where N is a roster issue no group names
      # in `fixes` -- a "Part of" issue given a closing keyword (the brief's
      # rule: closing keyword only for `fixes`). An unrostered N is an ad-hoc
      # fix the roster cannot verify (e.g. #2212 closes #2205, in no roster),
      # so it is treated as intended rather than refused -- refusing it would
      # be the over-fire this step exists to end.
      #
      # `|| true` is gone: it swallowed the refusal, so the check bound
      # nowhere. Before, no intended list was passed (every `Closes` was
      # refused) and the refusal was discarded; a genuine refusal now fails
      # the step.
      - name: Pre-flight the body for unmeasured claims
        if: always()
        run: |
          set -euo pipefail
          # jq, NOT python. The derivation must stay on this job's pin
          # allowlist (`codeowners_gap.py`'s admitted(): no heredoc, no `-c`,
          # no `-`). A `python3 - <<'PY'` heredoc is not an admitted command, so
          # it taints the job from its line on and unpins every file after it --
          # `tools/pr/preflight.sh` just below and `tools/pr/prepr.sh` in the
          # version-edit step, both of which the restore above puts back from
          # the base. That unpinning is what `codeowners_gap.py --check` refuses
          # (#1515; decision 0013), so a rewrite back to python must keep an
          # admitted command or the pin falls. Same extraction and set
          # arithmetic as the seat's prepr.sh states: closes = a number after a
          # closing keyword; never = a roster `issues` number no group names in
          # `fixes`; intended = closes minus never.
          INTENDED=$(jq -rs --rawfile body /tmp/pr-body.md '. as $r | [$r[].groups[]? | .fixes[]?] as $fixes | [$r[].groups[]? | .issues[]?] as $issues | [$issues[] | select(. as $n | ($fixes | index($n)) == null)] as $never | [ $body | match("\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s*:?\\s+(?:https?://[^ ]*/issues/|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#|GH-|#)([0-9]+)"; "gi") | .captures[0].string | tonumber ] as $closes | [$closes[] | select(. as $n | ($never | index($n)) == null)] | unique | sort | map(tostring) | join(" ")' dev/programme/rosters/wave-r*-groups.json)
          if test -f tools/audit/preflight.sh; then bash tools/audit/preflight.sh $INTENDED < /tmp/pr-body.md; else bash tools/pr/preflight.sh $INTENDED < /tmp/pr-body.md; fi

      # CLAUDE.md rule 4, refused where it binds. `prepr.sh` step 5 held this
      # check and ran only on a seat's own machine; the self-test above drives
      # its predicate over strings and never reads this pull request's diff, so
      # a VERSION bump passed every check (measured on this PR's own harness).
      # One function, `version_edit`, serves both callers.
      #
      # A STEP IN THIS JOB, NOT A NEW JOB: `pr-contract` is already a required
      # context, and a new job's context would need a ruleset change, which is
      # the owner's. The job's `if:` limits it to `pull_request`, so the stamp
      # itself -- pushed straight to main -- never reaches this step. Last and
      # `if: always()`, so a refused body does not hide it and it does not
      # hide the body's refusals.
      #
      # THE MAIN REF IS FETCHED, NOT THE PAYLOAD'S `base.sha`: a re-run replays
      # the payload, and a base older than a stamp the branch has since merged
      # would put that stamp inside the three-dot. `version_edit` takes the
      # merge base itself, so a main that moved past a stamp adds nothing.
      - name: Refuse a version, manifest-version or notes-heading edit
        if: always()
        env:
          PR_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if test -f tools/audit/prepr.sh; then bash tools/audit/prepr.sh --version-edit origin/main "$PR_HEAD"; else bash tools/pr/prepr.sh --version-edit origin/main "$PR_HEAD"; fi

      # finding-propagation.md's `Carry:` marker, refused where a body is
      # written: every `## Friction` and `## Forward-carry` item, and every
      # out-of-scope or residual item, names a destination that exists -- a
      # live roster group, an issue a live group or carry file owns, an O-brief,
      # or `dismissed: <reason>` (tools/audit/carry_audit.py). Round 10 left 39
      # of 95 findings with no owner, 20 of them in a body.
      #
      # THE PULL REQUEST'S OWN COPY, OWNED, AND LAST -- not pinned. A pinned
      # grader must be declared in field_coverage.mjs, which is itself pinned,
      # so the pull request adding one cannot pass (#1847); protection is
      # ownership instead, as for fold_ledger.py: CODEOWNERS names carry_audit.py.
      # It is the job's LAST step, so the one thing a pull-request program here
      # could do to the job -- write $GITHUB_ENV for a later step -- reaches
      # nothing. roster_lib.py, which it imports, is restored from the base
      # above. The roster read is the tree's; an O-brief is out of tree, so here
      # it passes UNVERIFIED and the train's pre-flight checks it.
      - name: Every finding the body records names its destination
        if: always()
        run: python3 -I tools/audit/carry_audit.py check --body /tmp/pr-body.md
