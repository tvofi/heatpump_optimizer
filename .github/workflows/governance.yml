# The governance gate: the policy corpus's own refusal.
#
# WHY A SEPARATE WORKFLOW. `tests.yml` is the code gate, scoped from measured
# closures. The policy corpus is INERT by prefix in tests/closure.py -- nothing
# under tests/ reads CLAUDE.md, `.cursor/rules/` or `tools/audit/briefs/` --
# so a policy-only pull request selects zero scripts and its whole mechanical
# signal is four green ticks that measured nothing. This job is never scoped,
# the same precedent as tests.yml's `briefs` job, which lints the wave rosters
# from the same INERT directory.
#
# It is its own file rather than another job in tests.yml for one measured
# reason: `pr-contract` (added later) must run on `pull_request: [edited]`, and
# adding that type to tests.yml would re-run the whole forty-minute gate every
# time a body is edited.

name: Governance

on:
  push:
    branches:
      - main
  pull_request:
    # `edited` is the point of this workflow being separate from tests.yml: a
    # body edit must re-check the contract and must NOT re-run the forty-minute
    # gate. The other two jobs here take about ten seconds, so re-running them
    # on an edit costs nothing worth optimising.
    types: [opened, edited, synchronize, reopened]
  # 07:00 UTC on Mondays. The `record` job below is the only one that needs a
  # clock: a merge with no disposition is not detectable from any one pull
  # request, so nothing on the `pull_request` path can ever find it, and a
  # window that only advances on a push to main goes unmeasured in a quiet week.
  # `policy-docs` runs on this trigger too, which is the same lint it already
  # runs on every push to main and costs a runner-minute.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The citation resolvers ask git whether a path or symbol exists at a
          # cited tag; a shallow checkout answers "no" for every one of them.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refuse a Cursor rule that is not the generated form of its source
        run: node .claude/workflows/rules_sync.mjs --check

      - name: Lint the policy corpus
        run: node .claude/workflows/policy_lint.mjs

      # Three corpus checks shipped measuring nothing, each with an acceptance
      # its author believed pinned it. This lane empties one check's return at
      # a time and demands the acceptance refuse it, so a check that survives
      # its own removal is named on the pull request that lands it rather than
      # by the next adversarial reader.
      - name: Refuse a corpus check that survives its own deletion
        run: node .claude/workflows/policy_lint_mutants.mjs

      # A workflow script cannot import another, so the five web-*.js each carry
      # their own copy of the shared prompt block and web-fragments.md said to
      # keep them in sync by hand. The copy was not byte-identical in the commit
      # that created it, and stayed that way.
      - name: Refuse a prompt fragment that has drifted from its canonical text
        run: node .claude/workflows/fragments_sync.mjs

      - name: Show the fragment check refusing its own perturbation
        run: node .claude/workflows/fragments_sync.mjs --self-test

      - name: Refuse a hook that is missing, unwired, or fails its own self-test
        run: node .claude/workflows/policy_lint.mjs --hooks

      - name: Report what the linter found
        if: always()
        run: node .claude/workflows/policy_lint.mjs --report || true

  wave-script:
    # The control flow a wave resume rests on. `.claude/` is INERT in
    # tests/closure.py -- and closure.py FAILS if an INERT path appears in a
    # recorded closure -- so the gate structurally cannot select this. It ran by
    # hand only, and the two defects it now pins (a stage vocabulary the rosters
    # and the script did not share, a verdict class no script read) both shipped
    # and stayed shipped. Never scoped, on the tests.yml `briefs` precedent.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Drive the wave script's branching
        run: node .claude/workflows/check-wave-script.mjs

  pr-contract:
    # The evidence sections a body owes, checked at the head CI is running.
    # `pull_request: [edited]` is why this workflow is separate from tests.yml:
    # a body edit must re-run this and must NOT re-run the forty-minute gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show the pre-PR self-check refusing its own fixtures
        run: bash tools/audit/prepr.sh --self-test

      - name: Write the body as the API returned it
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > /tmp/pr-body.md

      - name: Check the body against the contract
        env:
          # Interpolating a title into a shell line is script injection: the
          # title is written by whoever opened the pull request.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node .claude/workflows/policy_lint.mjs \
            --pr-body /tmp/pr-body.md --head "$PR_HEAD" --title "$PR_TITLE"

      - name: Pre-flight the body for unmeasured claims
        if: always()
        run: bash tools/audit/preflight.sh < /tmp/pr-body.md || true

  # The loop around the corpus, rather than the corpus itself: is every merge
  # dispositioned, what is costing seats time, and which rules have outlived
  # their reason.
  #
  # NEVER ON `pull_request`, and not by omission -- the workflow's `on:` block
  # carries that trigger for `policy-docs`, so this job states the exclusion
  # itself. All three modes read `<ref>..origin/main`. On a pull_request event
  # the checkout is a merge of the branch into main and the branch's own commits
  # are not in main's history, so the window would describe a history the branch
  # is not part of: the job would refuse merges it did not cause and miss the one
  # under review, which does not exist as a merge yet.
  record:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # --stats reads pull-request bodies and review comments through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The window is `<last version tag>..origin/main`. A shallow checkout
          # has neither the tag nor the history, and `git log` on one answers
          # "no merges" -- which this job would otherwise report as "every merge
          # is dispositioned", the exact zero-means-two-things confusion the
          # --stats fetch guard exists to refuse.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Choose the window
        id: window
        run: |
          # --match 'v*': `git describe --tags --abbrev=0` on this repository
          # returns `archive-rosters-2026-09`, a non-release tag that is newer
          # than v6.3.18 and yields an empty window.
          SINCE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$SINCE" ]; then SINCE=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "window: $SINCE..origin/main"

      # THE ONLY STEP THAT MAY FAIL THIS JOB. A merged pull request with no
      # disposition in the plan of record or the living handover is a refusal:
      # the Delivery-status table is what a resuming seat reads, and a merge
      # missing from it is work no later session can find.
      - name: Every merged pull request has a disposition
        run: node .claude/workflows/policy_lint.mjs --record --since "${{ steps.window.outputs.since }}"

      # Reporting only, and deliberately unable to fail the job: a histogram and
      # a sunset list are inputs to a judgement a seat makes, not a gate. Both
      # print what they would open and open nothing.
      - name: Friction and verdict histograms
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .claude/workflows/policy_lint.mjs --stats --since "${{ steps.window.outputs.since }}" || true

      - name: Rules that have outlived their reason
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .claude/workflows/policy_lint.mjs --sunset --since "${{ steps.window.outputs.since }}" || true
