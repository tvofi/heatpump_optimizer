# The governance gate: the policy corpus's own refusal.
#
# WHY A SEPARATE WORKFLOW. `tests.yml` is the code gate, scoped from measured
# closures. The policy corpus is INERT by prefix in tests/closure.py -- nothing
# under tests/ reads CLAUDE.md, `.cursor/rules/` or `tools/audit/briefs/` --
# so a policy-only pull request selects zero scripts and its whole mechanical
# signal is four green ticks that measured nothing. This job is never scoped,
# the same precedent as tests.yml's `briefs` job, which lints the wave rosters
# from the same INERT directory.
#
# It is its own file rather than another job in tests.yml for one measured
# reason: `pr-contract` (added later) must run on `pull_request: [edited]`, and
# adding that type to tests.yml would re-run the whole forty-minute gate every
# time a body is edited.

name: Governance

on:
  push:
    branches:
      - main
  pull_request:
    # `edited` and `closed` are the point of this workflow being separate from
    # tests.yml: a body edit must re-check the contract, the ledger branch's
    # merge must fire the #201 splice (`delivery-status-splice`), and neither
    # must re-run the forty-minute gate. The other jobs here take about ten
    # seconds, so re-running them on either event -- including the closes that
    # do not merge -- costs nothing worth optimising.
    types: [opened, edited, synchronize, reopened, closed]
  # 07:00 UTC on Mondays. The `record` job below is the only one that needs a
  # clock: a merge with no disposition is not detectable from any one pull
  # request, so nothing on the `pull_request` path can ever find it, and a
  # window that only advances on a push to main goes unmeasured in a quiet week.
  # `policy-docs` runs on this trigger too, which is the same lint it already
  # runs on every push to main and costs a runner-minute.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The citation resolvers ask git whether a path or symbol exists at a
          # cited tag; a shallow checkout answers "no" for every one of them.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Refuse a Cursor rule that is not the generated form of its source
        run: node .claude/workflows/rules_sync.mjs --check

      # GITHUB_TOKEN: the required-contexts class reads the live ruleset through
      # `gh api` -- the branch endpoint and the ruleset objects -- and reddens
      # when the corpus's literals or its recorded fixture drift from it. With
      # no token the fetch fails and the class skips, loudly, which is its
      # designed failure mode; CI is where the live set is meant to be checked,
      # so the token is mapped here and costs the two API calls, about a
      # second.
      - name: Lint the policy corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .claude/workflows/policy_lint.mjs

      # Three corpus checks shipped measuring nothing, each with an acceptance
      # its author believed pinned it. This lane empties one check at a time --
      # the corpus enumeration and the record mode's, and for the `caps` rule
      # the regex list it scans as well as the check itself -- and demands the
      # acceptance refuse it, so a check that survives its own removal is named
      # on the pull request that lands it rather than by the next adversarial
      # reader.
      - name: Refuse a corpus or record-mode check that survives its own deletion
        run: node .claude/workflows/policy_lint_mutants.mjs

      # A workflow script cannot import another, so the five web-*.js each carry
      # their own copy of the shared prompt block and web-fragments.md said to
      # keep them in sync by hand. The copy was not byte-identical in the commit
      # that created it, and stayed that way.
      - name: Refuse a prompt fragment that has drifted from its canonical text
        run: node .claude/workflows/fragments_sync.mjs

      - name: Show the fragment check refusing its own perturbation
        run: node .claude/workflows/fragments_sync.mjs --self-test

      - name: Refuse a hook that is missing, unwired, or fails its own self-test
        run: node .claude/workflows/policy_lint.mjs --hooks

      # `gh api -f body=@FILE` posts the literal path, exits 0, and returns a
      # well-formed comment object (#541 comment 5625671141). The countermeasure
      # is a program seats call instead of a bit seats remember, and its own
      # refusals are the thing that must not rot: a fail-closed check that goes
      # green when it cannot look converts an open defect into a closed one.
      # This step drives all thirty-five named arms offline on every
      # pull request -- the same argument as the fragment self-test above.
      - name: Show the comment poster refusing every body it cannot vouch for
        run: python3 .claude/workflows/gh_comment.py self-test

      # The `record` predicate was narrowed (#752) only because a sweep measured
      # what each candidate would refuse, and that sweep stays in the tree so the
      # next seat proposing a narrowing reads its numbers instead of re-deriving
      # them. It lives under `tools/audit/`, which is INERT in tests/closure.py,
      # so the gate never selects it -- the same position `prepr.sh` and
      # `push.sh` are in, and the same answer: an explicit step in a job that is
      # never scoped. #762's fix review is why this is here rather than nowhere.
      # The instrument's own null control had been vacuous since it was written,
      # and nothing in CI could have said so.
      #
      # ONLY `--self-test`, which is pure over its fixtures: no network, no `gh`,
      # no repository state. The range sweep is deliberately NOT wired. It needs
      # a bulk API listing, takes tens of seconds, and prints a table with no
      # pass condition -- its figures slide with the window by design, so a job
      # asserting any of them would be asserting the calendar. A check that
      # cannot fail for a reason is the defect this step exists to catch.
      - name: Show the record-predicate sweep refusing its own perturbations
        run: node tools/audit/record-predicate/sweep.mjs --self-test

      - name: Report what the linter found
        if: always()
        run: node .claude/workflows/policy_lint.mjs --report || true

  # THE LANES ABOVE RUN IN ONE ENVIRONMENT. Five separate assertions in this
  # repository were CORRECT and never RAN, because whether they run is decided
  # by a fact about the clone -- shallow or not, origin/main present or not,
  # HEAD equal to origin/main or not, the scanned population empty or not --
  # and each run looked identical to one where they did. Two of the five were
  # written by the very commits that landed the countermeasures for the
  # previous class. See docs/decisions/0004.
  #
  # This job builds the environment shapes the repository declares it supports
  # and requires each shape's declared outcome. It is the thing no author's
  # single run can establish, so it is a separate job rather than another step
  # above: `policy-docs` proves the checks are right, this proves they ran.
  env-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The matrix derives its baseline from origin/main and grafts a
          # shallow shape from HEAD~1; both need real history.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      # The matrix REFUSES when it cannot find a main ref, which is right --
      # a baseline it had to guess at is the defect it exists to catch -- but
      # `actions/checkout` gives no guarantee about remote-tracking refs, and a
      # fail-closed matrix that cannot find its baseline is permanently red CI.
      # Fetch it explicitly so the refusal only ever means what it says.
      - name: Put origin/main where the matrix looks for it
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      # GITHUB_TOKEN: the `pr` shape below asserts NOTHING skips in a full
      # clone, and the required-contexts class needs credentials to look at the
      # live ruleset -- a real pull-request run has them (the token is mapped on
      # the policy-docs lint step), so the shape that models that run needs them
      # too. Without it the fetch fails and the class skips, which the zero-skip
      # row refuses: correctly, because that is not the environment a real run
      # is in. First measured the other way -- this job's own run at 23cc6e0.
      - name: Require each declared environment shape to produce its declared outcome
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .claude/workflows/policy_lint_envmatrix.mjs "$PWD" "${RUNNER_TEMP}/envmatrix" "$(git rev-parse HEAD)"

  wave-script:
    # The control flow a wave resume rests on. `.claude/` is INERT in
    # tests/closure.py -- and closure.py FAILS if an INERT path appears in a
    # recorded closure -- so the gate structurally cannot select this. It ran by
    # hand only, and the two defects it now pins (a stage vocabulary the rosters
    # and the script did not share, a verdict class no script read) both shipped
    # and stayed shipped. Never scoped, on the tests.yml `briefs` precedent.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Drive the wave script's branching
        run: node .claude/workflows/check-wave-script.mjs

  pr-contract:
    # The evidence sections a body owes, checked at the head CI is running.
    # `pull_request: [edited]` is why this workflow is separate from tests.yml:
    # a body edit must re-run this and must NOT re-run the forty-minute gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # THE ONE GRANT THIS JOB ADDS IS A READ. The red-list step below reads the
    # head's check runs through `/commits/<sha>/check-runs`, which the token
    # refuses without `checks: read` (#956); `contents: read` restates the
    # workflow floor a job-level block replaces, because the checkout needs
    # it. A read-only widening on the one job that reads the API is the
    # `nightly-status` precedent in tests.yml, and the override pin in
    # tests/entities.py counts this block and carries this argument.
    permissions:
      contents: read
      checks: read
    steps:
      # fetch-depth 0 because `## Approval` is keyed on the DIFF (R3-D11-03):
      # the base commit has to be in the clone for `git diff base...head` to
      # answer. The default depth-1 checkout has neither the base nor any
      # history, and a diff that cannot run would read as "touches no policy
      # file" -- the fail-open this keying exists to close.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Show the pre-PR self-check refusing its own fixtures
        run: bash tools/audit/prepr.sh --self-test

      # The push script's own decisions, driven over the same fixtures. It runs
      # here rather than in the gate because `tools/audit/` is INERT in
      # tests/closure.py -- nothing under tests/ reads it -- and this job is
      # never scoped, the same argument prepr.sh's line above rests on.
      - name: Show the push script's decisions refusing their own fixtures
        run: bash tools/audit/push.sh --self-test

      - name: Write the body as the API returned it
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > /tmp/pr-body.md

      # The paths decide whether `## Approval` is owed, so this runs WITHOUT
      # `|| true` and with `set -o pipefail`: a derivation that fails must fail
      # the step. policy_lint refuses an unreadable or empty list for the same
      # reason -- an empty diff is not a thing a pull request has.
      - name: List the paths this pull request changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --no-renames, and it is not cosmetic: a rename is reported by its
          # DESTINATION only, so moving CLAUDE.md to RENAMED.md yields a list
          # matching no glob and the approval gate would not fire on the change
          # that removed a policy file. Measured both ways before wiring it.
          git diff --no-renames --name-only "$PR_BASE...$PR_HEAD" > /tmp/pr-files.txt
          wc -l < /tmp/pr-files.txt

      # #956: the red-check trigger CLAUDE.md calls enforced, enforced. The
      # head's check runs are listed FIRST, the red names are handed to the
      # body check as `--red`, and the same body that exited 0 when CI passed
      # no `--red` exits 1 now -- the only behaviour change of this wiring.
      #
      # THE EXCLUSION KEY IS THE CHECK-RUN NAME `pr-contract`, and nothing
      # else. Every run this job ever produces carries that name -- GitHub
      # Actions names a job's check run after the job, this job has no matrix,
      # and re-runs keep the name -- so keying on it excludes this job's OWN
      # prior runs at the head whatever produced them: the `synchronize` run,
      # the `edited` run a body edit fires at the outgoing head (#1031's run
      # 34896491442 sat exactly there), a manual re-run's new attempt. A key
      # on any run or attempt IDENTIFIER is wrong twice over: a re-run gets a
      # new id, and an event-driven re-run at the SAME head gets a new run id
      # -- the #1031 shape -- so an id-keyed exclusion lets this job's own red
      # back into the list and the deadlock the caveat names returns: a body
      # refused for not naming a red caused by not naming it. The name key
      # cannot exclude a FOREIGN red -- a red from another check the body must
      # answer -- because the listing's other entries are runs other jobs
      # produced and every foreign job carries a foreign name; `pr-contract`
      # is the only job by that name in this repository. RED means the
      # corpus's own predicate: conclusion `failure` at the head, so a
      # skipped, cancelled, timed-out or still-running check is not red, and a
      # check that failed and then succeeded still is (the listing, never
      # `gh pr checks` -- the no-gh rule's own reason). One call, one page per
      # hundred runs (`--paginate`): single-digit seconds inside a job that
      # already runs about 75 s.
      - name: List the red checks at this head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Fail-closed, on the paths-file step's own principle: a derivation
          # that fails must fail the step, because an empty red list read from
          # a failed fetch is "no reds" -- the fail-open this wiring closes.
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD}/check-runs" \
            --jq '.check_runs[]
                   | select(.status == "completed" and .conclusion == "failure")
                   | select(.name != "pr-contract")
                   | .name' | sort -u > /tmp/pr-reds.txt
          printf 'red checks the body must answer: %s\n' \
            "$(paste -sd, /tmp/pr-reds.txt)"

      - name: Check the body against the contract
        env:
          # Interpolating a title into a shell line is script injection: the
          # title is written by whoever opened the pull request. The same is
          # true of the title as EVIDENCE, which is R3-D11-03: `## Approval` is
          # keyed on --paths-file below, and the title only adds to it.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # One --red flag per name, never one comma-joined value: a check
          # name containing a comma would split into fragments neither the
          # refusal nor `## Red checks` can match.
          RED_ARGS=()
          while IFS= read -r name; do
            RED_ARGS+=(--red "$name")
          done < /tmp/pr-reds.txt
          node .claude/workflows/policy_lint.mjs \
            --pr-body /tmp/pr-body.md --head "$PR_HEAD" --title "$PR_TITLE" \
            --paths-file /tmp/pr-files.txt "${RED_ARGS[@]}"

      # #679: `## Figures` asks for the command that printed each figure, and
      # nothing looked at it. The section was a paste. #715 round seven is the
      # defect: an enumerator passing `--arg` to `gh api`, which has no such
      # flag, so it errored client-side and printed `0` for every possible state
      # of the world. A fix reviewer found it by running it.
      #
      # This does NOT execute the body. #679 proposed re-executing an allowlist
      # and comparing values; figure_lint.mjs's header records the reasons that
      # is refused and which of them were withdrawn under measurement. The
      # shortest surviving one WAS that this job checks out at depth 1 with no
      # origin/main -- and #818 falsified it by setting fetch-depth: 0 above, so
      # reason 4 in figure_lint.mjs's header is the one that still stands. Do NOT
      # restate a quantity here: two of the original four
      # reasons were counts, both were wrong, and this copy is where the wrong
      # ones survived a sweep of the body, the header and both plan rows.
      # What the check does is confirm that each command RESOLVES.
      - name: Show the figure check refusing its own fixtures
        if: always()
        run: node .claude/workflows/figure_lint.mjs --self-test

      # The enumerator behind the two quantities that header argues from. It is
      # run here for its self-test only -- no `gh`, no network: an enumerator
      # nobody executes rots into the false figure it exists to prevent, which
      # is the #715 defect one level up.
      - name: Show the figure census pinning its counting rule
        if: always()
        run: node .claude/workflows/figure_census.mjs --self-test

      - name: Every figure's command resolves at this head
        if: always()
        run: node .claude/workflows/figure_lint.mjs --pr-body /tmp/pr-body.md

      - name: Pre-flight the body for unmeasured claims
        if: always()
        run: bash tools/audit/preflight.sh < /tmp/pr-body.md || true

  # The loop around the corpus, rather than the corpus itself: is every merge
  # dispositioned, what is costing seats time, and which rules have outlived
  # their reason.
  #
  # NEVER ON `pull_request`, and not by omission -- the workflow's `on:` block
  # carries that trigger for `policy-docs`, so this job states the exclusion
  # itself. All three modes read `<ref>..origin/main`. On a pull_request event
  # the checkout is a merge of the branch into main and the branch's own commits
  # are not in main's history, so the window would describe a history the branch
  # is not part of: the job would refuse merges it did not cause and miss the one
  # under review, which does not exist as a merge yet.
  #
  # THE SPLIT (#958, D11-05): the disposition check still runs, still refuses,
  # and still prints its refusal -- but its exit code no longer reddens this
  # run. A merge is rowless for the whole batch interval the record protocol
  # promises, so a red that only the next `record:` beat can clear is a
  # treadmill rather than a detector: at `132bebc` this run went red refusing
  # #1027's merge, and the very next push (`2a480b6`, the beat writing its
  # row) was green again. The pre-merge alternative stays refused on #541's
  # measured five false refusals per true one. The refusal is carried instead,
  # on the `delivery-status` reporter shape: the step below keeps failing
  # visibly inside this job while the job concludes success, and the reporting
  # step after it puts the refusal on the run's summary page, where a seat
  # reads it. Neither surface is a required context and neither may become
  # one -- requiring a refusal only the next beat can clear would block every
  # unrelated merge, the `nightly-status` precedent.
  record:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # --stats reads pull-request bodies and review comments through the API.
      pull-requests: read
      # The friction-filing step below opens and edits the recurring-friction
      # issues its histogram names (#959, option B). This is the owner's grant,
      # not this file's judgement: #201 comment 5670207248 item 4 approves
      # `issues: write` on this one job. It is declared on the job that uses it
      # rather than the workflow floor precisely so no other lane inherits it:
      # `policy-docs`, `env-matrix`, `wave-script` and `delivery-status` keep
      # the read-only floor, `pr-contract` keeps whatever it holds, and the set
      # of overriding jobs is pinned in tests/entities.py as the blast radius.
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The window is `<last version tag>..origin/main`. A shallow checkout
          # has neither the tag nor the history, and `git log` on one answers
          # "no merges" -- which this job would otherwise report as "every merge
          # is dispositioned", the exact zero-means-two-things confusion the
          # --stats fetch guard exists to refuse.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Choose the window
        id: window
        run: |
          # --match 'v*': `git describe --tags --abbrev=0` on this repository
          # returns `archive-rosters-2026-09`, a non-release tag that is newer
          # than v6.3.18 and yields an empty window.
          SINCE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$SINCE" ]; then SINCE=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "window: $SINCE..origin/main"

      # THE REFUSAL, kept whole. A merged pull request with no disposition in
      # the plan of record or the living handover is a refusal: the
      # Delivery-status table is what a resuming seat reads, and a merge
      # missing from it is work no later session can find. The command is the
      # one this step has always run; `pipefail` keeps the pipeline's exit code
      # the check's own, and `tee` captures its output for the report below.
      # `continue-on-error` is the whole of the split: the step still fails --
      # red step, ERROR lines in this log -- and the job no longer does.
      - name: Every merged pull request has a disposition
        id: refusal
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node .claude/workflows/policy_lint.mjs --record \
            --since "${{ steps.window.outputs.since }}" \
            2>&1 | tee "$RUNNER_TEMP/record.txt"

      # The reported surface, on the `delivery-status` reporter shape: the
      # verdict, the refusal itself, and a footer stating what the verdict
      # gates -- nothing. Written to the run's summary page, which is the
      # first thing a seat opening this run reads, and echoed to this log so
      # it is greppable without the UI. Both arms report, the way
      # `delivery_status.py` prints OK and not only OVERDUE.
      - name: Report the refusal on the run summary
        if: always()
        env:
          REFUSAL_OUTCOME: ${{ steps.refusal.outcome }}
        run: |
          if [ "$REFUSAL_OUTCOME" = "failure" ]; then
            VERDICT="REFUSED -- merged pull request(s) with no disposition"
          else
            VERDICT="clean -- every merged pull request in the window has a disposition"
          fi
          {
            echo "### record: $VERDICT"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/record.txt" 2>/dev/null \
              || echo "(the disposition check produced no output)"
            echo '```'
            echo
            echo "Reported, not gated (#958): a rowless merge is the batch interval the"
            echo "record protocol promises, cleared by the next \`record:\` beat writing"
            echo "the row. This surface is not a required context and must not become one."
          } | tee /dev/stderr >> "$GITHUB_STEP_SUMMARY"

      # Reporting only, and deliberately unable to fail the job: a histogram and
      # a sunset list are inputs to a judgement a seat makes, not a gate. Both
      # print what they would open; since #959 (option B) the histogram's
      # would-open verdicts are ACTED ON by the filing step below, but the
      # printing itself stays informational -- a histogram that cannot be
      # produced must never redden this lane, because the disposition check
      # above already owns this job's deliberate failures. `tee` captures the
      # histogram for that step without changing this step's exit behaviour.
      - name: Friction and verdict histograms
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .claude/workflows/policy_lint.mjs --stats --since "${{ steps.window.outputs.since }}" 2>&1 | tee "$RUNNER_TEMP/stats.txt" || true

      # THE SPLIT OF THE LANE (#959). The step below is the one path in this
      # job allowed to ACT, and it runs WITHOUT `|| true`: a filing mechanism
      # that fails silently is a mechanism that stopped filing, and nobody
      # would notice. Exactly which lanes can redden this job after #959:
      # THIS step and the checkout/setup steps above it can; the histogram and
      # sunset steps never can (both `|| true`), and the disposition refusal
      # reports without reddening (#958's split, `continue-on-error` above).
      # The self-test beside it keeps the filer's own refusals from rotting
      # the way an unexecuted enumerator's does -- driven offline, no network,
      # the same pattern as `gh_comment.py self-test` in `policy-docs`.
      - name: Show the friction filer refusing its own fixtures
        run: node .claude/workflows/friction_issues.mjs --self-test

      # The trigger text is the histogram's own line: this step parses the
      # would-open verdicts out of the captured output and files one issue per
      # friction key per window -- search before create, scoped to the exact
      # title, update in place, never a duplicate. The verdict classifier,
      # the threshold and the merge-is-not-rework exclusion stay in
      # policy_lint.mjs; an excluded class prints `not opened:` and is not a
      # trigger, so this step cannot fire on the passing grammar. A filed
      # issue's body carries the histogram line, the window and the derivation
      # command, and states that a seat -- never the bot -- disposes it.
      - name: File the recurring-friction issues the histogram named
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .claude/workflows/friction_issues.mjs --stats-file "$RUNNER_TEMP/stats.txt" --since "${{ steps.window.outputs.since }}"

      - name: Rules that have outlived their reason
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .claude/workflows/policy_lint.mjs --sunset --since "${{ steps.window.outputs.since }}" || true

  # `main`'s CURRENT `record` conclusion, reported as a red check on every pull
  # request. #713's construction (`nightly-status`, `tests/nightly_status.py`)
  # pointed at `record` instead of the nightly, because #533 and this are the
  # same shape: a conclusion that lands on a commit nobody re-reads.
  #
  # WHY IT IS NEEDED WHILE `record` ABOVE IS CORRECT. `record`'s `if:` is right
  # and the job above says why. The defect, when this job shipped, was that
  # `record` -- then one of the required contexts the `main-protect` ruleset's
  # endpoint returned, and since dropped from them by #884 -- reported
  # `skipped` on the only event a seat reads it at: every other required
  # context `success` and `record` alone `skipped` at #734's head `b63470b`.
  # The live set is the required checks that endpoint returns, never a count
  # from here. So the disposition rule is enforced only after a
  # merge and the red lands on whoever pushes next: seven red-`main` events in
  # the five days to 2026-09-10, the last of them #734 merging with no row nine
  # hours after #708 landed the protocol saying the row precedes the merge.
  # This does not prevent that merge. It converts "`main` is red and nobody
  # looks" into "every open pull request says so". Root cause on #541 comment
  # 5622000848; its home for the record is #678, where (c) is already recorded
  # for the identical cause on a different surface.
  #
  # It must NOT be added to `main-protect`'s required contexts. That is a
  # ruleset change and a separate owner decision, and requiring it would make
  # one lane's unfixed red refuse every unrelated merge in the repository -- for
  # a condition the pull request's author did not cause and usually cannot fix.
  # The report says so on every run, green as well as red.
  #
  # Pull requests only. A lane reporting on `main`'s own state must not be able
  # to turn `main` red: that would put the reporter inside the thing it reports
  # on, and one unfixed row would redden every subsequent push.
  # The delivery ledger, which replaced `record-status`'s predicate. See
  # `tests/delivery_status.py` for the measurement that motivated it: `record`
  # concluded `failure` on 28 of main's last 40 commits, in six streaks each
  # ended by a `record:` leftover-row commit, because it asked whether every
  # merge has a row RIGHT NOW while the protocol promises a row SOON, in a
  # batch. This asks what the protocol actually promises.
  #
  # On a pull request it reports and does not gate: `--check` is passed so a
  # genuinely stalled batch is red, and pending merges are printed by name,
  # which is the part a seat can act on and which a tick never was.
  #
  # `--since` is deliberately not passed: the window is the last release tag,
  # and a fixed one would report the same closed window for ever.
  # `tests/entities.py` pins that absence, the way it pins `nightly_status.py`
  # taking no `--run`.
  delivery-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The window is `<last tag>..origin/main`, so the tags and main's
          # history both have to be here. A shallow clone would silently
          # report an empty window, which is the vacuous green this check
          # names as its own failure mode.
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      # No `pip install`, the same reason `record-status` had none: a reporter
      # whose job is to notice that something went dark must not be breakable
      # by the dependency set, and it costs seconds beside a forty-minute gate.
      - name: Report what is pending and what is overdue a row
        run: |
          git fetch --no-tags --quiet origin main
          python tests/delivery_status.py --check

  # The committed ledger and #201's region, regenerated on every push to main.
  # This is the half that makes the state findable WITHOUT credentials: any
  # session reads `docs/delivery-status.json` with `cat`, and #201's body
  # carries the same content in a delimited region so the issue's own tracking
  # text survives each update.
  #
  # #1011 (owner decision, Option 2): the ledger lands through a pull request,
  # the autofix bots' shape. The direct bot push this job shipped with was
  # declined by the ruleset on every run since the job landed -- GH013, because
  # a GITHUB_TOKEN push can never satisfy main's PR-context required-checks
  # rule -- so no `ci: regenerate the delivery ledger` commit ever reached
  # main, and the #201 step after the push never ran either. The commit now
  # goes to the bot-owned `ci/delivery-ledger` branch, this job opens (or
  # updates) that branch's PR, and `delivery-status-splice` below puts the
  # content in #201 when that PR merges. A PR opened by GITHUB_TOKEN starts
  # its checks in the approval-required state; that is the review path the
  # decision chose, not an obstacle to it: a seat approves the workflows, the
  # required contexts run, and a seat merges.
  delivery-status-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Commits one generated path to the bot branch and opens that branch's PR.
    # A third override of this workflow's `contents: read` floor, declared at
    # JOB level so no other job inherits it, and argued rather than assumed:
    # publishing the state is the whole point of this job, and it can write
    # nothing else. The `issues: write` this job once held moved with the #201
    # splice to `delivery-status-splice`.
    permissions:
      contents: write
      pull-requests: write
    # Ledger finding (b) (#201, W4D-G6): every push to main starts one of
    # these jobs, and a wave close pushes to main in bursts -- the ledger
    # PR's own merge is one -- so two can be in flight at once with nothing
    # to order them: run A's force-push to ci/delivery-ledger can land
    # between run B's force-push and B's body edit, leaving the PR body
    # naming a head the branch no longer carries. The group is JOB-scoped
    # and named for this lane alone, so no other job or workflow shares it.
    # cancel-in-progress rather than a queue: every arm of this job is a
    # wholesale regeneration -- the ledger is re-derived from the newer
    # push, the branch push is `--force`, the body edit rewrites the whole
    # body -- so the newer run supersedes the older run's output outright,
    # and a run cancelled mid-force-push leaves a half-updated cycle branch
    # that the cancelling run rebuilds in full (the branch is bot-owned and
    # lands only through the PR below).
    concurrency:
      group: delivery-status-publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Regenerate the ledger
        run: python tests/delivery_status.py --emit docs/delivery-status.json

      # Commits only when the content moved, so a re-run at the same window
      # opens nothing: `ledger unchanged; nothing to commit` is this job's
      # ordinary green, the only shape it was ever green in.
      - name: Commit it when it moved
        id: ledger
        run: |
          if git diff --quiet -- docs/delivery-status.json; then
            echo "ledger unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/delivery-status.json
          git commit -m "ci: regenerate the delivery ledger"
          echo "moved=true" >> "$GITHUB_OUTPUT"

      # The branch is rebuilt from this push's main every time, so the push is
      # a force: a fast-forward would be refused against the previous cycle's
      # commit. It is bot-owned, lands only through the PR below, and no
      # ruleset governs it.
      - name: Push the ledger branch
        if: steps.ledger.outputs.moved == 'true'
        run: git push --force origin HEAD:refs/heads/ci/delivery-ledger

      # The body is rewritten on every cycle, because `## Head` must name the
      # head the checks run at: a body describing an older head is exactly
      # what `pr-contract` exists to refuse, and it refuses it on this PR like
      # any other.
      - name: Open or update the ledger PR
        if: steps.ledger.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          cat > "$RUNNER_TEMP/body.md" <<'EOF'
          The delivery ledger, regenerated by `tests/delivery_status.py` from
          the window ending at the push that opened this PR. Landed through
          review (#1011, owner Option 2) rather than a bot push the ruleset
          declines; #201's region is spliced when this PR merges.

          ## Head

          @SHA@ -- the branch head; generated content, measured by nothing.

          ## Mutation proof

          n/a: generated artifact. The diff is the generator's own output;
          the generator and the job that opens this PR are pinned in
          tests/entities.py.

          ## Null control

          The job regenerates against the committed ledger and opens nothing
          when the content already matches: `ledger unchanged; nothing to
          commit` exits 0.

          ## Figures

          none

          ## Red checks

          none

          ## Forward-carry

          none

          ## Friction

          none
          EOF
          sed -i "s/@SHA@/$SHA/" "$RUNNER_TEMP/body.md"
          TITLE="ci: regenerate the delivery ledger"
          if gh pr view ci/delivery-ledger --json state --jq .state \
              2>/dev/null | grep -qx OPEN; then
            gh pr edit ci/delivery-ledger \
              --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
            echo "LEDGER: open PR updated at $SHA"
          else
            gh pr create --base main --head ci/delivery-ledger \
              --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
            echo "LEDGER: PR opened at $SHA"
          fi

  # The #201 half of #1011's Option 2. The splice used to sit in the publish
  # job AFTER the push step, so the ruleset's GH013 refusal meant it never
  # ran: #201's body carries no delivery-status region at all, and the
  # ledger's designed publication surface never existed. It now fires on the
  # merge of the ledger PR itself -- an event a SEAT causes by merging, not a
  # GITHUB_TOKEN side effect, so it needs no approval gate -- and reads the
  # LANDED ledger off the merge commit, so the issue carries what main
  # carries rather than a branch's proposal.
  delivery-status-splice:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'ci/delivery-ledger'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `issues: write` edits #201's region; `contents: read` restates the
    # workflow floor a job-level block replaces, for the checkout below. This
    # is the grant the publishing lane held before #1011 moved the splice
    # here -- moved, not added, which is what the floor's pinned set is for.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The merge commit, where docs/delivery-status.json is main's; a
          # shallow checkout answers, because the splice reads one file and
          # the issue body and walks no history.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Put the landed ledger in #201's region
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tests/delivery_status.py \
            --from docs/delivery-status.json --markdown > "$RUNNER_TEMP/region.md"
          python - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, "tests")
          import delivery_status as ds
          body = subprocess.run(
              ["gh", "issue", "view", "201", "--json", "body", "--jq", ".body"],
              capture_output=True, text=True, check=True).stdout.rstrip("\n")
          region = pathlib.Path(os.environ["RUNNER_TEMP"], "region.md").read_text()
          updated = ds.splice(body, region.rstrip("\n"))
          if updated == body:
              print("#201's region is already current")
          else:
              pathlib.Path(os.environ["RUNNER_TEMP"], "body.md").write_text(updated)
              subprocess.run(
                  ["gh", "issue", "edit", "201", "--body-file",
                   os.environ["RUNNER_TEMP"] + "/body.md"], check=True)
              print("#201's region updated")
          PY

