# The governance gate: the policy corpus's own refusal.
#
# WHY A SEPARATE WORKFLOW. `tests.yml` is the code gate, scoped from measured
# closures. The policy corpus is INERT by prefix in tests/closure.py -- nothing
# under tests/ reads CLAUDE.md, `.cursor/rules/` or `tools/audit/briefs/` --
# so a policy-only pull request selects zero scripts and its whole mechanical
# signal is four green ticks that measured nothing. This job is never scoped,
# the same precedent as tests.yml's `briefs` job, which lints the wave rosters
# from the same INERT directory.
#
# It is its own file rather than another job in tests.yml for one measured
# reason: `pr-contract` (added later) must run on `pull_request: [edited]`, and
# adding that type to tests.yml would re-run the whole forty-minute gate every
# time a body is edited.

name: Governance

on:
  push:
    branches:
      - main
  pull_request:
    # `edited` is the point of this workflow being separate from tests.yml: a
    # body edit must re-check the contract and must NOT re-run the forty-minute
    # gate. The other two jobs here take about ten seconds, so re-running them
    # on an edit costs nothing worth optimising.
    types: [opened, edited, synchronize, reopened]
  # 07:00 UTC on Mondays. The `record` job below is the only one that needs a
  # clock: a merge with no disposition is not detectable from any one pull
  # request, so nothing on the `pull_request` path can ever find it, and a
  # window that only advances on a push to main goes unmeasured in a quiet week.
  # `policy-docs` runs on this trigger too, which is the same lint it already
  # runs on every push to main and costs a runner-minute.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # The citation resolvers ask git whether a path or symbol exists at a
          # cited tag; a shallow checkout answers "no" for every one of them.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Refuse a Cursor rule that is not the generated form of its source
        run: node .claude/workflows/rules_sync.mjs --check

      - name: Lint the policy corpus
        run: node .claude/workflows/policy_lint.mjs

      # Three corpus checks shipped measuring nothing, each with an acceptance
      # its author believed pinned it. This lane empties one check at a time --
      # the corpus enumeration and the record mode's, and for the `caps` rule
      # the regex list it scans as well as the check itself -- and demands the
      # acceptance refuse it, so a check that survives its own removal is named
      # on the pull request that lands it rather than by the next adversarial
      # reader.
      - name: Refuse a corpus or record-mode check that survives its own deletion
        run: node .claude/workflows/policy_lint_mutants.mjs

      # A workflow script cannot import another, so the five web-*.js each carry
      # their own copy of the shared prompt block and web-fragments.md said to
      # keep them in sync by hand. The copy was not byte-identical in the commit
      # that created it, and stayed that way.
      - name: Refuse a prompt fragment that has drifted from its canonical text
        run: node .claude/workflows/fragments_sync.mjs

      - name: Show the fragment check refusing its own perturbation
        run: node .claude/workflows/fragments_sync.mjs --self-test

      - name: Refuse a hook that is missing, unwired, or fails its own self-test
        run: node .claude/workflows/policy_lint.mjs --hooks

      # `gh api -f body=@FILE` posts the literal path, exits 0, and returns a
      # well-formed comment object (#541 comment 5625671141). The countermeasure
      # is a program seats call instead of a bit seats remember, and its own
      # refusals are the thing that must not rot: a fail-closed check that goes
      # green when it cannot look converts an open defect into a closed one.
      # This step drives all thirty-five named arms offline on every
      # pull request -- the same argument as the fragment self-test above.
      - name: Show the comment poster refusing every body it cannot vouch for
        run: python3 .claude/workflows/gh_comment.py self-test

      - name: Report what the linter found
        if: always()
        run: node .claude/workflows/policy_lint.mjs --report || true

  # THE LANES ABOVE RUN IN ONE ENVIRONMENT. Five separate assertions in this
  # repository were CORRECT and never RAN, because whether they run is decided
  # by a fact about the clone -- shallow or not, origin/main present or not,
  # HEAD equal to origin/main or not, the scanned population empty or not --
  # and each run looked identical to one where they did. Two of the five were
  # written by the very commits that landed the countermeasures for the
  # previous class. See docs/decisions/0004.
  #
  # This job builds the environment shapes the repository declares it supports
  # and requires each shape's declared outcome. It is the thing no author's
  # single run can establish, so it is a separate job rather than another step
  # above: `policy-docs` proves the checks are right, this proves they ran.
  env-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The matrix derives its baseline from origin/main and grafts a
          # shallow shape from HEAD~1; both need real history.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The matrix REFUSES when it cannot find a main ref, which is right --
      # a baseline it had to guess at is the defect it exists to catch -- but
      # `actions/checkout` gives no guarantee about remote-tracking refs, and a
      # fail-closed matrix that cannot find its baseline is permanently red CI.
      # Fetch it explicitly so the refusal only ever means what it says.
      - name: Put origin/main where the matrix looks for it
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Require each declared environment shape to produce its declared outcome
        run: node .claude/workflows/policy_lint_envmatrix.mjs "$PWD" "${RUNNER_TEMP}/envmatrix" "$(git rev-parse HEAD)"

  wave-script:
    # The control flow a wave resume rests on. `.claude/` is INERT in
    # tests/closure.py -- and closure.py FAILS if an INERT path appears in a
    # recorded closure -- so the gate structurally cannot select this. It ran by
    # hand only, and the two defects it now pins (a stage vocabulary the rosters
    # and the script did not share, a verdict class no script read) both shipped
    # and stayed shipped. Never scoped, on the tests.yml `briefs` precedent.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Drive the wave script's branching
        run: node .claude/workflows/check-wave-script.mjs

  pr-contract:
    # The evidence sections a body owes, checked at the head CI is running.
    # `pull_request: [edited]` is why this workflow is separate from tests.yml:
    # a body edit must re-run this and must NOT re-run the forty-minute gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Show the pre-PR self-check refusing its own fixtures
        run: bash tools/audit/prepr.sh --self-test

      # The push script's own decisions, driven over the same fixtures. It runs
      # here rather than in the gate because `tools/audit/` is INERT in
      # tests/closure.py -- nothing under tests/ reads it -- and this job is
      # never scoped, the same argument prepr.sh's line above rests on.
      - name: Show the push script's decisions refusing their own fixtures
        run: bash tools/audit/push.sh --self-test

      - name: Write the body as the API returned it
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > /tmp/pr-body.md

      - name: Check the body against the contract
        env:
          # Interpolating a title into a shell line is script injection: the
          # title is written by whoever opened the pull request.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node .claude/workflows/policy_lint.mjs \
            --pr-body /tmp/pr-body.md --head "$PR_HEAD" --title "$PR_TITLE"

      # #679: `## Figures` asks for the command that printed each figure, and
      # nothing looked at it. The section was a paste. #715 round seven is the
      # defect: an enumerator passing `--arg` to `gh api`, which has no such
      # flag, so it errored client-side and printed `0` for every possible state
      # of the world. A fix reviewer found it by running it.
      #
      # This does NOT execute the body. #679 proposed re-executing an allowlist
      # and comparing values; figure_lint.mjs's header records the reasons that
      # is refused and which of them were withdrawn under measurement. The
      # shortest surviving one is that this job checks out at depth 1 with no
      # origin/main. Do NOT restate a quantity here: two of the original four
      # reasons were counts, both were wrong, and this copy is where the wrong
      # ones survived a sweep of the body, the header and both plan rows.
      # What the check does is confirm that each command RESOLVES.
      - name: Show the figure check refusing its own fixtures
        if: always()
        run: node .claude/workflows/figure_lint.mjs --self-test

      # The enumerator behind the two quantities that header argues from. It is
      # run here for its self-test only -- no `gh`, no network: an enumerator
      # nobody executes rots into the false figure it exists to prevent, which
      # is the #715 defect one level up.
      - name: Show the figure census pinning its counting rule
        if: always()
        run: node .claude/workflows/figure_census.mjs --self-test

      - name: Every figure's command resolves at this head
        if: always()
        run: node .claude/workflows/figure_lint.mjs --pr-body /tmp/pr-body.md

      - name: Pre-flight the body for unmeasured claims
        if: always()
        run: bash tools/audit/preflight.sh < /tmp/pr-body.md || true

  # The loop around the corpus, rather than the corpus itself: is every merge
  # dispositioned, what is costing seats time, and which rules have outlived
  # their reason.
  #
  # NEVER ON `pull_request`, and not by omission -- the workflow's `on:` block
  # carries that trigger for `policy-docs`, so this job states the exclusion
  # itself. All three modes read `<ref>..origin/main`. On a pull_request event
  # the checkout is a merge of the branch into main and the branch's own commits
  # are not in main's history, so the window would describe a history the branch
  # is not part of: the job would refuse merges it did not cause and miss the one
  # under review, which does not exist as a merge yet.
  record:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # --stats reads pull-request bodies and review comments through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The window is `<last version tag>..origin/main`. A shallow checkout
          # has neither the tag nor the history, and `git log` on one answers
          # "no merges" -- which this job would otherwise report as "every merge
          # is dispositioned", the exact zero-means-two-things confusion the
          # --stats fetch guard exists to refuse.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Choose the window
        id: window
        run: |
          # --match 'v*': `git describe --tags --abbrev=0` on this repository
          # returns `archive-rosters-2026-09`, a non-release tag that is newer
          # than v6.3.18 and yields an empty window.
          SINCE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$SINCE" ]; then SINCE=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "window: $SINCE..origin/main"

      # THE ONLY STEP THAT MAY FAIL THIS JOB. A merged pull request with no
      # disposition in the plan of record or the living handover is a refusal:
      # the Delivery-status table is what a resuming seat reads, and a merge
      # missing from it is work no later session can find.
      - name: Every merged pull request has a disposition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .claude/workflows/policy_lint.mjs --record --since "${{ steps.window.outputs.since }}"

      # Reporting only, and deliberately unable to fail the job: a histogram and
      # a sunset list are inputs to a judgement a seat makes, not a gate. Both
      # print what they would open and open nothing.
      - name: Friction and verdict histograms
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .claude/workflows/policy_lint.mjs --stats --since "${{ steps.window.outputs.since }}" || true

      - name: Rules that have outlived their reason
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .claude/workflows/policy_lint.mjs --sunset --since "${{ steps.window.outputs.since }}" || true

  # `main`'s CURRENT `record` conclusion, reported as a red check on every pull
  # request. #713's construction (`nightly-status`, `tests/nightly_status.py`)
  # pointed at `record` instead of the nightly, because #533 and this are the
  # same shape: a conclusion that lands on a commit nobody re-reads.
  #
  # WHY IT IS NEEDED WHILE `record` ABOVE IS CORRECT. `record`'s `if:` is right
  # and the job above says why. The defect is that `record` is one of
  # `main-protect`'s 18 required contexts while reporting `skipped` on the only
  # event a seat reads it at -- 17 `success` and `record` alone `skipped` at
  # #734's head `b63470b`. So the disposition rule is enforced only after a
  # merge and the red lands on whoever pushes next: seven red-`main` events in
  # the five days to 2026-09-10, the last of them #734 merging with no row nine
  # hours after #708 landed the protocol saying the row precedes the merge.
  # This does not prevent that merge. It converts "`main` is red and nobody
  # looks" into "every open pull request says so". Root cause on #541 comment
  # 5622000848; its home for the record is #678, where (c) is already recorded
  # for the identical cause on a different surface.
  #
  # It must NOT be added to `main-protect`'s required contexts. That is a
  # ruleset change and a separate owner decision, and requiring it would make
  # one lane's unfixed red refuse every unrelated merge in the repository -- for
  # a condition the pull request's author did not cause and usually cannot fix.
  # The report says so on every run, green as well as red.
  #
  # Pull requests only. A lane reporting on `main`'s own state must not be able
  # to turn `main` red: that would put the reporter inside the thing it reports
  # on, and one unfixed row would redden every subsequent push.
  record-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Check runs are Checks metadata, which this workflow's `contents: read`
    # floor cannot see. This is a widening of that floor and is written down as
    # one. It is read-only, and it is declared at JOB level: a job-level
    # `permissions:` block REPLACES the workflow default for this job alone and
    # is inherited by no other job, so `policy-docs`, `pr-contract` and `record`
    # are untouched. `tests/entities.py` pins the whole set of jobs in this file
    # that override the floor -- `record` and this one -- and that this one's
    # block carries no `write` at all, so a third override has to be argued for
    # rather than land.
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # No `pip install`, the same reason `nightly-status` has none: a check
      # whose job is to notice that something went dark must not be breakable by
      # the dependency set, and it costs seconds beside a forty-minute gate.
      - name: Report main's current `record` conclusion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tests/record_status.py
