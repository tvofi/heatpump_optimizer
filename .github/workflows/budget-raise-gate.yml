# The budget-raise gate (decision 0013, amended 2026-09-24): a raise in any
# `*_budgets.json` merges only on the owner's approving review at the head.
# The budget files carry no code owner, so a routine edit -- a ledger row, a
# metric re-recorded down -- merges on the approver App's review alone; the
# direction of the edit, not its path, is what calls for the owner.
#
# WHY ITS OWN FILE. It is the only job that must re-run when a review lands,
# since an approval is the one change it reads that a commit does not make.
# An event a workflow lists starts a run of every job in it, and a job an `if:`
# skips still writes a check run at the head -- a skipped run of a required
# context counts as passing (#1514's shape). So this file holds one job, it has
# no `if:`, and every run it starts computes the verdict in full.
#
# `pull_request_review` runs the pull request's workflow file, as
# `pull_request` does; `.github/workflows/` stays owned for that reason
# (0013). The check's program is pinned instead: restored from the base
# before it runs, under `python3 -I`, and nothing of the pull request's runs
# before it. `codeowners_gap.py --check` reads that restore.

name: Budget raise gate

on:
  pull_request:
    # `edited`: retargeting a pull request to another base fires it, and the
    # merge base the gate compares against moves with the base. A body edit
    # fires it too and re-runs the full verdict; this job has no `if:`, so the
    # run it writes is never a skipped one (#1514's shape).
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  # The merge queue (round-9 process review item 2): the same verdict, on a
  # queue entry for the pull request it carries. Still no `if:`, so no run
  # this file starts is a skipped one.
  merge_group:
    types: [checks_requested]

# Workflow-level and read-only: the reviews list needs `pull-requests: read`,
# the checkout `contents: read`, and the owner's recorded mandate, a comment
# on #201, `issues: read`. No job widens it.
permissions:
  contents: read
  pull-requests: read
  issues: read

# Superseded pull-request runs are cancelled, nothing else is: see the same
# block in tests.yml (round-9 process review item 3).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.sender.login != 'github-actions[bot]' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.sender.login != 'github-actions[bot]' }}

jobs:
  budget-raise-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth 0: the merge base and both ends are read out of the clone.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Restore the check source from the base commit
        env:
          PINNED: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$PINNED^{commit}" 2>/dev/null || git fetch -q --no-tags origin "$PINNED"
          git checkout "$PINNED" -- \
            '.claude/workflows/*.py'
          echo "check source restored from $PINNED: $(git diff --cached --name-only | wc -l) file(s) differ from the pull request's copy"
          test -f .claude/workflows/budget_raise_gate.py

      # THE MERGE QUEUE (round-9 process review item 2). A `merge_group` run
      # carries no pull request in its payload, so the entry is named from the
      # tree: its number from the queue branch's name, its head as the queue
      # commit's second parent (merge method MERGE), and the API must report
      # that same head or the step fails -- a run that cannot name what it
      # grades must not pass. On any other event it writes nothing and every
      # step below reads the payload as before. Outputs only, never
      # $GITHUB_ENV: nothing here can reach a later program, and it runs after
      # the restore, from admitted commands alone.
      - name: Name the pull request a queue entry carries
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "merge_group" ]; then
            NUMBER=$(printf '%s' "$QUEUE_REF" | jq -Rr 'capture("/pr-(?<n>[0-9]+)-[0-9a-f]{40}$").n')
            HEAD=$(git rev-parse --verify 'HEAD^2^{commit}')
            test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" --jq '.head.sha')" = "$HEAD"
            echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "base=$QUEUE_BASE" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD" >> "$GITHUB_OUTPUT"
            echo "queue entry: pull request $NUMBER at $HEAD on base $QUEUE_BASE"
          fi

      # The head is the payload's: it is the commit this run's check run is
      # written on. On a queue entry it is the pull request's head the step
      # above named, the head an owner's approval has to be at. The reviews are
      # read live, so a re-run after an approval reads the approval.
      - name: Refuse a budget raise the owner has not approved at this head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE: ${{ github.event.pull_request.base.sha || steps.pr.outputs.base }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || steps.pr.outputs.head }}
          PR_NUMBER: ${{ github.event.pull_request.number || steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          python3 -I .claude/workflows/budget_raise_gate.py \
            --base "$PR_BASE" --head "$PR_HEAD" --pr "$PR_NUMBER"
