&lt;section&gt;
  &lt;h2&gt;How the ETAs are computed&lt;/h2&gt;
  &lt;p class=&quot;note&quot;&gt;Every figure on this page is &lt;code&gt;plan.json&lt;/code&gt;&#x27;s, written by &lt;code&gt;tools/plan/replan.py&lt;/code&gt;; this renderer draws it and computes no schedule of its own. A wave is the set of groups dispatched at one moment, and the next opens as soon as one of 20 pull-request slots frees, so a wave never waits for the previous one to drain; the cap limits concurrency, not the wave boundary. Duration is dispatch to merge by roster size, as the plan recorded it from &lt;code&gt;tools/plan/durations.json&lt;/code&gt;: S 21.6 h, M 32.4 h, L 35.6 h, XL 35.6 h. p75 over 348 done groups with a merged PR (S n=227, M n=94, L n=21, XL n=6): active hours (the union of each part&amp;#x27;s first commit or creation, or the roster&amp;#x27;s dispatch stamp, to its merge) with extra review rounds priced out at the pooled Theil-Sen slope (5.65 h/round), then the cell&amp;#x27;s mean rounds added back; per class where a cell has n&amp;gt;=5. Wall clock: review, queueing and the PR-less handoff wait are inside it. carry_hours (0.28 h) is the Theil-Sen slope of the round-adjusted hours on the group&amp;#x27;s carry count, priced per carry above the size&amp;#x27;s median (carry_baseline). Monotone in size: XL 29.9 h lifted to L&amp;#x27;s 35.6 h. Measured by tools/plan/size_durations.py; re-derive, never edit. Input: 1021 merged PRs created since 2026-10-12, read by size_durations.fetch_rest (--via rest). A group whose fixer is already working gets 70% of its size duration as the remaining estimate, and starts now, past the slot cap, unless an unmerged dependency holds it; a held (carries-open) group is priced by its open carries, not its size. Hover an ETA for the group&#x27;s tier, why it starts when it does, its duration basis and its sort key, all the plan&#x27;s own fields. Those are measured lead times, not effort: review rounds and queueing are inside them. The batching window is 0 minutes; its measured trade is in &lt;code&gt;durations.json&lt;/code&gt;.&lt;/p&gt;
&lt;/section&gt;

  &lt;p class=&quot;note&quot;&gt;Issue chips: bold border = this group closes it; struck through = the issue is closed. ◆ marks the critical path. Tier is the plan&#x27;s dispatch priority: 1 main, 2 hotfixes, 3 outside requests and the critical path, unordered, 4 production and instruments saving 12 h or more, 5 other instruments by savings (— for a merged group); an ETA&#x27;s hover names the roster field that decided it. Blocked-by lists the roster&#x27;s &lt;code&gt;after&lt;/code&gt; groups not yet done. &lt;b&gt;Part merged&lt;/b&gt; means a merged pull request titled with the group delivered part of it and its brief names the residual, so the group stays open and is not counted as merged.&lt;/p&gt;

&lt;section&gt;
  &lt;h2&gt;Waves&lt;/h2&gt;
  &lt;p class=&quot;note&quot;&gt;Waves overlap. A wave is the set of groups dispatched at one moment, and the next opens as soon as one of the 20 pull-request slots frees; the cap still binds, no more than 20 groups in flight. A patch stamp is cut once 3 production groups have landed. Every row is the plan model&#x27;s output.&lt;/p&gt;

  &lt;p class=&quot;note&quot;&gt;Cadence: one patch stamp per 3 production groups merged, once main&#x27;s Tests are green and the release notes name every merged PR. The round-close stamp closes the programme: round N&#x27;s major, vN.0.0, the version &lt;code&gt;stamp.py --round-close N&lt;/code&gt; assigns.&lt;/p&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;h2&gt;How the ETAs are computed&lt;/h2&gt;
  &lt;p class=&quot;note&quot;&gt;Every figure on this page is &lt;code&gt;plan.json&lt;/code&gt;&#x27;s, written by &lt;code&gt;tools/plan/replan.py&lt;/code&gt;; this renderer draws it and computes no schedule of its own. A wave is the set of groups dispatched at one moment, and the next opens as soon as one of 20 pull-request slots frees, so a wave never waits for the previous one to drain; the cap limits concurrency, not the wave boundary. Duration is dispatch to merge by roster size, as the plan recorded it from &lt;code&gt;tools/plan/durations.json&lt;/code&gt;: S 21.6 h, M 32.4 h, L 35.6 h, XL 35.6 h. p75 over 348 done groups with a merged PR (S n=227, M n=94, L n=21, XL n=6): active hours (the union of each part&amp;#x27;s first commit or creation, or the roster&amp;#x27;s dispatch stamp, to its merge) with extra review rounds priced out at the pooled Theil-Sen slope (5.65 h/round), then the cell&amp;#x27;s mean rounds added back; per class where a cell has n&amp;gt;=5. Wall clock: review, queueing and the PR-less handoff wait are inside it. carry_hours (0.28 h) is the Theil-Sen slope of the round-adjusted hours on the group&amp;#x27;s carry count, priced per carry above the size&amp;#x27;s median (carry_baseline). Monotone in size: XL 29.9 h lifted to L&amp;#x27;s 35.6 h. Measured by tools/plan/size_durations.py; re-derive, never edit. Input: 1021 merged PRs created since 2026-10-12, read by size_durations.fetch_rest (--via rest). A group whose fixer is already working gets 70% of its size duration as the remaining estimate, and starts now, past the slot cap, unless an unmerged dependency holds it; a held (carries-open) group is priced by its open carries, not its size. Hover an ETA for the group&#x27;s tier, why it starts when it does, its duration basis and its sort key, all the plan&#x27;s own fields. Those are measured lead times, not effort: review rounds and queueing are inside them. The batching window is 0 minutes; its measured trade is in &lt;code&gt;durations.json&lt;/code&gt;.&lt;/p&gt;
&lt;/section&gt;
